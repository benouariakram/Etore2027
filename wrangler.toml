#:schema node_modules/wrangler/config-schema.json
name = "modanova-maroc"
compatibility_date = "2025-02-01"
pages_build_output_dir = "dist"

# ==============================================================================
# Base de données Cloudflare D1 (SQLite Serverless)
# Dans votre Dashboard Cloudflare Pages > Settings > Functions > D1 database bindings :
# Variable name : DB
# D1 database   : modanova-db
# ==============================================================================
[[d1_databases]]
binding = "DB"
database_name = "modanova-db"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
ADMIN_USER = "admin"
ADMIN_PASS = "modanova2025"
