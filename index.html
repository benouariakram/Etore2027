      // ========================================================================
      // Smart Image Compression for Firebase Firestore Persistence (< 300KB)
      // ========================================================================
      function compressImageFile(file, maxDim = 1100, quality = 0.82) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = reject;
          reader.onload = () => {
            const dataUrl = reader.result;
            if (typeof dataUrl !== 'string' || file.type === 'image/svg+xml') {
              return resolve(dataUrl);
            }
            const img = new Image();
            img.onerror = () => resolve(dataUrl);
            img.onload = () => {
              let { width, height } = img;
              if (width > maxDim || height > maxDim) {
                if (width >= height) {
                  height = Math.round((height * maxDim) / width);
                  width = maxDim;
                } else {
                  width = Math.round((width * maxDim) / height);
                  height = maxDim;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              if (!ctx) return resolve(dataUrl);
              ctx.drawImage(img, 0, 0, width, height);
              const compressed = canvas.toDataURL('image/jpeg', quality);
              resolve(compressed.length < dataUrl.length ? compressed : dataUrl);
            };
            img.src = dataUrl;
          };
          reader.readAsDataURL(file);
        });
      }

      // ========================================================================
      // Robust A4 Invoice HTML Builder (Zero White Pages, Strict CSS)
      // ========================================================================
      function buildInvoiceHTML(order, lang = 'fr') {
        const isAr = lang === 'ar';
        const dir = isAr ? 'rtl' : 'ltr';
        const font = isAr ? "'Cairo', sans-serif" : "'Plus Jakarta Sans', sans-serif";

        const orderId = escapeHTML(order.id || '');
        const dateStr = order.date ? new Date(order.date).toLocaleDateString(isAr ? 'ar-MA' : 'fr-FR', {
          year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
        }) : '';
        const clientName = escapeHTML(order.customerName || '');
        const clientPhone = escapeHTML(order.customerPhone || '');
        const city = escapeHTML(order.city || '');
        const address = escapeHTML(order.address || '');
        const notes = escapeHTML(order.notes || '');

        const subtotal = Number(order.subtotal || order.total || 0).toLocaleString(isAr ? 'ar-MA' : 'fr-FR');
        const discount = Number(order.discount || 0);
        const total = Number(order.total || 0).toLocaleString(isAr ? 'ar-MA' : 'fr-FR');

        let parsedItems = [];
        if (Array.isArray(order.items)) {
          parsedItems = order.items;
        } else if (typeof order.items === 'string') {
          try { parsedItems = JSON.parse(order.items); } catch { parsedItems = []; }
        }

        const itemsRows = (parsedItems || []).map((item, idx) => {
          const name = escapeHTML(isAr ? (item.nameAr || item.nameFr || item.name || 'Article') : (item.nameFr || item.name || 'Article'));
          const size = escapeHTML(item.size || '-');
          const color = escapeHTML(item.color || '');
          const qty = Number(item.quantity || item.qty || 1);
          const price = Number(item.price || 0).toLocaleString(isAr ? 'ar-MA' : 'fr-FR');
          const lineTotal = (Number(item.price || 0) * qty).toLocaleString(isAr ? 'ar-MA' : 'fr-FR');

          return `
            <tr style="border-bottom: 1px solid #ECE7E1;">
              <td style="padding: 10px 12px; text-align: ${isAr ? 'right' : 'left'}; font-weight: 600; color: #171717;">
                ${name}
                <div style="font-size: 11px; color: #7A6C5D; font-weight: normal; margin-top: 2px;">
                  ${isAr ? 'المقاس/الخيار:' : 'Option:'} ${size} ${color ? `| ${color}` : ''}
                </div>
              </td>
              <td style="padding: 10px 12px; text-align: center; color: #555; font-size: 13px;">${qty}</td>
              <td style="padding: 10px 12px; text-align: ${isAr ? 'left' : 'right'}; color: #555; font-size: 13px;">${price} MAD</td>
              <td style="padding: 10px 12px; text-align: ${isAr ? 'left' : 'right'}; font-weight: 600; color: #171717; font-size: 13px;">${lineTotal} MAD</td>
            </tr>
          `;
        }).join('');

        return `
          <div dir="${dir}" style="font-family: ${font}; color: #171717; background: #ffffff; padding: 24px; max-width: 780px; margin: 0 auto; box-sizing: border-box; font-size: 13px; line-height: 1.5;">
            <!-- Header -->
            <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #171717; padding-bottom: 18px; margin-bottom: 20px;">
              <div>
                <h1 style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 28px; letter-spacing: 4px; margin: 0; color: #171717; font-weight: 700;">MODANOVA</h1>
                <div style="font-size: 10px; letter-spacing: 2px; color: #9E8C7A; text-transform: uppercase; margin-top: 2px;">
                  MEN'S ESSENTIALS — MAROC
                </div>
              </div>
              <div style="text-align: ${isAr ? 'left' : 'right'};">
                <span style="display: inline-block; background: #F3F1EC; border: 1px solid #9E8C7A; color: #4A3525; padding: 4px 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; border-radius: 2px;">
                  ${isAr ? 'الدفع عند الاستلام (COD)' : 'Paiement à la livraison (COD)'}
                </span>
                <div style="font-size: 14px; font-weight: 700; color: #171717; margin-top: 6px;">
                  ${isAr ? 'طلب رقم' : 'Commande'} : <span style="color: #C28B53;">${orderId}</span>
                </div>
                <div style="font-size: 11px; color: #777;">${dateStr}</div>
              </div>
            </div>

            <!-- Client & Delivery Blocks -->
            <div style="display: flex; justify-content: space-between; gap: 20px; margin-bottom: 24px; background: #FAF9F6; padding: 14px 18px; border: 1px solid #ECE7E1;">
              <div style="flex: 1;">
                <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: #9E8C7A; letter-spacing: 1px; margin-bottom: 4px;">
                  ${isAr ? 'بيانات العميل' : 'Client & Coordonnées'}
                </div>
                <div style="font-size: 14px; font-weight: 700; color: #171717;">${clientName}</div>
                <div style="font-size: 13px; color: #444; direction: ltr; text-align: ${isAr ? 'right' : 'left'};">📞 ${clientPhone}</div>
              </div>
              <div style="flex: 1; text-align: ${isAr ? 'left' : 'right'};">
                <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: #9E8C7A; letter-spacing: 1px; margin-bottom: 4px;">
                  ${isAr ? 'عنوان التوصيل' : 'Adresse de Livraison'}
                </div>
                <div style="font-size: 13px; font-weight: 600; color: #171717;">📍 ${city}, Maroc</div>
                <div style="font-size: 12px; color: #555;">${address}</div>
                ${notes ? `<div style="font-size: 11px; color: #888; margin-top: 4px; font-style: italic;">Note: ${notes}</div>` : ''}
              </div>
            </div>

            <!-- Items Table -->
            <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
              <thead>
                <tr style="background: #171717; color: #FAF9F6;">
                  <th style="padding: 8px 12px; text-align: ${isAr ? 'right' : 'left'}; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;">
                    ${isAr ? 'المنتج' : 'Article'}
                  </th>
                  <th style="padding: 8px 12px; text-align: center; font-size: 11px; text-transform: uppercase; width: 60px;">
                    ${isAr ? 'الكمية' : 'Qté'}
                  </th>
                  <th style="padding: 8px 12px; text-align: ${isAr ? 'left' : 'right'}; font-size: 11px; text-transform: uppercase; width: 110px;">
                    ${isAr ? 'السعر' : 'Prix Unitaire'}
                  </th>
                  <th style="padding: 8px 12px; text-align: ${isAr ? 'left' : 'right'}; font-size: 11px; text-transform: uppercase; width: 110px;">
                    ${isAr ? 'المجموع' : 'Total'}
                  </th>
                </tr>
              </thead>
              <tbody>
                ${itemsRows}
              </tbody>
            </table>

            <!-- Totals -->
            <div style="display: flex; justify-content: flex-end; margin-bottom: 24px;">
              <div style="width: 280px; background: #FAF9F6; border: 1px solid #ECE7E1; padding: 12px 16px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 6px; color: #555; font-size: 12px;">
                  <span>${isAr ? 'المجموع الفرعي:' : 'Sous-total:'}</span>
                  <span>${subtotal} MAD</span>
                </div>
                ${discount > 0 ? `
                  <div style="display: flex; justify-content: space-between; margin-bottom: 6px; color: #10B981; font-weight: 600; font-size: 12px;">
                    <span>${isAr ? 'خصم (RAWCRAFT10):' : 'Remise (RAWCRAFT10):'}</span>
                    <span>-${discount.toLocaleString(isAr ? 'ar-MA' : 'fr-FR')} MAD</span>
                  </div>
                ` : ''}
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px; color: #555; font-size: 12px;">
                  <span>${isAr ? 'التوصيل السريع:' : 'Livraison express:'}</span>
                  <span style="color: #10B981; font-weight: 600;">${isAr ? 'مجاناً' : 'Gratuite'}</span>
                </div>
                <div style="border-top: 2px solid #171717; padding-top: 8px; display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; color: #171717;">
                  <span>${isAr ? 'المجموع للدفع عند الاستلام:' : 'TOTAL À PAYER (COD):'}</span>
                  <span style="color: #C28B53;">${total} MAD</span>
                </div>
              </div>
            </div>

            <!-- Footer & Signature -->
            <div style="border-top: 1px solid #ECE7E1; padding-top: 14px; text-align: center; color: #7A6C5D; font-size: 11px;">
              <div style="font-weight: 600; color: #171717; margin-bottom: 4px;">
                ${isAr ? 'شكراً لثقتكم في مودانوفا — دار الأناقة الرجالية بالمغرب' : 'Merci pour votre confiance en MODANOVA — Maison Marocaine des Essentiels'}
              </div>
              <div>Atelier & Support : Kenitra, Maroc | WhatsApp : +212 600-773716</div>
              <div style="font-size: 10px; color: #999; margin-top: 2px;">
                ${isAr ? 'يرجى تحضير المبلغ نقداً عند قدوم مندوب التوصيل.' : 'Veuillez préparer le montant exact en espèces à la livraison.'}
              </div>
            </div>
          </div>
        `;
      }

      // ========================================================================
      // Robust Print & Download Handlers
      // ========================================================================
      function printInvoice(order, lang) {
        if (!order) return;
        const printArea = document.getElementById('print-area');
        if (printArea) {
          printArea.innerHTML = buildInvoiceHTML(order, lang);

          const handleAfterPrint = () => {
            printArea.innerHTML = '';
            window.removeEventListener('afterprint', handleAfterPrint);
          };
          window.addEventListener('afterprint', handleAfterPrint);

          setTimeout(() => {
            window.print();
          }, 150);
        } else {
          window.print();
        }
      }

      function downloadInvoice(order, lang = 'fr') {
        if (!order) return;
        const invoiceBody = buildInvoiceHTML(order, lang);
        const fullHtml = `<!doctype html>
<html lang="${lang}" dir="${lang === 'ar' ? 'rtl' : 'ltr'}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facture MODANOVA — ${order.id || 'Commande'}</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 24px; background: #FAF9F6; font-family: 'Plus Jakarta Sans', sans-serif; }
    .toolbar { max-width: 780px; margin: 0 auto 16px auto; display: flex; justify-content: flex-end; gap: 10px; }
    .btn { background: #171717; color: #fff; border: none; padding: 10px 18px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
    .btn:hover { background: #C28B53; }
    @media print { .toolbar { display: none !important; } body { background: #fff; padding: 0; } }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="btn" onclick="window.print()">🖨️ Imprimer / Enregistrer en PDF</button>
  </div>
  ${invoiceBody}
</body>
</html>`;
        const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Facture-MODANOVA-${order.id || 'CMD'}.html`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }

      function formatMoroccanPhone(phoneStr) {
        if (!phoneStr) return '';
        const digits = String(phoneStr).replace(/\D/g, '');
        if (digits.startsWith('0')) {

      // ========================================================================
      // SEO Slug Helper
      // ========================================================================
      function slugify(text) {
        return String(text || '')
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/(^-|-$)+/g, '') || 'produit';
      }

      function getProductSlug(product) {
        if (!product) return '';
        const base = slugify(product.nameFr || product.nameAr || 'produit');
        return `${base}-${product.id}`;
      }

        // Dynamic countdown to 17:00 same-day dispatch
        const [countdown, setCountdown] = useState(() => {
          const now = new Date();

          cutoff.setHours(17, 0, 0, 0);
          if (now > cutoff) cutoff.setDate(cutoff.getDate() + 1);
          const diff = Math.max(0, cutoff - now);
          const hours = Math.floor(diff / (1000 * 60 * 60));
          const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          return { hours, mins };
        });

            const now = new Date();

          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        }, [lang]);

        const t = I18N[lang] || I18N.fr;

        // --- Data State ---
        const [products, setProducts] = useState(INITIAL_PRODUCTS);
        const [loadingProducts, setLoadingProducts] = useState(false);
        const [orders, setOrders] = useState([]);

        // --- Global CMS Settings State (Dynamic Fixed Texts & Media) ---

          topBanner: "Livraison express offerte sur toutes vos commandes au Maroc · Paiement à la livraison (COD)",

          guaranteeCod: "Paiement à la livraison après vérification de votre commande.",
          guaranteeQuality: "Garantie satisfaction et confection d'exception."
        });

        // --- Testimonials State (Dynamic CRUD Customer Reviews) ---
        const [testimonials, setTestimonials] = useState([
          {
            id: 1,
            name: "Karim Bennani",
            city: "Casablanca",
            rating: 5,
            text: "Qualité exceptionnelle ! La veste est impeccable, finitions très soignées et livraison reçue le lendemain à Casablanca. Paiement à la livraison très pratique.",
            verified: true,
            date: "2025-01-14"
          },
          {
            id: 2,
            name: "Mehdi Tazi",
            city: "Rabat",
            rating: 5,
            text: "MODANOVA est devenue ma marque de référence. Coupe moderne, tissus résistants et service client via WhatsApp ultra réactif. Je recommande à 100%.",
            verified: true,
            date: "2025-01-18"
          },
          {
            id: 3,
            name: "Yassine El Amrani",
            city: "Marrakech",
            rating: 5,
            text: "Très satisfait de ma commande. Les chaussures sont super confortables et la confection est de haut standing. Bravo pour ce niveau de qualité au Maroc.",
            verified: true,
            date: "2025-01-22"
          }
        ]);

        const fetchCms = useCallback(async () => {
          try {
            const res = await fetch('/api/cms');
            if (res.ok) {
              const data = await res.json();
              if (data && typeof data === 'object') {
                setCms(prev => ({ ...prev, ...data }));
              }
            }
          } catch {}
        }, []);

        const fetchTestimonials = useCallback(async () => {
          try {
            const res = await fetch('/api/testimonials');
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data) && data.length > 0) {
                setTestimonials(data);
              }
            }
          } catch {}
        }, []);

        useEffect(() => {
          fetchCms();
          fetchTestimonials();
        }, [fetchCms, fetchTestimonials]);

        // --- Persistent User State (Bulletproof LocalStorage) ---
        const [cart, setCart] = useState(() => {
          try {
            const saved = localStorage.getItem('modanova_cart') || localStorage.getItem('ettore_cart');
            if (saved) {
              const parsed = JSON.parse(saved);
              if (Array.isArray(parsed) && parsed.length > 0) {
                return parsed;
              }
            }
          } catch (e) {
            console.warn('Erreur lecture panier localStorage:', e);
          }
          return [];
        });

        const [wishlist, setWishlist] = useState(() => {
          try {
            const saved = localStorage.getItem('modanova_wishlist') || localStorage.getItem('ettore_wishlist');
            if (saved) {
              const parsed = JSON.parse(saved);
              if (Array.isArray(parsed)) return parsed;
            }
          } catch {
            return [];
          }
          return [];

        const [appliedPromo, setAppliedPromo] = useState(() => {
          return localStorage.getItem('modanova_promo') || localStorage.getItem('ettore_promo') || '';

        useEffect(() => {
          try {
            localStorage.setItem('modanova_cart', JSON.stringify(cart));

            if (pathMatch && pathMatch[1]) {
              const slugStr = decodeURIComponent(pathMatch[1]);
              const idMatch = slugStr.match(/-(\d+)$/);
              if (idMatch) return parseInt(idMatch[1], 10);
              if (/^\d+$/.test(slugStr)) return parseInt(slugStr, 10);
              return slugStr;
            }
            // 2. Query param ?produit=slug or ?product=id
            const params = new URLSearchParams(window.location.search);
            const p = params.get('produit') || params.get('product');
            if (p) {
              const idMatch = p.match(/-(\d+)$/);
              if (idMatch) return parseInt(idMatch[1], 10);
              if (/^\d+$/.test(p)) return parseInt(p, 10);
              return p;
            }
            // 3. Hash fallback
            const hashMatch = window.location.hash.match(/(?:produit|product)[-=/]([^/?#]+)/i);
            if (hashMatch && hashMatch[1]) {
              const idMatch = hashMatch[1].match(/-(\d+)$/);
              if (idMatch) return parseInt(idMatch[1], 10);

                  directCheckoutItem
                    ? {
                        subtotal: Number(directCheckoutItem.price) * Number(directCheckoutItem.quantity),
                        discount: appliedPromo.toUpperCase() === 'RAWCRAFT10' ? Math.round(Number(directCheckoutItem.price) * Number(directCheckoutItem.quantity) * 0.10) : 0,
                        shipping: 0,
                        total: Math.max(0, (Number(directCheckoutItem.price) * Number(directCheckoutItem.quantity)) - (appliedPromo.toUpperCase() === 'RAWCRAFT10' ? Math.round(Number(directCheckoutItem.price) * Number(directCheckoutItem.quantity) * 0.10) : 0)),
                        itemCount: directCheckoutItem.quantity
                      }
                    : cartTotals
                }
                promoCode={appliedPromo}
                lang={lang}
                t={t}
                onClose={() => {
                  setCheckoutOpen(false);
                  setDirectCheckoutItem(null);
                }}
                onSuccess={(createdOrder) => {
                  if (directCheckoutItem) {
                    setDirectCheckoutItem(null);
                  } else {
                    setCart([]);
                  }
                  setCheckoutOpen(false);
                  setCurrentInvoiceOrder(createdOrder);
                  showToast(t.toast_order_success, 'success');
                  fetchProducts();
                }}
                onError={(msg) => showToast(msg || t.toast_order_error, 'error')}
              />
            )}

            {/* ================================================================ */}
            {/* 14. ORDER TRACKING MODAL */}
            {/* ================================================================ */}
            {trackingOpen && (
              <TrackingModal
                lang={lang}
                t={t}
                onClose={() => setTrackingOpen(false)}
                onViewInvoice={(order) => {
                  setTrackingOpen(false);
                  setCurrentInvoiceOrder(order);

            {/* ================================================================ */}
            {/* 15. ADMIN DASHBOARD & LOGIN MODAL */}

            {adminOpen && (
              <AdminModal
                token={adminToken}
                adminUser={adminUser}
                setAdminUser={setAdminUser}
                adminPass={adminPass}
                setAdminPass={setAdminPass}
                loginError={adminLoginError}
                onLogin={handleAdminLogin}
                onLogout={handleAdminLogout}
                kpis={adminKPIs}
                activeTab={adminActiveTab}
                setActiveTab={setAdminActiveTab}
                products={products}
                orders={orders}
                lang={lang}
                t={t}
                onClose={handleCloseAdmin}
                onRefreshOrders={fetchAdminOrders}
                onDeleteOrderLocal={(deletedId) => {
                  const cleanId = String(deletedId || '').trim().toUpperCase();
                  setOrders(prev => (prev || []).filter(o => String(o?.id || '').trim().toUpperCase() !== cleanId));
                }}
                onRefreshProducts={fetchProducts}
                onReorderProductsLocal={(reorderedList) => {
                  if (Array.isArray(reorderedList)) {
                    setProducts(reorderedList);
                  }
                }}
                onDeleteProductLocal={(deletedId) => {
                  const numId = Number(deletedId);
                  setProducts(prev => (prev || []).filter(p => Number(p?.id) !== numId));
                }}
                onEditProduct={(p) => setProductFormModal(p)}
                onAddProduct={() => setProductFormModal({
                  id: null,
                  nameFr: '',
                  nameAr: '',
                  price: '',
                  oldPrice: '',
                  category: 'Chaussures',
                  inStock: true,
                  stock: 10,
                  badge: 'new',
                  isNew: true,
                  rating: 5,
                  images: [],
                  descFr: '',
                  descAr: '',
                  sizes: ['41', '42', '43'],
                  colors: ['#171717']
                })}
                onViewInvoice={(order) => {
                  setCurrentInvoiceOrder(order);
                }}
                showToast={showToast}
                heroSlides={heroSlides}
                onSaveSlider={(updatedSlides) => {
                  setCustomHeroSlides(updatedSlides);
                }}
                onViewProductPage={(prodId) => {
                  setAdminOpen(false);
                  navigateToProduct(prodId);
                }}
                onCopyProductLink={(prodId) => {
                  const prod = products.find(p => p.id === prodId);
                  const slug = prod ? getProductSlug(prod) : `produit-${prodId}`;
                  const url = `${window.location.origin}/produit/${slug}`;
                  try {
                    navigator.clipboard.writeText(url);
                    showToast(t.product_link_copied, 'success');
                  } catch {
                    showToast(url, 'info');
                  }
                }}
                cms={cms}
                onSaveCms={(updatedCms) => setCms(updatedCms)}
                testimonials={testimonials}
                onRefreshTestimonials={fetchTestimonials}
              />
            )}

            {/* ================================================================ */}
            {/* 16. ADMIN PRODUCT FORM MODAL (Add/Edit) */}
            {/* ================================================================ */}
            {productFormModal && (
              <ProductFormModal
                initialData={productFormModal}
                token={adminToken}
                lang={lang}
                t={t}
                onClose={() => setProductFormModal(null)}
                onSaved={(savedProduct) => {
                  const wasNew = !productFormModal.id;
                  setProductFormModal(null);
                  if (savedProduct && savedProduct.id) {
                    setProducts(prev => {
                      const existingIdx = (prev || []).findIndex(p => Number(p.id) === Number(savedProduct.id));
                      if (existingIdx >= 0 && !wasNew) {
                        const copy = [...prev];
                        copy[existingIdx] = savedProduct;
                        return copy;
                      }
                      // New product goes directly to 1st position (#1)
                      return [savedProduct, ...(prev || []).filter(p => Number(p.id) !== Number(savedProduct.id))];
                    });
                  }
                  setCatalogPage(1);
                  fetchProducts();
                  showToast(t.toast_product_saved, 'success');
                }}
                onError={(err) => showToast(err || 'Erreur enregistrement', 'error')}
              />

            {/* ================================================================ */}
            {/* 17. INVOICE MODAL (Rendered Above All Modals including Admin)    */}

            {currentInvoiceOrder && (

                    </span>
                    <div className="flex flex-wrap items-center gap-2">
                      <button
                        type="button"
                        onClick={() => printInvoice(currentInvoiceOrder, lang)}
                        className="px-3 py-1.5 bg-caramel text-white text-xs font-semibold rounded-xs hover:bg-caramel/90 transition-colors flex items-center gap-1"
                      >
                        <span>🖨️</span>
                        <span>{t.print_invoice_btn || 'Imprimer'}</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => downloadInvoice(currentInvoiceOrder, lang)}
                        className="px-3 py-1.5 bg-white/15 hover:bg-white/25 text-white text-xs font-semibold rounded-xs transition-colors flex items-center gap-1"
                        title="Télécharger la facture"
                      >
                        <span>⬇️</span>
                        <span>Télécharger</span>
                      </button>
                      <a
                        href={adminOpen ? buildAdminCustomerWhatsAppLink(currentInvoiceOrder, lang) : buildWhatsAppLink(currentInvoiceOrder, lang)}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="px-3 py-1.5 bg-[#25D366] hover:bg-[#20ba5a] text-white text-xs font-semibold rounded-xs transition-colors flex items-center gap-1.5 shadow-2xs"
                      >
                        <WhatsAppIcon className="w-3.5 h-3.5 fill-white shrink-0" />
                        <span>{adminOpen ? 'WhatsApp Client' : t.whatsapp_confirm_btn}</span>
                      </a>
                      <button
                        type="button"
                        onClick={() => setCurrentInvoiceOrder(null)}
                        className="text-white/70 hover:text-white text-lg px-2 py-0.5"
                        aria-label="Fermer"

                        ✕
                      </button>
                    </div>
                  </div>

                  {/* Rendered Invoice Preview */}
                  <div
                    className="flex-1 overflow-y-auto p-3 sm:p-6 bg-[#F8F7F4]"

      // ========================================================================
      // SUB-COMPONENT: CHECKOUT COD MODAL
      // ========================================================================
      function CheckoutModal({ cart, totals, promoCode, lang, t, onClose, onSuccess, onError }) {
        const [customerName, setCustomerName] = useState('');
        const [customerPhone, setCustomerPhone] = useState('');
        const [city, setCity] = useState(MOROCCAN_CITIES[0].id);
        const [address, setAddress] = useState('');
        const [notes, setNotes] = useState('');
        const [submitting, setSubmitting] = useState(false);

        // Phone Validation (/^(06|07)\d{8}$/)
        const phoneClean = customerPhone.trim().replace(/\s+/g, '');
        const isPhoneValid = /^(06|07)\d{8}$/.test(phoneClean);
        const isFormValid = customerName.trim().length >= 3 && isPhoneValid && address.trim().length >= 5;

        const selectedCityObj = MOROCCAN_CITIES.find(c => c.id === city) || MOROCCAN_CITIES[0];

        const handleSubmit = async (e) => {
          e.preventDefault();
          if (!isFormValid || submitting) return;

          setSubmitting(true);
          try {
            const payload = {
              customerName: customerName.trim(),
              customerPhone: phoneClean,
              city: selectedCityObj.nameFr,
              address: address.trim(),
              notes: notes.trim(),
              promoCode: promoCode || null,
              items: cart.map(item => ({
                productId: item.productId,
                quantity: item.quantity,
                size: item.size,
                color: item.color
              }))
            };

            const res = await fetch('/api/orders', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (res.ok && data.order) {
              onSuccess(data.order);
            } else {
              onError(data.error || 'Erreur lors de la commande');
            }
          } catch (err) {
            onError('Impossible de contacter le serveur.');
          } finally {
            setSubmitting(false);
          }
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto overflow-x-hidden">
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs" onClick={onClose} />
            <div className="relative bg-canvas w-full max-w-xl max-h-[90vh] overflow-y-auto overflow-x-hidden z-10 shadow-2xl border border-taupe/30 p-5 sm:p-8 animate-modal-pop box-border my-auto">
              <button
                onClick={onClose}
                className="absolute top-4 end-4 text-taupe-dark hover:text-noir text-lg"
                aria-label="Fermer"
              >
                ✕
              </button>

              <h2 className="font-serif text-2xl sm:text-3xl font-semibold text-noir mb-1">
                {t.checkout_title}
              </h2>
              <p className="text-xs text-taupe-dark mb-6">
                {t.checkout_subtitle}
              </p>

              <form onSubmit={handleSubmit} className="space-y-4">
                {/* Nom */}
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-noir mb-1">
                    {t.name_label}
                  </label>
                  <input
                    type="text"
                    required
                    value={customerName}
                    onChange={(e) => setCustomerName(e.target.value)}
                    placeholder={t.name_placeholder}
                    className="w-full bg-card border border-taupe/30 px-3.5 py-2.5 text-xs text-noir focus:border-caramel"
                  />
                </div>

                {/* Téléphone avec validation live */}
                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="block text-xs font-bold uppercase tracking-wider text-noir">
                      {t.phone_label}
                    </label>
                    {customerPhone && (
                      <span className={`text-[11px] font-semibold ${isPhoneValid ? 'text-[#10B981]' : 'text-[#B91C1C]'}`}>
                        {isPhoneValid ? t.phone_valid : t.phone_invalid}
                      </span>
                    )}
                  </div>
                  <div className="relative">
                    <input
                      type="tel"
                      required
                      value={customerPhone}
                      onChange={(e) => setCustomerPhone(e.target.value)}
                      placeholder={t.phone_placeholder}
                      className={`w-full bg-card border px-3.5 py-2.5 text-xs text-noir focus:border-caramel ${
                        customerPhone && !isPhoneValid ? 'border-[#B91C1C]' : 'border-taupe/30'
                      }`}
                    />
                    {isPhoneValid && (
                      <span className="absolute end-3 top-2.5 text-[#10B981] font-bold">✓</span>
                    )}
                  </div>
                </div>

                {/* Ville avec SLA */}
                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="block text-xs font-bold uppercase tracking-wider text-noir">
                      {t.city_label}
                    </label>
                    <span className="text-[11px] text-caramel font-semibold">
                      Délai estimé : {selectedCityObj.delay}
                    </span>
                  </div>
                  <select
                    value={city}
                    onChange={(e) => setCity(e.target.value)}
                    className="w-full bg-card border border-taupe/30 px-3.5 py-2.5 text-xs text-noir focus:border-caramel font-medium"
                  >
                    <optgroup label={lang === 'ar' ? "⭐ المدن الكبرى (توصيل سريع)" : "⭐ Grandes Villes (Livraison Express 24-48h)"}>
                      {MOROCCAN_CITIES.filter(c => c.isMajor).map(c => (
                        <option key={c.id} value={c.id}>
                          {lang === 'ar' ? c.nameAr : c.nameFr} (Livraison {c.delay})
                        </option>
                      ))}
                    </optgroup>
                    <optgroup label={lang === 'ar' ? "📦 باقي مدن المملكة (ترتيب أبجدي)" : "📦 Toutes les Villes du Maroc (Ordre Alphabétique)"}>
                      {MOROCCAN_CITIES.filter(c => !c.isMajor).map(c => (
                        <option key={c.id} value={c.id}>
                          {lang === 'ar' ? c.nameAr : c.nameFr} (Livraison {c.delay})
                        </option>
                      ))}
                    </optgroup>
                  </select>
                </div>

                {/* Adresse */}
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-noir mb-1">
                    {t.address_label}
                  </label>
                  <textarea
                    required
                    rows="2"
                    value={address}
                    onChange={(e) => setAddress(e.target.value)}
                    placeholder={t.address_placeholder}
                    className="w-full bg-card border border-taupe/30 px-3.5 py-2.5 text-xs text-noir focus:border-caramel"
                  />
                </div>

                {/* Notes optionnelles */}
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-taupe-dark mb-1">
                    {t.notes_label}
                  </label>
                  <input
                    type="text"
                    value={notes}
                    onChange={(e) => setNotes(e.target.value)}
                    placeholder={t.notes_placeholder}
                    className="w-full bg-card border border-taupe/30 px-3.5 py-2 text-xs text-noir focus:border-caramel"
                  />
                </div>

                {/* COD Recap Box */}
                <div className="bg-[#F8F5EE] border border-taupe/20 p-4 text-xs space-y-2 mt-4">
                  <div className="flex justify-between text-taupe-dark">
                    <span>Articles ({totals.itemCount})</span>
                    <span>{totals.subtotal.toLocaleString()} MAD</span>
                  </div>
                  {totals.discount > 0 && (
                    <div className="flex justify-between text-[#10B981] font-semibold">
                      <span>Remise code</span>
                      <span>-{totals.discount.toLocaleString()} MAD</span>
                    </div>
                  )}
                  <div className="flex justify-between text-taupe-dark">
                    <span>Livraison express à domicile</span>
                    <span className="text-[#10B981] font-semibold">0 MAD (Gratuite)</span>
                  </div>
                  <div className="flex justify-between text-sm font-bold text-noir pt-2 border-t border-taupe/20">
                    <span>Total à payer à la livraison</span>
                    <span className="text-caramel">{totals.total.toLocaleString()} MAD</span>
                  </div>
                </div>

                {/* Submit button */}
                <button
                  type="submit"
                  disabled={!isFormValid || submitting}
                  className={`w-full py-3.5 px-3 text-xs font-semibold uppercase tracking-wider transition-colors shadow-sm whitespace-normal text-center leading-snug box-border ${
                    !isFormValid || submitting
                      ? 'bg-taupe/30 text-taupe-dark cursor-not-allowed'
                      : 'bg-noir text-white hover:bg-caramel active:scale-98'
                  }`}
                >
                  {submitting ? 'Validation en cours...' : t.order_confirm_btn}
                </button>
              </form>
            </div>
          </div>
        );
      }

      // ========================================================================
      // SUB-COMPONENT: ORDER TRACKING MODAL
      // ========================================================================
      function TrackingModal({ lang, t, onClose, onViewInvoice }) {
        const [searchId, setSearchId] = useState('');
        const [loading, setLoading] = useState(false);
        const [orderResult, setOrderResult] = useState(null);
        const [notFound, setNotFound] = useState(false);

        const handleTrack = async (e) => {
          e.preventDefault();
          if (!searchId.trim()) return;

          setLoading(true);
          setNotFound(false);
          setOrderResult(null);

          try {
            const clean = searchId.trim().toUpperCase();
            const res = await fetch(`/api/orders/${clean}`);
            if (res.ok) {
              const data = await res.json();
              setOrderResult(data);
            } else {
              setNotFound(true);
            }
          } catch {
            setNotFound(true);
          } finally {
            setLoading(false);
          }
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto overflow-x-hidden">
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs" onClick={onClose} />
            <div className="relative bg-canvas w-full max-w-lg p-5 sm:p-8 z-10 shadow-2xl border border-taupe/30 animate-modal-pop box-border my-auto overflow-x-hidden">
              <button
                onClick={onClose}
                className="absolute top-4 end-4 text-taupe-dark hover:text-noir text-lg"
              >
                ✕
              </button>

              <h2 className="font-serif text-2xl sm:text-3xl font-semibold text-noir mb-2">
                {t.tracking_title}
              </h2>
              <p className="text-xs text-taupe-dark mb-6">
                Entrez votre identifiant de commande (ex: CMD-XXXXXX) pour voir l'état d'avancement.
              </p>

              <form onSubmit={handleTrack} className="flex gap-2 mb-6">
                <input
                  type="text"
                  required
                  value={searchId}
                  onChange={(e) => setSearchId(e.target.value)}
                  placeholder={t.tracking_input_placeholder}
                  className="flex-1 bg-card border border-taupe/30 px-3.5 py-2.5 text-xs text-noir uppercase focus:border-caramel"
                />
                <button
                  type="submit"
                  disabled={loading}
                  className="px-5 py-2.5 bg-noir text-white text-xs font-semibold uppercase tracking-wider hover:bg-caramel transition-colors"
                >
                  {loading ? '...' : t.tracking_btn}
                </button>
              </form>

              {notFound && (
                <div className="p-4 bg-[#FEE2E2] text-[#991B1B] text-xs border border-[#FCA5A5] mb-4">
                  Aucune commande trouvée pour la référence "{searchId}". Vérifiez le code.
                </div>
              )}

              {orderResult && (
                <div className="bg-card border border-taupe/20 p-5 space-y-4">
                  <div className="flex items-center justify-between pb-3 border-b border-taupe/15">
                    <div>
                      <div className="text-xs text-taupe-dark">{t.tracking_input_label}</div>
                      <div className="text-sm font-bold text-noir">{orderResult.id}</div>
                    </div>
                    <span className="px-3 py-1 bg-noir text-white text-xs font-semibold rounded-xs">
                      {orderResult.status}
                    </span>
                  </div>

                  <div className="grid grid-cols-2 gap-3 text-xs">
                    <div>
                      <span className="text-taupe-dark block">{t.tracking_client} :</span>
                      <span className="font-medium text-noir">{orderResult.customerName}</span>
                    </div>
                    <div>
                      <span className="text-taupe-dark block">{t.tracking_city} :</span>
                      <span className="font-medium text-noir">{orderResult.city}</span>
                    </div>
                    <div>
                      <span className="text-taupe-dark block">{t.tracking_date} :</span>
                      <span className="font-medium text-noir">{new Date(orderResult.date).toLocaleDateString()}</span>
                    </div>
                    <div>
                      <span className="text-taupe-dark block">{t.total} :</span>
                      <span className="font-bold text-caramel">{Number(orderResult.total).toLocaleString()} MAD</span>
                    </div>
                  </div>

                  <button
                    onClick={() => onViewInvoice(orderResult)}
                    className="w-full mt-2 py-2.5 border border-noir text-xs font-semibold uppercase tracking-wider hover:bg-noir hover:text-white transition-colors"
                  >
                    {t.tracking_view_invoice}
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      }

          storyTitle: cms?.storyTitle || "L'Art de l'Excellence & du Minimalisme Brut",
          storyText1: cms?.storyText1 || "Fondée avec la volonté de redéfinir l'élégance masculine contemporaine, MODANOVA sélectionne des cuirs pleine fleur d'exception et des toiles techniques robustes pour concevoir des pièces intemporelles.",
          storyText2: cms?.storyText2 || "Chaque sacoche, veste et soulier est méticuleusement assemblé à la main, garantissant une longévité absolue et un style d'affirmation sobre pensé pour le quotidien de l'homme moderne.",
          storyImage: cms?.storyImage || '',
          conciergeAddress: cms?.conciergeAddress || 'Boulevard Mohamed V, Quartier Industriel',
          conciergeCity: cms?.conciergeCity || 'Kénitra, Maroc',
          whatsappNumber: cms?.whatsappNumber || '+212600000000'
        }));
        const [cmsSaving, setCmsSaving] = useState(false);
        const [cmsUploadingPhoto, setCmsUploadingPhoto] = useState(false);

        // Testimonial CRUD state
        const [testimonialModalOpen, setTestimonialModalOpen] = useState(false);
        const [editingTestimonial, setEditingTestimonial] = useState(null);
        const [testimonialForm, setTestimonialForm] = useState({
          author: '',
          city: 'Casablanca',
          rating: 5,
          textFr: '',
          textAr: '',
          verified: true
        });
        const [testimonialSaving, setTestimonialSaving] = useState(false);
        const [showLoginPassword, setShowLoginPassword] = useState(false);

        useEffect(() => {
          if (heroSlides && heroSlides.length > 0) {
            setSliderDraft(JSON.parse(JSON.stringify(heroSlides)));
          }
        }, [heroSlides]);

        useEffect(() => {
          if (cms) {
            setCmsDraft({
              topBannerFr: cms.topBannerFr || '',
              topBannerAr: cms.topBannerAr || '',
              brandName: cms.brandName || 'MODANOVA',
              brandTagline: cms.brandTagline || "Men's Essentials",
              storyBadge: cms.storyBadge || '',
              storyTitle: cms.storyTitle || '',
              storyText1: cms.storyText1 || '',
              storyText2: cms.storyText2 || '',
              storyImage: cms.storyImage || '',
              conciergeAddress: cms.conciergeAddress || '',
              conciergeCity: cms.conciergeCity || 'Kénitra, Maroc',
              whatsappNumber: cms.whatsappNumber || '+212600000000'
            });
          }
        }, [cms]);

        // Slider handlers
        const handleSlideFieldChange = (idx, field, val) => {
          setSliderDraft(prev => {
            const copy = [...prev];
            copy[idx] = { ...copy[idx], [field]: val };
            return copy;
          });
        };

        const handleSliderPhotoUpload = async (idx, e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          setSliderUploadingIdx(idx);

          try {
            const base64Data = await compressImageFile(file, 1400, 0.82);

            const res = await fetch('/api/upload', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`
              },
              body: JSON.stringify({
                file: base64Data,
                filename: file.name,
                folder: 'slider'
              })
            });

            const data = await res.json();
            if (res.ok && data.url) {
              handleSlideFieldChange(idx, 'wallpaper', data.url);
              showToast(`Photo du slide 0${idx + 1} uploadée et stockée sur Firebase !`, 'success');
            } else {
              showToast(data.error || "Erreur upload", 'error');
            }
          } catch (err) {
            showToast("Erreur lors de l'upload vers Firebase", 'error');
          } finally {
            setSliderUploadingIdx(null);
            e.target.value = '';
          }
        };

        const handleSaveAllSlides = async () => {
          setSliderSaving(true);
          try {
            const res = await fetch('/api/slider', {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`
              },
              body: JSON.stringify({ slides: sliderDraft })
            });
            const data = await res.json();
            if (res.ok && data.slides) {
              if (onSaveSlider) onSaveSlider(data.slides);
              showToast("Slider d'accueil mis à jour et synchronisé avec Firebase !", 'success');
            } else {
              showToast(data.error || "Erreur lors de l'enregistrement", 'error');
            }
          } catch {
            showToast("Erreur de connexion", 'error');
          } finally {
            setSliderSaving(false);
          }
        };

        // CMS handlers
        const handleCmsPhotoUpload = async (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          setCmsUploadingPhoto(true);

          try {
            const base64Data = await compressImageFile(file, 1200, 0.82);

            const res = await fetch('/api/upload', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`
              },
              body: JSON.stringify({
                file: base64Data,
                filename: file.name,
                folder: 'cms'
              })

            const data = await res.json();
            if (res.ok && data.url) {
              setCmsDraft(prev => ({ ...prev, storyImage: data.url }));
              showToast("Photo de présentation du Savoir-Faire uploadée vers Firebase !", 'success');
            } else {
              showToast(data.error || "Erreur upload", 'error');
            }
          } catch {
            showToast("Erreur lors de l'upload vers Firebase", 'error');
          } finally {
            setCmsUploadingPhoto(false);
            e.target.value = '';
          }

        const handleSaveCms = async () => {
          setCmsSaving(true);
          try {
            const res = await fetch('/api/cms', {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`
              },
              body: JSON.stringify(cmsDraft)

            const data = await res.json();
            if (res.ok && data.cms) {
              if (onSaveCms) onSaveCms(data.cms);
              showToast("Contenu du site mis à jour et synchronisé sur Firebase !", 'success');
            } else {
              showToast(data.error || "Erreur enregistrement CMS", 'error');
            }
          } catch {
            showToast("Erreur de connexion", 'error');
          } finally {
            setCmsSaving(false);

        // Testimonial handlers
        const openAddTestimonial = () => {

            textFr: item.textFr || item.text || '',
            textAr: item.textAr || '',

          setTestimonialModalOpen(true);

        const handleSaveTestimonial = async (e) => {
          e.preventDefault();

          setTestimonialSaving(true);
          try {

            const method = editingTestimonial ? 'PUT' : 'POST';

            const res = await fetch(url, {
              method,
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`
              },
              body: JSON.stringify(testimonialForm)

            const data = await res.json();
            if (res.ok) {
              showToast(editingTestimonial ? "Témoignage modifié avec succès !" : "Témoignage ajouté avec succès !", 'success');
              setTestimonialModalOpen(false);

              showToast(data.error || "Erreur enregistrement témoignage", 'error');

            showToast("Erreur de connexion", 'error');
          } finally {
            setTestimonialSaving(false);
          }

        const handleDeleteTestimonial = async (id) => {
          if (!confirm("Voulez-vous vraiment supprimer ce témoignage client ?")) return;
          try {
            const res = await fetch(`/api/testimonials/${id}`, {
              method: 'DELETE',
              headers: { Authorization: `Bearer ${token}` }

              showToast("Témoignage supprimé avec succès.", 'info');

            } else {
              showToast("Erreur lors de la suppression.", 'error');
            }
          } catch {
            showToast("Erreur de connexion", 'error');
          }

        // Orders & Products status handlers
        const handleStatusChange = async (orderId, newStatus) => {
          try {
            const res = await fetch(`/api/orders/${orderId}`, {
              method: 'PATCH',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`
              },
              body: JSON.stringify({ status: newStatus })
            });
            if (res.ok) {
              onRefreshOrders();
              showToast(t.toast_status_updated, 'success');
            }
          } catch {
            showToast('Erreur mise à jour', 'error');
          }

        const handleDeleteProduct = async (id) => {
          const numId = Number(id);
          if (!numId) return;
          setDeletingProdId(numId);
          setConfirmDeleteProdId(null);
          if (onDeleteProductLocal) {
            onDeleteProductLocal(numId);
          }
          try {
            const res = await fetch(`/api/products/${encodeURIComponent(numId)}`, {
              method: 'DELETE',
              headers: { Authorization: `Bearer ${token}` }
            });
            if (res.ok) {
              await onRefreshProducts();
              showToast(t.toast_product_deleted, 'info');
            } else {
              await onRefreshProducts();
              showToast('Erreur suppression produit', 'error');
            }
          } catch {
            showToast('Erreur suppression', 'error');
          } finally {
            setDeletingProdId(null);
          }
        };

        // Reorder products and persist to Firebase Firestore
        const persistProductsOrder = async (newOrderedProducts, targetPageAfterMove = null) => {
          const normalized = newOrderedProducts.map((item, idx) => ({
            ...item,
            position: idx + 1
          }));
          if (onReorderProductsLocal) {
            onReorderProductsLocal(normalized);
          }
          if (targetPageAfterMove != null) {
            setProdPage(targetPageAfterMove);
          }
          setReorderingProds(true);
          try {
            const orderedIds = normalized.map(item => Number(item.id));
            const res = await fetch('/api/products/reorder', {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`
              },
              body: JSON.stringify({ orderedIds })
            });
            if (res.ok) {
              const data = await res.json().catch(() => ({}));
              if (Array.isArray(data.products) && onReorderProductsLocal) {
                onReorderProductsLocal(data.products);
              } else {
                await onRefreshProducts();
              }
              showToast('Ordre des produits mis à jour et sauvegardé sur Firebase !', 'success');
            } else {
              await onRefreshProducts();
              showToast("Erreur lors de l'enregistrement de l'ordre", 'error');
            }
          } catch {
            showToast('Erreur de connexion', 'error');
          } finally {
            setReorderingProds(false);
          }
        };

        // Move a product to an exact 1-based rank (e.g., 1st, 2nd, 3rd, ..., 12th)
        const handleMoveProductToRank = async (productId, targetRank1Based) => {
          const list = [...(products || [])];
          const fromIdx = list.findIndex(item => Number(item.id) === Number(productId));
          if (fromIdx < 0) return;
          const toIdx = Math.max(0, Math.min(list.length - 1, Number(targetRank1Based) - 1));
          if (fromIdx === toIdx) return;

          const [movedItem] = list.splice(fromIdx, 1);
          list.splice(toIdx, 0, movedItem);

          const targetPage = Math.max(1, Math.ceil((toIdx + 1) / PRODUCTS_PER_PAGE));
          await persistProductsOrder(list, targetPage);
        };

        const handleStepProductRank = async (productId, delta) => {
          const list = [...(products || [])];
          const fromIdx = list.findIndex(item => Number(item.id) === Number(productId));
          if (fromIdx < 0) return;
          const targetRank = fromIdx + 1 + delta;
          if (targetRank < 1 || targetRank > list.length) return;
          await handleMoveProductToRank(productId, targetRank);
        };

        const handleDropProductOnTarget = async (sourceProdId, targetProdId) => {
          setDraggedProdId(null);
          setDragOverProdId(null);
          if (!sourceProdId || !targetProdId || Number(sourceProdId) === Number(targetProdId)) return;
          const list = [...(products || [])];
          const targetIdx = list.findIndex(item => Number(item.id) === Number(targetProdId));
          if (targetIdx < 0) return;
          await handleMoveProductToRank(sourceProdId, targetIdx + 1);
        };

        const handleDeleteOrder = async (id) => {
          const cleanId = String(id || '').trim().toUpperCase();
          if (!cleanId) return;
          setDeletingOrderId(cleanId);
          setConfirmDeleteOrderId(null);
          // Immediately update local state so Total Commandes KPI and table update right away
          if (onDeleteOrderLocal) {
            onDeleteOrderLocal(cleanId);
          }
          try {
            const res = await fetch(`/api/orders/${encodeURIComponent(cleanId)}`, {
              method: 'DELETE',
              headers: { Authorization: `Bearer ${token}` }
            });
            if (res.ok) {
              await onRefreshOrders();
              showToast(`Commande ${cleanId} supprimée définitivement`, 'info');
            } else {
              await onRefreshOrders();
              showToast('Erreur lors de la suppression de la commande', 'error');
            }
          } catch {
            showToast('Erreur suppression', 'error');
          } finally {
            setDeletingOrderId(null);
          }
        };

        // Filtered products & pagination (10 products per page)
        const filteredProducts = (products || []).filter(p => {
          if (!p) return false;
          const matchSearch = !prodSearch || 
            (p.nameFr && p.nameFr.toLowerCase().includes(prodSearch.toLowerCase())) ||
            (p.nameAr && p.nameAr.toLowerCase().includes(prodSearch.toLowerCase())) ||
            (p.id && String(p.id).toLowerCase().includes(prodSearch.toLowerCase()));
          const matchCat = prodCat === 'ALL' || String(p.category || '').toLowerCase() === String(prodCat).toLowerCase();
          return matchSearch && matchCat;
        });

        const totalProdPages = Math.max(1, Math.ceil(filteredProducts.length / PRODUCTS_PER_PAGE));
        const safeProdPage = Math.min(Math.max(1, prodPage), totalProdPages);
        const startProdIdx = (safeProdPage - 1) * PRODUCTS_PER_PAGE;
        const paginatedProducts = filteredProducts.slice(startProdIdx, startProdIdx + PRODUCTS_PER_PAGE);

        const filteredOrders = (orders || []).filter(o => {
          if (!o) return false;
          const matchStatus = orderFilter === 'ALL' || o.status === orderFilter;
          const q = (orderSearch || '').trim().toLowerCase();
          const matchSearch = !q ||
            String(o.id || '').toLowerCase().includes(q) ||
            String(o.customerName || '').toLowerCase().includes(q) ||
            String(o.customerPhone || '').toLowerCase().includes(q) ||
            String(o.city || '').toLowerCase().includes(q);
          return matchStatus && matchSearch;
        });

        const totalOrderPages = Math.max(1, Math.ceil(filteredOrders.length / ORDERS_PER_PAGE));
        const safeOrderPage = Math.min(Math.max(1, orderPage), totalOrderPages);
        const startOrderIdx = (safeOrderPage - 1) * ORDERS_PER_PAGE;
        const paginatedOrders = filteredOrders.slice(startOrderIdx, startOrderIdx + ORDERS_PER_PAGE);

        // -------------------------------------------------------------
        // IF NOT AUTHENTICATED: Full-screen Login Portal
        // -------------------------------------------------------------
        if (!token) {
          return (
            <div className="fixed inset-0 z-50 bg-[#121212] flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-[#1C1C1C] border border-[#2F2F2F] p-8 shadow-2xl relative text-white rounded-xs">
                <button
                  onClick={onClose}
                  className="absolute top-4 right-4 text-white/50 hover:text-white text-sm"
                  title="Retourner à la boutique"
                >
                  ✕
                </button>
                <div className="text-center mb-8">
                  <div className="font-serif text-3xl font-extrabold tracking-widest text-[#E6C687] mb-1">
                    MODANOVA
                  </div>
                  <div className="text-[10px] uppercase font-mono tracking-widest text-white/50">
                    PANEL ADMINISTRATEUR SÉCURISÉ
                  </div>
                </div>

                <form onSubmit={onLogin} className="space-y-5">
                  <div>
                    <label className="block text-[11px] font-bold uppercase tracking-wider text-white/70 mb-2">
                      Identifiant
                    </label>
                    <input
                      type="text"
                      value={adminUser}
                      onChange={(e) => setAdminUser(e.target.value)}
                      placeholder="admin"
                      className="w-full bg-[#121212] border border-[#333] px-3.5 py-2.5 text-sm text-white placeholder-white/30 focus:border-[#E6C687] focus:outline-none"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold uppercase tracking-wider text-white/70 mb-2">
                      Mot de passe
                    </label>
                    <div className="relative">
                      <input
                        type={showLoginPassword ? "text" : "password"}
                        value={adminPass}
                        onChange={(e) => setAdminPass(e.target.value)}
                        placeholder="••••••••••••"
                        autoComplete="current-password"
                        className="w-full bg-[#121212] border border-[#333] px-3.5 py-2.5 pr-14 text-sm text-white placeholder-white/30 focus:border-[#E6C687] focus:outline-none"
                        required
                      />
                      <button
                        type="button"
                        onClick={() => setShowLoginPassword(prev => !prev)}
                        className="absolute right-3 top-1/2 -translate-y-1/2 text-[11px] text-white/50 hover:text-[#E6C687] transition-colors"
                      >
                        {showLoginPassword ? "Masquer" : "Afficher"}
                      </button>
                    </div>
                  </div>

                  {loginError && (
                    <div className="p-3 bg-red-950/60 border border-red-800 text-red-200 text-xs">
                      {loginError}
                    </div>
                  )}

                  <div className="pt-2 flex flex-col gap-2">
                    <button
                      type="submit"
                      className="w-full py-3 bg-[#E6C687] hover:bg-[#D4B373] text-[#121212] font-bold text-xs uppercase tracking-widest transition-colors shadow-sm"
                    >
                      Connexion au Dashboard
                    </button>
                    <button
                      type="button"
                      onClick={onClose}
                      className="w-full py-2.5 text-white/60 hover:text-white text-xs transition-colors"
                    >
                      ← Retour à la Boutique
                    </button>
                  </div>
                </form>
              </div>
            </div>
          );
        }

        // -------------------------------------------------------------
        // AUTHENTICATED: Full-screen Dashboard (Sidebar + Main Workspace)
        // -------------------------------------------------------------
        return (
          <div className="fixed inset-0 z-50 bg-[#141414] flex flex-col md:flex-row w-screen h-screen overflow-hidden text-noir antialiased font-sans">
            
            {/* ========================================================= */}
            {/* 1. LEFT SIDEBAR (Classical Dashboard Navigation)          */}
            {/* ========================================================= */}
            <aside className="w-full md:w-64 bg-[#141414] text-white flex flex-col shrink-0 border-b md:border-b-0 md:border-r border-[#262626] h-auto md:h-full z-20">
              {/* Brand Header */}
              <div className="p-5 border-b border-[#262626] flex items-center justify-between">
                <div>
                  <div className="font-serif text-xl font-bold tracking-widest text-[#E6C687]">

                  </div>

                <button

              {/* Navigation Menu */}
              <nav className="flex-1 p-3 space-y-1.5 overflow-x-auto md:overflow-y-auto flex md:flex-col">
                <button

                  className={`w-full flex items-center justify-between px-3.5 py-2.5 text-xs font-semibold uppercase tracking-wider rounded-xs transition-colors ${
                    activeTab === 'products'
                      ? 'bg-[#E6C687] text-[#141414] font-bold shadow-xs'
                      : 'text-white/70 hover:bg-white/5 hover:text-white'
                  }`}
                >
                  <span className="flex items-center gap-2.5">
                    <span>📦</span>
                    <span>Produits</span>
                  </span>
                  <span className={`text-[10px] px-1.5 py-0.5 rounded-full font-mono ${activeTab === 'products' ? 'bg-[#141414] text-[#E6C687]' : 'bg-white/10 text-white/80'}`}>
                    {products.length}
                  </span>
                </button>

                <button
                  onClick={() => setActiveTab('orders')}
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 text-xs font-semibold uppercase tracking-wider rounded-xs transition-colors ${
                    activeTab === 'orders'
                      ? 'bg-[#E6C687] text-[#141414] font-bold shadow-xs'
                      : 'text-white/70 hover:bg-white/5 hover:text-white'
                  }`}
                >
                  <span className="flex items-center gap-2.5">
                    <span>📋</span>
                    <span>Commandes</span>
                  </span>
                  <span className={`text-[10px] px-1.5 py-0.5 rounded-full font-mono ${activeTab === 'orders' ? 'bg-[#141414] text-[#E6C687]' : 'bg-white/10 text-white/80'}`}>
                    {orders.length}
                  </span>
                </button>

                <button
                  onClick={() => setActiveTab('slider')}
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 text-xs font-semibold uppercase tracking-wider rounded-xs transition-colors ${
                    activeTab === 'slider'
                      ? 'bg-[#E6C687] text-[#141414] font-bold shadow-xs'
                      : 'text-white/70 hover:bg-white/5 hover:text-white'
                  }`}
                >
                  <span className="flex items-center gap-2.5">
                    <span>🖼️</span>
                    <span>Slider Accueil</span>
                  </span>
                  <span className={`text-[10px] px-1.5 py-0.5 rounded-full font-mono ${activeTab === 'slider' ? 'bg-[#141414] text-[#E6C687]' : 'bg-white/10 text-white/80'}`}>
                    3 slides
                  </span>
                </button>

                <button
                  onClick={() => setActiveTab('cms')}
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 text-xs font-semibold uppercase tracking-wider rounded-xs transition-colors ${
                    activeTab === 'cms'
                      ? 'bg-[#E6C687] text-[#141414] font-bold shadow-xs'
                      : 'text-white/70 hover:bg-white/5 hover:text-white'
                  }`}
                >
                  <span className="flex items-center gap-2.5">
                    <span>📝</span>
                    <span>Gestion Contenu</span>
                  </span>
                  <span className="text-[9px] bg-emerald-600/30 text-emerald-300 px-1.5 py-0.5 rounded-xs font-mono">
                    CMS
                  </span>
                </button>

                <button
                  onClick={() => setActiveTab('testimonials')}
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 text-xs font-semibold uppercase tracking-wider rounded-xs transition-colors ${
                    activeTab === 'testimonials'
                      ? 'bg-[#E6C687] text-[#141414] font-bold shadow-xs'
                      : 'text-white/70 hover:bg-white/5 hover:text-white'
                  }`}
                >
                  <span className="flex items-center gap-2.5">
                    <span>⭐</span>
                    <span>Témoignages</span>
                  </span>
                  <span className={`text-[10px] px-1.5 py-0.5 rounded-full font-mono ${activeTab === 'testimonials' ? 'bg-[#141414] text-[#E6C687]' : 'bg-white/10 text-white/80'}`}>
                    {(testimonials || []).length}
                  </span>
