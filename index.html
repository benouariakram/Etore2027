      // ========================================================================

      function buildInvoiceHTML(order, lang = 'fr') {
        const isAr = lang === 'ar';
        const dir = isAr ? 'rtl' : 'ltr';
        const font = isAr ? "'Cairo', sans-serif" : "'Plus Jakarta Sans', sans-serif";

        const orderId = escapeHTML(order.id || '');
        const dateStr = order.date ? new Date(order.date).toLocaleDateString(isAr ? 'ar-MA' : 'fr-FR', {
          year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
        }) : '';
        const clientName = escapeHTML(order.customerName || '');
        const clientPhone = escapeHTML(order.customerPhone || '');
        const city = escapeHTML(order.city || '');
        const address = escapeHTML(order.address || '');
        const notes = escapeHTML(order.notes || '');

        const subtotal = Number(order.subtotal || 0).toLocaleString(isAr ? 'ar-MA' : 'fr-FR');
        const discount = Number(order.discount || 0);
        const total = Number(order.total || 0).toLocaleString(isAr ? 'ar-MA' : 'fr-FR');

        const itemsRows = (order.items || []).map((item, idx) => {
          const name = escapeHTML(isAr ? (item.nameAr || item.nameFr) : item.nameFr);

      // ========================================================================

      // ========================================================================
      function printInvoice(order, lang) {
        const printArea = document.getElementById('print-area');
        if (!printArea) return;

        printArea.innerHTML = buildInvoiceHTML(order, lang);

        const handleAfterPrint = () => {
          printArea.innerHTML = '';
          window.removeEventListener('afterprint', handleAfterPrint);
        };
        window.addEventListener('afterprint', handleAfterPrint);

        setTimeout(() => {
          window.print();
        }, 150);
      }

      // ========================================================================
      // WhatsApp Direct Link Builder
      // ========================================================================
      function buildWhatsAppLink(order, lang = 'fr') {
        const isAr = lang === 'ar';
        const phone = "212600773716";
        const itemsSummary = (order.items || [])
          .map(i => `• ${isAr ? (i.nameAr || i.nameFr) : i.nameFr} (x${i.quantity || 1}) - ${i.price} MAD`)
          .join('\n');

        const message = isAr
          ? `مرحباً إيتوري 👋\nأود تأكيد طلبي عبر واتساب:\n\n*رقم الطلب:* ${order.id}\n*الاسم:* ${order.customerName}\n*الهاتف:* ${order.customerPhone}\n*المدينة:* ${order.city}\n*العنوان:* ${order.address}\n\n*المنتجات:*\n${itemsSummary}\n\n*المجموع الصافي:* ${order.total} درهم (الدفع عند الاستلام)\n\nشكراً لكم!`
          : `Bonjour ETTORE 👋\nJe souhaite confirmer ma commande COD :\n\n*Commande N° :* ${order.id}\n*Client :* ${order.customerName}\n*Téléphone :* ${order.customerPhone}\n*Ville :* ${order.city}\n*Adresse :* ${order.address}\n\n*Articles :*\n${itemsSummary}\n\n*Total à payer :* ${order.total} MAD (Paiement à la livraison)\n\nMerci !`;

        return `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
      }

          setActiveImageIdx(0);

        const isWish = wishlist.includes(product.id);
        const isOut = !product.inStock || product.stock <= 0;
        const isLow = product.stock > 0 && product.stock < 5;
        const currentUrl = `${window.location.origin}${window.location.pathname}?product=${product.id}`;

        const copyLink = () => {
          try {

            nameFr: product.nameFr,

                    <div className="flex items-center gap-3">
                      {/* Stepper */}
                      <div className="flex items-center border border-taupe/30 bg-card">

                          onClick={() => setQty(q => Math.max(1, q - 1))}

                        <span className="px-4 py-3 text-xs font-semibold tabular-nums min-w-10 text-center">
                          {qty}
                        </span>
                        <button
                          type="button"
                          onClick={() => setQty(q => Math.min(product.stock || 99, q + 1))}

                        >
                          +
                        </button>
                      </div>

                      {/* Add To Cart */}
                      <button
                        type="button"
                        disabled={isOut}
                        onClick={() => onAddToCart(product, selectedSize, selectedColor, qty)}
                        className={`flex-1 py-3.5 px-4 text-xs font-semibold uppercase tracking-[0.15em] transition-all duration-200 shadow-sm ${
                          isOut
                            ? 'bg-taupe/20 text-taupe-dark cursor-not-allowed'
                            : 'bg-noir text-white hover:bg-caramel active:scale-98'
                        }`}
                      >
                        {isOut ? t.out_of_stock : t.add_to_cart}
                      </button>
                    </div>

                    {/* Direct COD Checkout Button (1-Click Express Checkout) */}
                    <button
                      type="button"
                      disabled={isOut}
                      onClick={handleDirectOrder}
                      className={`w-full py-3.5 px-4 text-xs font-semibold uppercase tracking-[0.18em] transition-all duration-200 shadow-md ${
                        isOut
                          ? 'bg-taupe/20 text-taupe-dark cursor-not-allowed'
                          : 'bg-caramel text-white hover:bg-noir active:scale-98'
                      }`}
                    >
                      {isOut ? t.out_of_stock : t.product_buy_now_cod}
                    </button>
                  </div>

                  {/* Moroccan Trust Guarantees List */}
                  <div className="mt-8 pt-6 border-t border-taupe/20 space-y-3 text-xs text-taupe-dark">
                    <div className="flex items-center gap-3">
                      <span className="text-base">🚚</span>
                      <span>{t.product_delivery_guarantee}</span>
                    </div>
                    <div className="flex items-center gap-3">
                      <span className="text-base">💵</span>
                      <span>{t.product_cod_guarantee}</span>
                    </div>
                    <div className="flex items-center gap-3">
                      <span className="text-base">🔄</span>
                      <span>{t.product_exchange_guarantee}</span>
                    </div>
                    <div className="flex items-center gap-3">
                      <span className="text-base">🌿</span>
                      <span>{t.product_craft_guarantee}</span>
                    </div>
                  </div>
                </div>

              </div>
            </div>

            {/* Related Creations Section */}
            {related.length > 0 && (
              <section className="border-t border-taupe/20 bg-card/40 py-16">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex items-center justify-between mb-8">
                    <div>
                      <span className="text-xs font-bold tracking-[0.2em] uppercase text-caramel block mb-1">
                        ETTORE MEN'S ESSENTIALS
                      </span>
                      <h2 className="font-serif italic text-2xl sm:text-3xl text-noir font-normal">
                        {t.product_related_title}
                      </h2>
                    </div>
                    <button
                      type="button"
                      onClick={onBack}
                      className="text-xs font-semibold text-caramel hover:underline uppercase tracking-wider"
                    >
                      Voir toute la collection →
                    </button>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    {related.map(p => {
                      const relTitle = lang === 'ar' ? (p.nameAr || p.nameFr) : p.nameFr;
                      return (
                        <div
                          key={p.id}
                          onClick={() => onSelectProduct(p.id)}
                          className="group cursor-pointer bg-card border border-taupe/20 p-4 transition-all duration-300 hover:border-taupe/50 hover:shadow-md hover:-translate-y-1"
                        >
                          <div className="aspect-4/3 w-full bg-[#EFECE6] overflow-hidden mb-3">
                            <img
                              src={p.images && p.images[0]}
                              alt={relTitle}
                              className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                            />
                          </div>
                          <div className="text-[10px] text-taupe-dark uppercase tracking-wider mb-1">{p.category}</div>
                          <h3 className="font-serif text-lg font-semibold text-noir mb-2 group-hover:text-caramel transition-colors">
                            {relTitle}
                          </h3>
                          <div className="flex items-baseline justify-between pt-2 border-t border-taupe/15">
                            <span className="font-semibold text-sm text-noir tabular-nums">
                              {Number(p.price).toLocaleString()} MAD
                            </span>
                            <span className="text-xs text-caramel font-semibold">
                              Voir la page →
                            </span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </section>
            )}
          </div>
        );
      }

      // ========================================================================
      // MAIN REACT APPLET COMPONENT
      // ========================================================================
      function App() {
        // --- Internationalization & Direction ---
        const [lang, setLang] = useState(() => {
          return localStorage.getItem('ettore_lang') || 'fr';
        });

        useEffect(() => {
          localStorage.setItem('ettore_lang', lang);
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        }, [lang]);

        const t = I18N[lang] || I18N.fr;

        // --- Data State ---
        const [products, setProducts] = useState(INITIAL_PRODUCTS);
        const [loadingProducts, setLoadingProducts] = useState(false);
        const [orders, setOrders] = useState([]);

        // --- Persistent User State ---
        const [cart, setCart] = useState(() => {
          try {
            return JSON.parse(localStorage.getItem('ettore_cart') || '[]');
          } catch {
            return [];
          }
        });

        const [wishlist, setWishlist] = useState(() => {
          try {
            return JSON.parse(localStorage.getItem('ettore_wishlist') || '[]');
          } catch {
            return [];
          }
        });

        const [appliedPromo, setAppliedPromo] = useState(() => {
          return localStorage.getItem('ettore_promo') || '';
        });

        useEffect(() => {
          localStorage.setItem('ettore_cart', JSON.stringify(cart));
        }, [cart]);

        useEffect(() => {
          localStorage.setItem('ettore_wishlist', JSON.stringify(wishlist));
        }, [wishlist]);

        useEffect(() => {
          if (appliedPromo) {
            localStorage.setItem('ettore_promo', appliedPromo);
          } else {
            localStorage.removeItem('ettore_promo');
          }
        }, [appliedPromo]);

        // --- Filters & Catalog Controls ---
        const [searchQuery, setSearchQuery] = useState('');
        const [selectedCategory, setSelectedCategory] = useState('all');
        const [onlyInStock, setOnlyInStock] = useState(false);
        const [sortOrder, setSortOrder] = useState('default');
        const [gridCols, setGridCols] = useState(3);

        // --- Modals & Drawers ---
        const [mobileDrawerOpen, setMobileDrawerOpen] = useState(false);
        const [cartOpen, setCartOpen] = useState(false);
        const [badgePulsing, setBadgePulsing] = useState(false);
        const [lastAddedLineKey, setLastAddedLineKey] = useState(null);
        const [scrolled, setScrolled] = useState(false);
        const [quickViewProduct, setQuickViewProduct] = useState(null);
        const [quickViewImageIdx, setQuickViewImageIdx] = useState(0);
        const [quickViewSize, setQuickViewSize] = useState('');
        const [quickViewColor, setQuickViewColor] = useState('');

        // --- Dedicated Product Page URL Routing Helpers ---
        const getProductIdFromURL = () => {
          try {
            const params = new URLSearchParams(window.location.search);
            const p = params.get('product');
            if (p) return parseInt(p, 10) || null;
            const hashMatch = window.location.hash.match(/product[-=/](\d+)/i);
            if (hashMatch) return parseInt(hashMatch[1], 10) || null;
            const pathMatch = window.location.pathname.match(/\/product\/(\d+)/i);
            if (pathMatch) return parseInt(pathMatch[1], 10) || null;
          } catch (e) {}
          return null;
        };

        const [selectedProductId, setSelectedProductId] = useState(() => getProductIdFromURL());
        const [directCheckoutItem, setDirectCheckoutItem] = useState(null);

        const navigateToProduct = useCallback((productId) => {
          if (!productId) return;
          setSelectedProductId(productId);
          try {
            const url = new URL(window.location.href);
            url.searchParams.set('product', productId);
            window.history.pushState({ productId }, '', url.toString());
          } catch (e) {
            window.history.pushState({ productId }, '', `?product=${productId}`);
          }
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, []);

        const backToHome = useCallback(() => {
          setSelectedProductId(null);
          try {
            const url = new URL(window.location.href);
            url.searchParams.delete('product');
            const cleanPath = url.pathname + (url.search ? url.search : '');
            window.history.pushState({}, '', cleanPath || '/');
          } catch (e) {
            window.history.pushState({}, '', window.location.pathname || '/');
          }
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, []);

        // Listen for browser popstate & hashchange
        useEffect(() => {
          const handleUrlChange = () => {
            const id = getProductIdFromURL();
            setSelectedProductId(id);
          };
          window.addEventListener('popstate', handleUrlChange);
          window.addEventListener('hashchange', handleUrlChange);
          return () => {
            window.removeEventListener('popstate', handleUrlChange);
            window.removeEventListener('hashchange', handleUrlChange);
          };
        }, []);

        const selectedProduct = useMemo(() => {
          if (!selectedProductId) return null;
          return products.find(p => p.id === Number(selectedProductId)) || null;
        }, [selectedProductId, products]);

        // Dynamic Document Title
        useEffect(() => {
          if (selectedProduct) {
            const prodName = lang === 'ar' ? (selectedProduct.nameAr || selectedProduct.nameFr) : selectedProduct.nameFr;
            document.title = `${prodName} | ${t.brand} — Men's Essentials`;
          } else {
            document.title = `${t.brand} — Men's Essentials | Luxe Minimaliste Maroc`;
          }
        }, [selectedProduct, lang, t]);

        useEffect(() => {
          const handleScroll = () => {
            setScrolled(window.scrollY > 20);
          };
          window.addEventListener('scroll', handleScroll, { passive: true });
          return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        // --- Hero Wallpaper Slider State & Definition ---
        const [heroSlide, setHeroSlide] = useState(0);
        const [isHeroPaused, setIsHeroPaused] = useState(false);
        const touchStartX = useRef(null);

        const nextHeroSlide = useCallback(() => {
          setHeroSlide(prev => (prev + 1) % 3);
        }, []);

        const prevHeroSlide = useCallback(() => {
          setHeroSlide(prev => (prev - 1 + 3) % 3);
        }, []);

        useEffect(() => {
          if (isHeroPaused) return;
          const timer = setInterval(() => {
            setHeroSlide(prev => (prev + 1) % 3);
          }, 6500);
          return () => clearInterval(timer);
        }, [isHeroPaused, heroSlide]);

        const heroSlides = useMemo(() => [
          {
            id: 0,
            wallpaper: '/images/hero-1-leather.jpg',
            badge: t.hero_badge,
            title: t.hero_title,
            subtitle: t.hero_subtitle,
            categoryFilter: 'all',
            cta1: t.hero_cta,
            cta1Href: '#collection',
            cta2: t.hero_story_btn,
            cta2Href: '#savoir-faire',
            tag: t.hero_tab_1 || "01 · Maroquinerie"
          },
          {
            id: 1,
            wallpaper: '/images/hero-2-botanical.jpg',
            badge: t.hero_slide2_badge || "Rituels Botaniques & Soins d'Origine",
            title: t.hero_slide2_title || "Élixirs de l'Atlas & Cèdre Millénaire",
            subtitle: t.hero_slide2_subtitle || "Formules pures infusées à l'huile de pépins de figue de barbarie et d'argan bio pour régénérer la peau et magnifier la barbe.",
            categoryFilter: 'soins',
            cta1: t.hero_slide2_cta1 || "Découvrir les Soins",
            cta1Href: '#collection',
            cta2: t.hero_slide2_cta2 || "Ingrédients d'Origine",
            cta2Href: '#savoir-faire',
            tag: t.hero_tab_2 || "02 · Soins Botaniques"
          },
          {
            id: 2,
            wallpaper: '/images/hero-3-linen.jpg',
            badge: t.hero_slide3_badge || "Ligne Maison, Bain & Matières Nobles",
            title: t.hero_slide3_title || "L'Art de Vivre au Naturel",
            subtitle: t.hero_slide3_subtitle || "Peignoirs en lin pré-lavé 380g/m² et plaids en mérinos extra-fin façonnés pour des moments de calme souverain.",
            categoryFilter: 'maison',
            cta1: t.hero_slide3_cta1 || "Voir la Ligne Maison",
            cta1Href: '#collection',
            cta2: t.hero_slide3_cta2 || "Héritage Artisanal",
            cta2Href: '#savoir-faire',
            tag: t.hero_tab_3 || "03 · Maison & Bain"
          }
        ], [t]);

        const [checkoutOpen, setCheckoutOpen] = useState(false);
        const [currentInvoiceOrder, setCurrentInvoiceOrder] = useState(null);
        const [trackingOpen, setTrackingOpen] = useState(false);
        const [adminOpen, setAdminOpen] = useState(false);
        const [productFormModal, setProductFormModal] = useState(null); // null or product object

        // --- Toasts ---
        const [toasts, setToasts] = useState([]);
        const showToast = useCallback((msg, type = 'info') => {
          const id = Date.now() + Math.random();
          setToasts(prev => [...prev, { id, msg, type }]);
          setTimeout(() => {
            setToasts(prev => prev.filter(t => t.id !== id));
          }, 3200);
        }, []);

        // --- Admin Authentication & Token ---
        const [adminToken, setAdminToken] = useState(() => {
          return sessionStorage.getItem('ettore_admin_token') || '';
        });
        const [adminUser, setAdminUser] = useState('');
        const [adminPass, setAdminPass] = useState('');
        const [adminLoginError, setAdminLoginError] = useState('');
        const [adminActiveTab, setAdminActiveTab] = useState('products');

        // --- Load Products from API or Seed ---
        const fetchProducts = useCallback(async () => {
          setLoadingProducts(true);
          try {
            const res = await fetch('/api/products');
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data) && data.length > 0) {
                setProducts(data);
              } else {
                // Seed if empty
                await fetch('/api/seed', { method: 'POST' });
                const seedRes = await fetch('/api/products');
                if (seedRes.ok) {
                  const seedData = await seedRes.json();
                  if (Array.isArray(seedData) && seedData.length > 0) {
                    setProducts(seedData);
                  }
                }
              }
            }
          } catch (err) {
            console.warn('API local/cloudflare non disponible, utilisation du catalogue local :', err);
          } finally {
            setLoadingProducts(false);
          }
        }, []);

        useEffect(() => {
          fetchProducts();
        }, [fetchProducts]);

        // --- Fetch Admin Orders ---
        const fetchAdminOrders = useCallback(async () => {
          if (!adminToken) return;
          try {
            const res = await fetch('/api/orders', {
              headers: { Authorization: `Bearer ${adminToken}` }
            });
            if (res.ok) {
              const list = await res.json();
              setOrders(list || []);
            }
          } catch (err) {
            console.error('Erreur chargement commandes admin:', err);
          }
        }, [adminToken]);

        useEffect(() => {
          if (adminToken && adminOpen) {
            fetchAdminOrders();
          }
        }, [adminToken, adminOpen, fetchAdminOrders]);

        // --- Keyboard Shortcuts: Ctrl+Shift+A & Escape ---
        useEffect(() => {
          const handleKeyDown = (e) => {
            if (e.key === 'Escape') {
              setMobileDrawerOpen(false);
              setCartOpen(false);
              setQuickViewProduct(null);
              setCheckoutOpen(false);
              setCurrentInvoiceOrder(null);
              setTrackingOpen(false);
              setAdminOpen(false);
              setProductFormModal(null);
            }
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
              e.preventDefault();
              setAdminOpen(prev => !prev);
            }
          };
          window.addEventListener('keydown', handleKeyDown);
          return () => window.removeEventListener('keydown', handleKeyDown);
        }, []);

        // --- Cart Calculations ---
        const cartTotals = useMemo(() => {
          let subtotal = 0;
          cart.forEach(item => {
            subtotal += Number(item.price) * Number(item.quantity);
          });
          const discount = appliedPromo.toUpperCase() === 'RAWCRAFT10' ? Math.round(subtotal * 0.10) : 0;
          const shipping = 0;
          const total = Math.max(0, subtotal - discount + shipping);
          const itemCount = cart.reduce((sum, item) => sum + item.quantity, 0);
          return { subtotal, discount, shipping, total, itemCount };
        }, [cart, appliedPromo]);

        // Pulse cart badge whenever item count changes
        useEffect(() => {
          if (cartTotals.itemCount > 0) {
            setBadgePulsing(true);
            const timer = setTimeout(() => setBadgePulsing(false), 700);
            return () => clearTimeout(timer);
          }
        }, [cartTotals.itemCount]);

        // --- Cart Actions ---
        const addToCart = (product, sizeChoice, colorChoice, qty = 1) => {
          if (!product.inStock || product.stock <= 0) {
            showToast(t.out_of_stock, 'error');
            return;
          }

          const size = sizeChoice || (product.sizes && product.sizes[0]) || '';
          const color = colorChoice || (product.colors && product.colors[0]) || '';
          const lineKey = `${product.id}_${size}_${color}`;

          // Trigger pulse and bounce tracking
          setLastAddedLineKey(lineKey);
          setBadgePulsing(true);
          setTimeout(() => setBadgePulsing(false), 700);

          setCart(prev => {
            const existing = prev.find(item => item.lineKey === lineKey);
            if (existing) {
              const newQty = Math.min(product.stock, existing.quantity + qty);
              return prev.map(item => item.lineKey === lineKey ? { ...item, quantity: newQty } : item);
            } else {
              return [...prev, {
                lineKey,
                productId: product.id,
                nameFr: product.nameFr,
                nameAr: product.nameAr,
                price: product.price,
                stock: product.stock,
                size,
                color,
                quantity: Math.min(product.stock, qty),
                image: (product.images && product.images[0]) || ''
              }];
            }
          });

          showToast(t.toast_added, 'success');
          setCartOpen(true);
        };

        const updateCartQty = (lineKey, newQty) => {
          setCart(prev => {
            return prev.map(item => {
              if (item.lineKey === lineKey) {
                const clamped = Math.max(1, Math.min(item.stock, newQty));
                return { ...item, quantity: clamped };
              }
              return item;
            });
          });
        };

        const removeFromCart = (lineKey) => {
          setCart(prev => prev.filter(item => item.lineKey !== lineKey));
          showToast(t.toast_removed, 'info');
        };

        const clearCart = () => {
          setCart([]);
          showToast(t.toast_empty, 'info');
        };

        // --- Wishlist Toggle ---
        const toggleWishlist = (productId) => {
          setWishlist(prev => {
            if (prev.includes(productId)) {
              return prev.filter(id => id !== productId);
            } else {
              return [...prev, productId];
            }
          });
        };

        // --- Quick View Launcher ---
        const openQuickView = (product) => {
          setQuickViewProduct(product);
          setQuickViewImageIdx(0);
          setQuickViewSize((product.sizes && product.sizes[0]) || '');
          setQuickViewColor((product.colors && product.colors[0]) || '');
        };

        // --- Filtered and Sorted Products ---
        const filteredProducts = useMemo(() => {
          return products.filter(p => {
            // Category
            if (selectedCategory !== 'all' && p.category !== selectedCategory) return false;
            // Stock only
            if (onlyInStock && (!p.inStock || p.stock <= 0)) return false;
            // Search Query
            if (searchQuery.trim()) {
              const q = searchQuery.toLowerCase().trim();
              const matchFr = (p.nameFr || '').toLowerCase().includes(q) || (p.descFr || '').toLowerCase().includes(q);
              const matchAr = (p.nameAr || '').toLowerCase().includes(q) || (p.descAr || '').toLowerCase().includes(q);
              if (!matchFr && !matchAr) return false;
            }
            return true;
          }).sort((a, b) => {
            if (sortOrder === 'asc') return a.price - b.price;
            if (sortOrder === 'desc') return b.price - a.price;
            return a.id - b.id;
          });
        }, [products, selectedCategory, onlyInStock, searchQuery, sortOrder]);

        // --- Admin KPI Stats ---
        const adminKPIs = useMemo(() => {
          const validOrders = orders.filter(o => o.status !== 'Annulée');
          const totalSales = validOrders.reduce((sum, o) => sum + Number(o.total || 0), 0);
          const orderCount = validOrders.length;
          const avgBasket = orderCount > 0 ? Math.round(totalSales / orderCount) : 0;
          const outOfStockCount = products.filter(p => !p.inStock || p.stock === 0).length;
          return { totalSales, orderCount, avgBasket, outOfStockCount };
        }, [orders, products]);

        // --- Admin Login Action ---
        const handleAdminLogin = async (e) => {
          e.preventDefault();
          setAdminLoginError('');
          try {
            const res = await fetch('/api/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ user: adminUser, pass: adminPass })
            });
            const data = await res.json();
            if (res.ok && data.token) {
              setAdminToken(data.token);
              sessionStorage.setItem('ettore_admin_token', data.token);
              showToast('Connexion réussie', 'success');
              fetchAdminOrders();
            } else {
              setAdminLoginError(data.error || 'Identifiants invalides');
            }
          } catch {
            setAdminLoginError('Erreur de connexion au serveur');
          }
        };

        const handleAdminLogout = () => {
          setAdminToken('');

      // ========================================================================
      // SUB-COMPONENT: CHECKOUT COD MODAL
      // ========================================================================
      function CheckoutModal({ cart, totals, promoCode, lang, t, onClose, onSuccess, onError }) {
        const [customerName, setCustomerName] = useState('');
        const [customerPhone, setCustomerPhone] = useState('');
        const [city, setCity] = useState(MOROCCAN_CITIES[0].id);
        const [address, setAddress] = useState('');
        const [notes, setNotes] = useState('');
        const [submitting, setSubmitting] = useState(false);

        // Phone Validation (/^(06|07)\d{8}$/)
        const phoneClean = customerPhone.trim().replace(/\s+/g, '');
        const isPhoneValid = /^(06|07)\d{8}$/.test(phoneClean);
        const isFormValid = customerName.trim().length >= 3 && isPhoneValid && address.trim().length >= 5;

        const selectedCityObj = MOROCCAN_CITIES.find(c => c.id === city) || MOROCCAN_CITIES[0];

        const handleSubmit = async (e) => {
          e.preventDefault();
          if (!isFormValid || submitting) return;

          setSubmitting(true);
          try {
            const payload = {
              customerName: customerName.trim(),
              customerPhone: phoneClean,
              city: selectedCityObj.nameFr,
              address: address.trim(),
              notes: notes.trim(),
              promoCode: promoCode || null,
              items: cart.map(item => ({
                productId: item.productId,
                quantity: item.quantity,
                size: item.size,
                color: item.color
              }))
            };

            const res = await fetch('/api/orders', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (res.ok && data.order) {
              onSuccess(data.order);
            } else {
              onError(data.error || 'Erreur lors de la commande');
            }
          } catch (err) {
            onError('Impossible de contacter le serveur.');
          } finally {
            setSubmitting(false);
          }
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto overflow-x-hidden">
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs" onClick={onClose} />
            <div className="relative bg-canvas w-full max-w-xl max-h-[90vh] overflow-y-auto overflow-x-hidden z-10 shadow-2xl border border-taupe/30 p-5 sm:p-8 animate-modal-pop box-border my-auto">
              <button
                onClick={onClose}
                className="absolute top-4 end-4 text-taupe-dark hover:text-noir text-lg"
                aria-label="Fermer"
              >
                ✕
              </button>

              <h2 className="font-serif text-2xl sm:text-3xl font-semibold text-noir mb-1">
                {t.checkout_title}
              </h2>
              <p className="text-xs text-taupe-dark mb-6">
                {t.checkout_subtitle}
              </p>

              <form onSubmit={handleSubmit} className="space-y-4">
                {/* Nom */}
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-noir mb-1">
                    {t.name_label}
                  </label>
                  <input
                    type="text"
                    required
                    value={customerName}
                    onChange={(e) => setCustomerName(e.target.value)}
                    placeholder={t.name_placeholder}
                    className="w-full bg-card border border-taupe/30 px-3.5 py-2.5 text-xs text-noir focus:border-caramel"
                  />
                </div>

                {/* Téléphone avec validation live */}
                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="block text-xs font-bold uppercase tracking-wider text-noir">
                      {t.phone_label}
                    </label>
                    {customerPhone && (
                      <span className={`text-[11px] font-semibold ${isPhoneValid ? 'text-[#10B981]' : 'text-[#B91C1C]'}`}>
                        {isPhoneValid ? t.phone_valid : t.phone_invalid}
                      </span>
                    )}
                  </div>
                  <div className="relative">
                    <input
                      type="tel"
                      required
                      value={customerPhone}
                      onChange={(e) => setCustomerPhone(e.target.value)}
                      placeholder={t.phone_placeholder}

      // ========================================================================
      // SUB-COMPONENT: ORDER TRACKING MODAL
      // ========================================================================
      function TrackingModal({ lang, t, onClose, onViewInvoice }) {
        const [searchId, setSearchId] = useState('');
        const [loading, setLoading] = useState(false);
        const [orderResult, setOrderResult] = useState(null);
        const [notFound, setNotFound] = useState(false);

        const handleTrack = async (e) => {
          e.preventDefault();
          if (!searchId.trim()) return;

          setLoading(true);
          setNotFound(false);
          setOrderResult(null);

          try {
            const clean = searchId.trim().toUpperCase();
            const res = await fetch(`/api/orders/${clean}`);
            if (res.ok) {
              const data = await res.json();
              setOrderResult(data);
            } else {
              setNotFound(true);
            }
          } catch {
            setNotFound(true);
          } finally {
            setLoading(false);
          }
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto overflow-x-hidden">
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs" onClick={onClose} />
            <div className="relative bg-canvas w-full max-w-lg p-5 sm:p-8 z-10 shadow-2xl border border-taupe/30 animate-modal-pop box-border my-auto overflow-x-hidden">
              <button
                onClick={onClose}
                className="absolute top-4 end-4 text-taupe-dark hover:text-noir text-lg"
              >
                ✕
              </button>

              <h2 className="font-serif text-2xl sm:text-3xl font-semibold text-noir mb-2">
                {t.tracking_title}
              </h2>
              <p className="text-xs text-taupe-dark mb-6">
                Entrez votre identifiant de commande (ex: CMD-XXXXXX) pour voir l'état d'avancement.
              </p>

              <form onSubmit={handleTrack} className="flex gap-2 mb-6">
                <input
                  type="text"
                  required
                  value={searchId}
                  onChange={(e) => setSearchId(e.target.value)}
                  placeholder={t.tracking_input_placeholder}
                  className="flex-1 bg-card border border-taupe/30 px-3.5 py-2.5 text-xs text-noir uppercase focus:border-caramel"
                />
                <button
                  type="submit"
                  disabled={loading}
                  className="px-5 py-2.5 bg-noir text-white text-xs font-semibold uppercase tracking-wider hover:bg-caramel transition-colors"
                >
                  {loading ? '...' : t.tracking_btn}
                </button>
              </form>

              {notFound && (
                <div className="p-4 bg-[#FEE2E2] text-[#991B1B] text-xs border border-[#FCA5A5] mb-4">
                  Aucune commande trouvée pour la référence "{searchId}". Vérifiez le code.
                </div>
              )}

              {orderResult && (
                <div className="bg-card border border-taupe/20 p-5 space-y-4">
                  <div className="flex items-center justify-between pb-3 border-b border-taupe/15">
                    <div>
                      <div className="text-xs text-taupe-dark">{t.tracking_input_label}</div>
                      <div className="text-sm font-bold text-noir">{orderResult.id}</div>
                    </div>
                    <span className="px-3 py-1 bg-noir text-white text-xs font-semibold rounded-xs">
                      {orderResult.status}
                    </span>
                  </div>

                  <div className="grid grid-cols-2 gap-3 text-xs">
                    <div>
                      <span className="text-taupe-dark block">{t.tracking_client} :</span>
                      <span className="font-medium text-noir">{orderResult.customerName}</span>
                    </div>
                    <div>
                      <span className="text-taupe-dark block">{t.tracking_city} :</span>
                      <span className="font-medium text-noir">{orderResult.city}</span>
                    </div>
                    <div>
                      <span className="text-taupe-dark block">{t.tracking_date} :</span>
                      <span className="font-medium text-noir">{new Date(orderResult.date).toLocaleDateString()}</span>
                    </div>
                    <div>
                      <span className="text-taupe-dark block">{t.total} :</span>
                      <span className="font-bold text-caramel">{Number(orderResult.total).toLocaleString()} MAD</span>
                    </div>
                  </div>

                  <button
                    onClick={() => onViewInvoice(orderResult)}

              )}

          </div>

              id: initialData.id,
              nameFr,
              nameAr,
              price: Number(price),
              oldPrice: oldPrice ? Number(oldPrice) : null,
              stock: Number(stock),
              inStock: Number(stock) > 0,
              category,
              badge,
              isNew: badge === 'new',
              rating: initialData.rating || 5,
              images: images.length > 0 ? images : initialData.images,
              descFr,
              descAr,
              sizes,
              colors
            };

            const res = await fetch('/api/products', {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`
              },
              body: JSON.stringify(payload)
            });

            if (res.ok) {
              const resData = await res.json().catch(() => ({}));
              onSaved(resData.product || payload);
            } else {
              const data = await res.json();
              onError(data.error || 'Erreur enregistrement');
            }
          } catch (err) {
            onError('Erreur de connexion');
          }
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs" onClick={onClose} />
            <div className="relative bg-canvas w-full max-w-2xl max-h-[90vh] overflow-y-auto z-10 shadow-2xl border border-taupe/30 p-6 sm:p-8">
              <button onClick={onClose} className="absolute top-4 end-4 text-taupe-dark hover:text-noir text-lg">✕</button>

              <h3 className="font-serif text-2xl font-bold text-noir mb-4">
                {initialData.id ? 'Modifier le Produit' : 'Ajouter un Produit'}
              </h3>

              <form onSubmit={handleSubmit} className="space-y-4 text-xs">
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block font-bold uppercase mb-1">Nom (FR) *</label>
                    <input
                      type="text"
                      required
                      value={nameFr}
                      onChange={(e) => setNameFr(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2"
                    />
                  </div>
                  <div>
                    <label className="block font-bold uppercase mb-1">Nom (AR)</label>
                    <input
                      type="text"
                      dir="rtl"
                      value={nameAr}
                      onChange={(e) => setNameAr(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-3 gap-3">
                  <div>
                    <label className="block font-bold uppercase mb-1">Prix (MAD) *</label>
                    <input
                      type="number"
                      required
                      value={price}
                      onChange={(e) => setPrice(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2"
                    />
                  </div>
                  <div>
                    <label className="block font-bold uppercase mb-1">Ancien Prix</label>
                    <input
                      type="number"
                      value={oldPrice}
                      onChange={(e) => setOldPrice(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2"
                    />
                  </div>
                  <div>
                    <label className="block font-bold uppercase mb-1">Stock *</label>
                    <input
                      type="number"
                      required
                      value={stock}
                      onChange={(e) => setStock(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block font-bold uppercase mb-1">Catégorie</label>
                    <select
                      value={category}
                      onChange={(e) => setCategory(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2"
                    >
                      <option value="chaussures">Chaussures</option>
                      <option value="soins">Soins</option>
                      <option value="maison">Maison</option>
                    </select>
                  </div>
                  <div>
                    <label className="block font-bold uppercase mb-1">Badge</label>
                    <select
                      value={badge}
                      onChange={(e) => setBadge(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2"
                    >
                      <option value="new">Nouveau</option>
                      <option value="exclusive">Exclusif</option>
                      <option value="luxury">Édition Limitée</option>
                      <option value="out">Rupture</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block font-bold uppercase mb-1">URLs Photos (séparées par des virgules)</label>
                  <textarea
                    rows="2"
                    value={imagesStr}
                    onChange={(e) => setImagesStr(e.target.value)}
                    placeholder="https://..., data:image/svg+xml..."
                    className="w-full bg-card border border-taupe/30 p-2"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block font-bold uppercase mb-1">Tailles / Formats (virgules)</label>
                    <input
                      type="text"
                      value={sizesStr}
                      onChange={(e) => setSizesStr(e.target.value)}
                      placeholder="40, 41, 42..."
                      className="w-full bg-card border border-taupe/30 p-2"
                    />
                  </div>
                  <div>
                    <label className="block font-bold uppercase mb-1">Couleurs Hex (virgules)</label>
                    <input
                      type="text"
                      value={colorsStr}
                      onChange={(e) => setColorsStr(e.target.value)}
                      placeholder="#171717, #3D2B1F..."
                      className="w-full bg-card border border-taupe/30 p-2"
                    />
                  </div>
                </div>

                <div>
                  <label className="block font-bold uppercase mb-1">Description (FR)</label>
                  <textarea
                    rows="2"
                    value={descFr}
                    onChange={(e) => setDescFr(e.target.value)}
                    className="w-full bg-card border border-taupe/30 p-2"
                  />
                </div>

                <div>
                  <label className="block font-bold uppercase mb-1">Description (AR)</label>
                  <textarea
                    rows="2"
                    dir="rtl"
                    value={descAr}
                    onChange={(e) => setDescAr(e.target.value)}
                    className="w-full bg-card border border-taupe/30 p-2"
                  />
                </div>

                <div className="pt-2 flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-4 py-2 border border-taupe/30 hover:border-noir text-noir"
                  >
                    Annuler
                  </button>
                  <button
                    type="submit"
                    className="px-6 py-2 bg-noir text-white font-semibold uppercase tracking-wider hover:bg-caramel"
                  >
                    Enregistrer
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      // ========================================================================
      // MOUNT APPLICATION
      // ========================================================================
      const rootEl = document.getElementById('root');
      if (rootEl) {
        ReactDOM.createRoot(rootEl).render(<App />);
      }
    </script>
  </body>
</html>
