      // ========================================================================
      // SUB-COMPONENT: PRODUCT FORM MODAL (Add / Edit + Firebase Image Upload)
      // ========================================================================
      function ProductFormModal({ initialData, token, lang, t, onClose, onSaved, onError }) {
        const [nameFr, setNameFr] = useState(initialData.nameFr || '');
        const [nameAr, setNameAr] = useState(initialData.nameAr || '');
        const [price, setPrice] = useState(initialData.price || '');
        const [oldPrice, setOldPrice] = useState(initialData.oldPrice || '');
        const [stock, setStock] = useState(initialData.stock || 0);
        const [category, setCategory] = useState(initialData.category || PRODUCT_CATEGORIES[0]);
        const [badge, setBadge] = useState(initialData.badge || 'new');
        const [imagesList, setImagesList] = useState(Array.isArray(initialData.images) ? [...initialData.images] : []);
        const [newImageUrl, setNewImageUrl] = useState('');
        const [draggedImgIdx, setDraggedImgIdx] = useState(null);
        const [dragOverImgIdx, setDragOverImgIdx] = useState(null);
        const [descFr, setDescFr] = useState(initialData.descFr || '');
        const [descAr, setDescAr] = useState(initialData.descAr || '');
        const [sizesStr, setSizesStr] = useState((initialData.sizes || []).join(', '));
        const [colorsStr, setColorsStr] = useState((initialData.colors || []).join(', '));
        const [uploading, setUploading] = useState(false);
        const [uploadError, setUploadError] = useState('');

        const handleFileUpload = async (e) => {
          const files = Array.from(e.target.files || []);
          if (files.length === 0) return;
          setUploading(true);
          setUploadError('');

          try {
            for (const file of files) {
              const base64Data = await compressImageFile(file, 1100, 0.82);

              const res = await fetch('/api/upload', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  Authorization: `Bearer ${token}`
                },
                body: JSON.stringify({
                  file: base64Data,
                  filename: file.name,
                  folder: 'products'
                })
              });

              const data = await res.json();
              if (res.ok && data.url) {
                setImagesList(prev => [...prev, data.url]);
              } else {
                setUploadError(data.error || "Erreur lors de l'upload de l'image");
              }
            }
          } catch (err) {
            setUploadError("Erreur lors de l'envoi vers Firebase Storage");
          } finally {
            setUploading(false);
            e.target.value = '';
          }
        };

        const handleRemoveImage = (indexToRemove) => {
          setImagesList(prev => prev.filter((_, idx) => idx !== indexToRemove));
        };

        // Move a photo from `fromIndex` to `toIndex` (0-based) to choose 1st, 2nd, 3rd, etc.
        const handleMoveImage = (fromIndex, toIndex) => {
          setImagesList(prev => {
            if (fromIndex < 0 || fromIndex >= prev.length) return prev;
            const boundedTo = Math.max(0, Math.min(prev.length - 1, toIndex));
            if (fromIndex === boundedTo) return prev;
            const next = [...prev];
            const [moved] = next.splice(fromIndex, 1);
            next.splice(boundedTo, 0, moved);
            return next;
          });
        };

        const handleAddManualImageUrl = () => {
          const trimmed = (newImageUrl || '').trim();
          if (!trimmed) return;
          setImagesList(prev => [...prev, trimmed]);
          setNewImageUrl('');
        };

        const handleSubmit = async (e) => {
          e.preventDefault();
          try {
            const pendingUrl = (newImageUrl || '').trim();
            const finalImages = pendingUrl ? [...imagesList, pendingUrl] : [...imagesList];
            const sizes = sizesStr.split(',').map(s => s.trim()).filter(Boolean);
            const colors = colorsStr.split(',').map(s => s.trim()).filter(Boolean);

            const payload = {
              id: initialData.id,
              position: initialData.position,
              nameFr,
              nameAr,
              price: Number(price),
              oldPrice: oldPrice ? Number(oldPrice) : null,
              stock: Number(stock),
              inStock: Number(stock) > 0,
              category,
              badge,
              isNew: badge === 'new',
              rating: initialData.rating || 5,
              images: finalImages.length > 0 ? finalImages : ['data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="%23f3f1ec"/><text x="200" y="200" fill="%23999" text-anchor="middle">MODANOVA</text></svg>'],
              descFr,
              descAr,
              sizes,
              colors
            };

            const res = await fetch('/api/products', {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`
              },
              body: JSON.stringify(payload)
            });

            if (res.ok) {
              const resData = await res.json().catch(() => ({}));
              onSaved(resData.product || payload);
            } else {
              const data = await res.json();
              onError(data.error || 'Erreur enregistrement');
            }
          } catch (err) {
            onError('Erreur de connexion');
          }
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs" onClick={onClose} />
            <div className="relative bg-canvas w-full max-w-2xl max-h-[90vh] overflow-y-auto z-10 shadow-2xl border border-taupe/30 p-6 sm:p-8">
              <button onClick={onClose} className="absolute top-4 end-4 text-taupe-dark hover:text-noir text-lg">✕</button>

              <h3 className="font-serif text-2xl font-bold text-noir mb-4">
                {initialData.id ? 'Modifier le Produit' : 'Ajouter un Produit'}
              </h3>

              <form onSubmit={handleSubmit} className="space-y-4 text-xs">
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block font-bold uppercase mb-1">Nom (FR) *</label>
                    <input
                      type="text"
                      required
                      value={nameFr}
                      onChange={(e) => setNameFr(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2"
                    />
                  </div>
                  <div>
                    <label className="block font-bold uppercase mb-1">Nom (AR)</label>
                    <input
                      type="text"
                      dir="rtl"
                      value={nameAr}
                      onChange={(e) => setNameAr(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-3 gap-3">
                  <div>
                    <label className="block font-bold uppercase mb-1">Prix (MAD) *</label>
                    <input
                      type="number"
                      required
                      value={price}
                      onChange={(e) => setPrice(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2"
                    />
                  </div>
                  <div>
                    <label className="block font-bold uppercase mb-1">Ancien Prix</label>
                    <input
                      type="number"
                      value={oldPrice}
                      onChange={(e) => setOldPrice(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2"
                    />
                  </div>
                  <div>
                    <label className="block font-bold uppercase mb-1">Stock *</label>
                    <input
                      type="number"
                      required
                      value={stock}
                      onChange={(e) => setStock(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block font-bold uppercase mb-1">Catégorie *</label>
                    <select
                      value={category}
                      onChange={(e) => setCategory(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2 font-medium"
                    >
                      {PRODUCT_CATEGORIES.map(cat => (
                        <option key={cat} value={cat}>{cat}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block font-bold uppercase mb-1">Badge</label>
                    <select
                      value={badge}
                      onChange={(e) => setBadge(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2"
                    >
                      <option value="new">Nouveau</option>
                      <option value="exclusive">Exclusif</option>
                      <option value="luxury">Édition Limitée</option>
                      <option value="out">Rupture</option>
                    </select>
                  </div>
                </div>

                {/* Section Upload & Réorganisation des Photos du Produit */}
                <div className="border border-dashed border-caramel/50 bg-[#FAF7F2] p-4 rounded-xs space-y-3">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <span className="font-bold uppercase text-[11px] text-noir block">
                        📸 Photos du Produit & Ordre d'Affichage (1er, 2ème, 3ème...)
                      </span>
                      <span className="text-[10px] text-taupe-dark block mt-0.5">
                        Déplacez les photos (flèches <strong>← →</strong>, menu <strong>1er, 2e, 3e...</strong> ou glisser-déposer) pour choisir la 1ère photo principale, la 2ème, la 3ème, etc.
                      </span>
                    </div>
                    <label className={`px-3.5 py-2 bg-noir hover:bg-caramel text-white text-[11px] font-semibold cursor-pointer rounded-xs transition-colors flex items-center gap-1.5 shrink-0 shadow-xs ${uploading ? 'opacity-50 pointer-events-none' : ''}`}>
                      <span>{uploading ? '⏳ Upload Firebase...' : '📁 Ajouter photo(s)'}</span>
                      <input
                        type="file"
                        accept="image/*"
                        multiple
                        onChange={handleFileUpload}
                        className="hidden"
                        disabled={uploading}
                      />
                    </label>
                  </div>

                  {uploadError && (
                    <div className="p-2 bg-red-100 text-red-800 text-[11px] rounded-xs">
                      {uploadError}
                    </div>
                  )}

                  {/* Reorderable Photo Gallery (1st, 2nd, 3rd, etc.) */}
                  {imagesList.length > 0 ? (
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 pt-2 border-t border-taupe/20">
                      {imagesList.map((imgUrl, i) => {
                        const isFirst = i === 0;
                        const isBeingDragged = draggedImgIdx === i;
                        const isDragTarget = dragOverImgIdx === i && draggedImgIdx !== i;

                        return (
                          <div
                            key={`${i}-${imgUrl.slice(0, 24)}`}
                            draggable
                            onDragStart={(e) => {
                              setDraggedImgIdx(i);
                              try {
                                e.dataTransfer.effectAllowed = 'move';
                                e.dataTransfer.setData('text/plain', String(i));
                              } catch {}
                            }}
                            onDragOver={(e) => {
                              e.preventDefault();
                              if (dragOverImgIdx !== i) {
                                setDragOverImgIdx(i);
                              }
                            }}
                            onDragLeave={() => {
                              if (dragOverImgIdx === i) {
                                setDragOverImgIdx(null);
                              }
                            }}
                            onDrop={(e) => {
                              e.preventDefault();
                              const fromIdx = draggedImgIdx != null ? draggedImgIdx : Number(e.dataTransfer.getData('text/plain'));
                              setDraggedImgIdx(null);
                              setDragOverImgIdx(null);
                              if (!isNaN(fromIdx)) {
                                handleMoveImage(fromIdx, i);
                              }
                            }}
                            onDragEnd={() => {
                              setDraggedImgIdx(null);
                              setDragOverImgIdx(null);
                            }}
                            className={`relative bg-white border rounded-xs p-2 flex flex-col justify-between shadow-2xs transition-all cursor-grab active:cursor-grabbing ${
                              isBeingDragged
                                ? 'opacity-40 scale-95 border-caramel'
                                : isDragTarget
                                ? 'border-2 border-caramel ring-2 ring-caramel/30 bg-caramel/5'
                                : isFirst
                                ? 'border-2 border-caramel'
                                : 'border-taupe/30 hover:border-noir/50'
                            }`}
                          >
                            {/* Top Bar: Rank Badge + Position Dropdown + Delete Button */}
                            <div className="flex items-center justify-between gap-1 mb-1.5">
                              <div className="flex items-center gap-1">
                                <span
                                  className={`px-1.5 py-0.5 text-[10px] font-bold uppercase rounded-2xs ${
                                    isFirst
                                      ? 'bg-noir text-[#E6C687]'
                                      : 'bg-canvas text-noir border border-taupe/25'
                                  }`}
                                >
                                  {isFirst ? '★ 1ère (Principale)' : `${i + 1}ème`}
                                </span>
                              </div>

                              <div className="flex items-center gap-1">
                                {imagesList.length > 1 && (
                                  <select
                                    value={i + 1}
                                    onChange={(e) => handleMoveImage(i, Number(e.target.value) - 1)}
                                    className="bg-canvas border border-taupe/35 text-noir font-mono text-[10px] font-bold px-1 py-0.5 rounded-2xs cursor-pointer hover:border-caramel"
                                    title="Choisir la position de cette photo (1ère, 2ème, 3ème...)"
                                  >
                                    {imagesList.map((_, posIdx) => (
                                      <option key={posIdx} value={posIdx + 1}>
                                        {posIdx === 0 ? 'Pos: 1er' : `Pos: ${posIdx + 1}e`}
                                      </option>
                                    ))}
                                  </select>
                                )}
                                <button
                                  type="button"
                                  onClick={() => handleRemoveImage(i)}
                                  className="bg-red-600 hover:bg-red-700 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-2xs transition-colors"
                                  title="Supprimer cette photo"
                                >
                                  ✕
                                </button>
                              </div>
                            </div>

                            {/* Image Preview */}
                            <div className="w-full h-28 bg-[#F7F5F0] border border-taupe/15 rounded-2xs overflow-hidden flex items-center justify-center p-1 mb-2">
                              <img src={imgUrl} alt={`Photo ${i + 1}`} className="w-full h-full object-contain pointer-events-none" />
                            </div>

                            {/* Bottom Reorder Controls: Left (←), Make 1st (★ 1er), Right (→) */}
                            {imagesList.length > 1 && (
                              <div className="flex items-center justify-between gap-1 pt-1 border-t border-taupe/15">
                                <button
                                  type="button"
                                  disabled={i === 0}
                                  onClick={() => handleMoveImage(i, i - 1)}
                                  className={`px-2 py-1 text-[10px] font-bold rounded-2xs border transition-colors ${
                                    i === 0
                                      ? 'border-taupe/15 text-taupe/40 cursor-not-allowed'
                                      : 'border-taupe/30 bg-canvas hover:bg-noir hover:text-white text-noir'
                                  }`}
                                  title="Déplacer vers la gauche (position précédente)"
                                >
                                  ← Gauche
                                </button>

                                {!isFirst && (
                                  <button
                                    type="button"
                                    onClick={() => handleMoveImage(i, 0)}
                                    className="px-1.5 py-1 text-[10px] font-bold rounded-2xs bg-caramel/15 hover:bg-caramel text-caramel hover:text-white border border-caramel/30 transition-colors"
                                    title="Définir comme 1ère photo principale"
                                  >
                                    ★ 1er
                                  </button>
                                )}

                                <button
                                  type="button"
                                  disabled={i === imagesList.length - 1}
                                  onClick={() => handleMoveImage(i, i + 1)}
                                  className={`px-2 py-1 text-[10px] font-bold rounded-2xs border transition-colors ${
                                    i === imagesList.length - 1
                                      ? 'border-taupe/15 text-taupe/40 cursor-not-allowed'
                                      : 'border-taupe/30 bg-canvas hover:bg-noir hover:text-white text-noir'
                                  }`}
                                  title="Déplacer vers la droite (position suivante)"
                                >
                                  Droite →
                                </button>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  ) : (
                    <div className="text-center py-4 text-taupe-dark text-[11px] border-t border-taupe/15">
                      Aucune photo ajoutée pour le moment. Cliquez sur « 📁 Ajouter photo(s) » ci-dessus.
                    </div>
                  )}

                  {/* Add Image by URL Option */}
                  <div className="pt-2 border-t border-taupe/20">
                    <label className="block font-bold uppercase text-[10px] text-taupe-dark mb-1">
                      Ajouter une photo via lien URL (optionnel)
                    </label>
                    <div className="flex items-center gap-2">
                      <input
                        type="text"
                        value={newImageUrl}
                        onChange={(e) => setNewImageUrl(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            e.preventDefault();
                            handleAddManualImageUrl();
                          }
                        }}
                        placeholder="https://... ou /uploads/..."
                        className="flex-1 bg-white border border-taupe/30 px-2.5 py-1.5 font-mono text-[11px]"
                      />
                      <button
                        type="button"
                        onClick={handleAddManualImageUrl}
                        className="px-3 py-1.5 bg-noir hover:bg-caramel text-white text-[11px] font-semibold rounded-xs transition-colors shrink-0"
                      >
                        + Ajouter URL
                      </button>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block font-bold uppercase mb-1">Tailles / Formats (virgules)</label>
                    <input
                      type="text"
                      value={sizesStr}
                      onChange={(e) => setSizesStr(e.target.value)}
                      placeholder="40, 41, 42..."
                      className="w-full bg-card border border-taupe/30 p-2"
                    />
                  </div>
                  <div>
                    <label className="block font-bold uppercase mb-1">Couleurs Hex (virgules)</label>
                    <input
                      type="text"
                      value={colorsStr}
                      onChange={(e) => setColorsStr(e.target.value)}
                      placeholder="#171717, #3D2B1F..."
                      className="w-full bg-card border border-taupe/30 p-2"
                    />
                  </div>
                </div>

                <div>
                  <label className="block font-bold uppercase mb-1">Description (FR)</label>
                  <textarea
                    rows="2"
                    value={descFr}
                    onChange={(e) => setDescFr(e.target.value)}
                    className="w-full bg-card border border-taupe/30 p-2"
                  />
                </div>

                <div>
                  <label className="block font-bold uppercase mb-1">Description (AR)</label>
                  <textarea
                    rows="2"
                    dir="rtl"
                    value={descAr}
                    onChange={(e) => setDescAr(e.target.value)}
                    className="w-full bg-card border border-taupe/30 p-2"
                  />
                </div>

                <div className="pt-2 flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-4 py-2 border border-taupe/30 hover:border-noir text-noir"
                  >
                    Annuler
                  </button>
                  <button
                    type="submit"
                    className="px-6 py-2 bg-noir text-white font-semibold uppercase tracking-wider hover:bg-caramel transition-colors"
                  >
                    Enregistrer
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      // ========================================================================
      // MOUNT APPLICATION
      // ========================================================================
      const rootEl = document.getElementById('root');
      if (rootEl) {
        ReactDOM.createRoot(rootEl).render(<App />);
      }
    </script>
  </body>
</html>
