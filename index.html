      // ========================================================================
      // Smart Image Compression for Firebase Firestore Persistence (< 300KB)
      // ========================================================================
      function compressImageFile(file, maxDim = 1100, quality = 0.82) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = reject;
          reader.onload = () => {
            const dataUrl = reader.result;
            if (typeof dataUrl !== 'string' || file.type === 'image/svg+xml') {
              return resolve(dataUrl);
            }
            const img = new Image();
            img.onerror = () => resolve(dataUrl);
            img.onload = () => {
              let { width, height } = img;
              if (width > maxDim || height > maxDim) {
                if (width >= height) {
                  height = Math.round((height * maxDim) / width);
                  width = maxDim;
                } else {
                  width = Math.round((width * maxDim) / height);
                  height = maxDim;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              if (!ctx) return resolve(dataUrl);
              ctx.drawImage(img, 0, 0, width, height);
              const compressed = canvas.toDataURL('image/jpeg', quality);
              resolve(compressed.length < dataUrl.length ? compressed : dataUrl);
            };
            img.src = dataUrl;
          };
          reader.readAsDataURL(file);
        });
      }

      // ========================================================================
      // Robust A4 Invoice HTML Builder (Zero White Pages, Strict CSS)
      // ========================================================================
      function buildInvoiceHTML(order, lang = 'fr') {
        const isAr = lang === 'ar';
        const dir = isAr ? 'rtl' : 'ltr';
        const font = isAr ? "'Cairo', sans-serif" : "'Plus Jakarta Sans', sans-serif";

        const orderId = escapeHTML(order.id || '');
        const dateStr = order.date ? new Date(order.date).toLocaleDateString(isAr ? 'ar-MA' : 'fr-FR', {
          year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
        }) : '';
        const clientName = escapeHTML(order.customerName || '');
        const clientPhone = escapeHTML(order.customerPhone || '');
        const city = escapeHTML(order.city || '');
        const address = escapeHTML(order.address || '');
        const notes = escapeHTML(order.notes || '');

        const subtotal = Number(order.subtotal || order.total || 0).toLocaleString(isAr ? 'ar-MA' : 'fr-FR');
        const discount = Number(order.discount || 0);
        const total = Number(order.total || 0).toLocaleString(isAr ? 'ar-MA' : 'fr-FR');

        let parsedItems = [];
        if (Array.isArray(order.items)) {
          parsedItems = order.items;
        } else if (typeof order.items === 'string') {
          try { parsedItems = JSON.parse(order.items); } catch { parsedItems = []; }
        }

        const itemsRows = (parsedItems || []).map((item, idx) => {
          const name = escapeHTML(isAr ? (item.nameAr || item.nameFr || item.name || 'Article') : (item.nameFr || item.name || 'Article'));
          const size = escapeHTML(item.size || 'Unique');
          const rawColor = String(item.color || '').trim();
          const colorName = item.colorLabel
            ? escapeHTML(item.colorLabel)
            : (rawColor ? escapeHTML(getColorLabel(rawColor, lang)) : (isAr ? 'قياسي' : 'Standard'));
          const colorHex = rawColor && rawColor.toLowerCase() !== 'default' && rawColor.toLowerCase() !== 'standard'
            ? escapeHTML(getColorCss(rawColor))
            : '';
          const qty = Number(item.quantity || item.qty || 1);
          const price = Number(item.price || 0).toLocaleString(isAr ? 'ar-MA' : 'fr-FR');
          const lineTotal = (Number(item.price || 0) * qty).toLocaleString(isAr ? 'ar-MA' : 'fr-FR');

          return `
            <tr style="border-bottom: 1px solid #ECE7E1;">
              <td style="padding: 10px 12px; text-align: ${isAr ? 'right' : 'left'}; font-weight: 600; color: #171717;">
                ${name}
                <div style="font-size: 11px; color: #555; font-weight: normal; margin-top: 3px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
                  <span>${isAr ? 'المقاس:' : 'Taille :'} <strong style="color:#171717;">${size}</strong></span>
                  <span style="color:#C7BEB5;">|</span>
                  <span style="display:inline-flex; align-items:center; gap:4px;">
                    ${isAr ? 'اللون:' : 'Couleur :'}
                    ${colorHex ? `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${colorHex};border:1px solid rgba(0,0,0,0.3);"></span>` : ''}
                    <strong style="color:#171717;">${colorName}</strong>
                  </span>
                </div>
              </td>
              <td style="padding: 10px 12px; text-align: center; color: #555; font-size: 13px;">${qty}</td>
              <td style="padding: 10px 12px; text-align: ${isAr ? 'left' : 'right'}; color: #555; font-size: 13px;">${price} MAD</td>
              <td style="padding: 10px 12px; text-align: ${isAr ? 'left' : 'right'}; font-weight: 600; color: #171717; font-size: 13px;">${lineTotal} MAD</td>
            </tr>
          `;
        }).join('');

        return `
          <div dir="${dir}" style="font-family: ${font}; color: #171717; background: #ffffff; padding: 24px; max-width: 780px; margin: 0 auto; box-sizing: border-box; font-size: 13px; line-height: 1.5;">
            <!-- Header -->
            <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #171717; padding-bottom: 18px; margin-bottom: 20px;">
              <div>
                <h1 style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 28px; letter-spacing: 4px; margin: 0; color: #171717; font-weight: 700;">MODANOVA</h1>
                <div style="font-size: 10px; letter-spacing: 2px; color: #9E8C7A; text-transform: uppercase; margin-top: 2px;">
                  MEN'S ESSENTIALS — MAROC
                </div>
              </div>
              <div style="text-align: ${isAr ? 'left' : 'right'};">
                <span style="display: inline-block; background: #F3F1EC; border: 1px solid #9E8C7A; color: #4A3525; padding: 4px 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; border-radius: 2px;">
                  ${isAr ? 'الدفع عند الاستلام (COD)' : 'Paiement à la livraison (COD)'}
                </span>
                <div style="font-size: 14px; font-weight: 700; color: #171717; margin-top: 6px;">
                  ${isAr ? 'طلب رقم' : 'Commande'} : <span style="color: #C28B53;">${orderId}</span>
                </div>
                <div style="font-size: 11px; color: #777;">${dateStr}</div>
              </div>
            </div>

            <!-- Client & Delivery Blocks -->
            <div style="display: flex; justify-content: space-between; gap: 20px; margin-bottom: 24px; background: #FAF9F6; padding: 14px 18px; border: 1px solid #ECE7E1;">
              <div style="flex: 1;">
                <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: #9E8C7A; letter-spacing: 1px; margin-bottom: 4px;">
                  ${isAr ? 'بيانات العميل' : 'Client & Coordonnées'}
                </div>
                <div style="font-size: 14px; font-weight: 700; color: #171717;">${clientName}</div>
                <div style="font-size: 13px; color: #444; direction: ltr; text-align: ${isAr ? 'right' : 'left'};">📞 ${clientPhone}</div>
              </div>
              <div style="flex: 1; text-align: ${isAr ? 'left' : 'right'};">
                <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: #9E8C7A; letter-spacing: 1px; margin-bottom: 4px;">
                  ${isAr ? 'عنوان التوصيل' : 'Adresse de Livraison'}
                </div>
                <div style="font-size: 13px; font-weight: 600; color: #171717;">📍 ${city}, Maroc</div>
                <div style="font-size: 12px; color: #555;">${address}</div>
                ${notes ? `<div style="font-size: 11px; color: #888; margin-top: 4px; font-style: italic;">Note: ${notes}</div>` : ''}
              </div>
            </div>

            <!-- Items Table -->
            <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
              <thead>
                <tr style="background: #171717; color: #FAF9F6;">
                  <th style="padding: 8px 12px; text-align: ${isAr ? 'right' : 'left'}; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;">
                    ${isAr ? 'المنتج' : 'Article'}
                  </th>
                  <th style="padding: 8px 12px; text-align: center; font-size: 11px; text-transform: uppercase; width: 60px;">
                    ${isAr ? 'الكمية' : 'Qté'}
                  </th>
                  <th style="padding: 8px 12px; text-align: ${isAr ? 'left' : 'right'}; font-size: 11px; text-transform: uppercase; width: 110px;">
                    ${isAr ? 'السعر' : 'Prix Unitaire'}
                  </th>
                  <th style="padding: 8px 12px; text-align: ${isAr ? 'left' : 'right'}; font-size: 11px; text-transform: uppercase; width: 110px;">
                    ${isAr ? 'المجموع' : 'Total'}
                  </th>
                </tr>
              </thead>
              <tbody>
                ${itemsRows}
              </tbody>
            </table>

            <!-- Totals -->
            <div style="display: flex; justify-content: flex-end; margin-bottom: 24px;">
              <div style="width: 280px; background: #FAF9F6; border: 1px solid #ECE7E1; padding: 12px 16px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 6px; color: #555; font-size: 12px;">
                  <span>${isAr ? 'المجموع الفرعي:' : 'Sous-total:'}</span>
                  <span>${subtotal} MAD</span>
                </div>
                ${discount > 0 ? `
                  <div style="display: flex; justify-content: space-between; margin-bottom: 6px; color: #10B981; font-weight: 600; font-size: 12px;">
                    <span>${isAr ? `خصم (${order.promoCode || 'كوبون'}):` : `Remise (${order.promoCode || 'Coupon'}):`}</span>
                    <span>-${discount.toLocaleString(isAr ? 'ar-MA' : 'fr-FR')} MAD</span>
                  </div>
                ` : ''}
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px; color: #555; font-size: 12px;">
                  <span>${isAr ? 'التوصيل السريع:' : 'Livraison express:'}</span>
                  <span style="color: ${Number(order.shippingFee || 0) > 0 ? '#171717' : '#10B981'}; font-weight: 600;">
                    ${Number(order.shippingFee || 0) > 0
                      ? `${Number(order.shippingFee).toLocaleString(isAr ? 'ar-MA' : 'fr-FR')} MAD`
                      : (isAr ? 'مجاناً' : 'Gratuite')}
                  </span>
                </div>
                <div style="border-top: 2px solid #171717; padding-top: 8px; display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; color: #171717;">
                  <span>${isAr ? 'المجموع للدفع عند الاستلام:' : 'TOTAL À PAYER (COD):'}</span>
                  <span style="color: #C28B53;">${total} MAD</span>
                </div>
              </div>
            </div>

            <!-- Footer & Signature -->
            <div style="border-top: 1px solid #ECE7E1; padding-top: 14px; text-align: center; color: #7A6C5D; font-size: 11px;">
              <div style="font-weight: 600; color: #171717; margin-bottom: 4px;">
                ${isAr ? 'شكراً لثقتكم في مودانوفا — دار الأناقة الرجالية بالمغرب' : 'Merci pour votre confiance en MODANOVA — Maison Marocaine des Essentiels'}
              </div>
              <div>Atelier & Support : Kenitra, Maroc | WhatsApp : ${escapeHTML(getActiveStorePhoneDisplay())}</div>
              <div style="font-size: 10px; color: #999; margin-top: 2px;">
                ${isAr ? 'يرجى تحضير المبلغ نقداً عند قدوم مندوب التوصيل.' : 'Veuillez préparer le montant exact en espèces à la livraison.'}
              </div>
            </div>
          </div>
        `;
      }

      // ========================================================================
      // Dynamic Global Store Phone Helpers
      // ========================================================================
      function normalizePhonePartsClient(rawPhone) {
        let digits = String(rawPhone || '+212600773716').replace(/\D/g, '');
        if (digits.startsWith('00')) digits = digits.slice(2);
        if (digits.startsWith('0') && digits.length === 10) {
          digits = '212' + digits.slice(1);
        }
        if (!digits) digits = '212600773716';
        const e164 = `+${digits}`;
        let display = e164;
        if (digits.startsWith('212') && digits.length === 12) {
          display = `+212 ${digits.slice(3, 6)}-${digits.slice(6)}`;
        }
        return { digits, e164, display };
      }

      function getActiveStorePhoneDigits() {
        return (window.__MODANOVA_STORE_PHONE && window.__MODANOVA_STORE_PHONE.digits) || '212600773716';
      }

      function getActiveStorePhoneDisplay() {
        return (window.__MODANOVA_STORE_PHONE && window.__MODANOVA_STORE_PHONE.display) || '+212 600-773716';
      }

      // ========================================================================
      const CODE128_PATTERNS = [
        '212222','222122','222221','121223','121322','131222','122213','122312','132212','221213',
        '221312','231212','112232','122132','122231','113222','123122','123221','223211','221132',
        '221231','213212','223112','312131','311222','321122','321221','312212','322112','322211',
        '212123','212321','232121','111323','131123','131321','112313','132113','132311','211313',
        '231113','231311','112133','112331','132131','113123','113321','133121','313121','211331',
        '231131','213113','213311','213131','311123','311321','331121','312113','312311','332111',
        '314111','221411','431111','111224','111422','121124','121421','141122','141221','112214',
        '112412','122114','122411','142112','142211','241211','221114','413111','241112','134111',
        '111242','121142','121241','114212','124112','124211','411212','421112','421211','212141',
        '214121','412121','111143','111341','131141','114113','114311','411113','411311','113141',
        '114131','311141','411131','211412','211214','211232','2331112'
      ];

      function generateCode128SVG(rawText, widthPx = 280, heightPx = 54) {
        const cleanText = String(rawText || 'MODANOVA').replace(/[^\x20-\x7E]/g, '-');
        const codes = [104]; // Start Code B
        let checksum = 104;
        for (let i = 0; i < cleanText.length; i++) {
          const val = cleanText.charCodeAt(i) - 32;
          const safeVal = (val >= 0 && val <= 94) ? val : 13;
          codes.push(safeVal);
          checksum += safeVal * (i + 1);
        }
        codes.push(checksum % 103);
        codes.push(106); // Stop

        const bars = codes.map(c => CODE128_PATTERNS[c] || CODE128_PATTERNS[0]).join('');
        let totalUnits = 0;
        for (let i = 0; i < bars.length; i++) totalUnits += Number(bars[i]);

        const quietUnits = 10;
        const viewWidth = totalUnits + quietUnits * 2;
        let x = quietUnits;
        let rects = '';
        for (let i = 0; i < bars.length; i++) {
          const w = Number(bars[i]);
          if (i % 2 === 0) {
            rects += `<rect x="${x}" y="0" width="${w}" height="100" fill="#000"/>`;
          }
          x += w;
        }
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${viewWidth} 100" preserveAspectRatio="none" width="${widthPx}" height="${heightPx}" style="display:block;margin:0 auto;background:#fff;">${rects}</svg>`;
      }

      function getColorCss(rawColor) {
        const c = String(rawColor || '').trim();
        if (!c) return '#171717';
        if (c.includes(':')) {
          const hexPart = c.split(':')[1]?.trim();
          if (hexPart) return hexPart;
        }
        if (c.startsWith('#') || c.startsWith('rgb')) return c;
        const lower = c.toLowerCase();
        const nameToHex = {
          'noir': '#171717',
          'black': '#171717',
          'blanc': '#FFFFFF',
          'white': '#FFFFFF',
          'marron': '#3D2B1F',

      function makeVariantKey(size, color) {
        const s = String(size || 'Unique').trim();
        const c = String(color || 'Default').trim();
        return `${s}__${c}`;
      }

      function hasVariantStockMatrix(product) {
        return Boolean(
          product &&
          product.variantStock &&
          typeof product.variantStock === 'object' &&
          Object.keys(product.variantStock).length > 0
        );
      }

      function getProductVariantStock(product, size, color) {
        if (!product) return 0;
        const effSize = String(size || (product.sizes && product.sizes[0]) || 'Unique').trim();
        const effColor = String(color || (product.colors && product.colors[0]) || 'Default').trim();
        if (hasVariantStockMatrix(product)) {
          const vs = product.variantStock;
          const exactKey = makeVariantKey(effSize, effColor);
          if (vs[exactKey] !== undefined) {
            return Math.max(0, Number(vs[exactKey]) || 0);
          }
          const targetLower = exactKey.toLowerCase();
          for (const [k, v] of Object.entries(vs)) {
            if (String(k).trim().toLowerCase() === targetLower) {
              return Math.max(0, Number(v) || 0);
            }
          }
          const cLabelLower = getColorLabel(effColor, 'fr').toLowerCase();
          for (const [k, v] of Object.entries(vs)) {
            const [ks, kc] = String(k).split('__');
            if (
              ks &&
              kc &&
              ks.trim().toLowerCase() === effSize.toLowerCase() &&
              (kc.trim().toLowerCase() === effColor.toLowerCase() || getColorLabel(kc, 'fr').toLowerCase() === cLabelLower)
            ) {
              return Math.max(0, Number(v) || 0);
            }
          }
          return 0;
        }
        return Math.max(0, Number(product.stock) || 0);
      }

      // Check if a given size has stock across ANY color (or the selected color)
      function getTotalStockForSize(product, size) {
        if (!product) return 0;
        if (!hasVariantStockMatrix(product)) return Math.max(0, Number(product.stock) || 0);
        const colors = Array.isArray(product.colors) && product.colors.length > 0 ? product.colors : ['Default'];
        return colors.reduce((sum, col) => sum + getProductVariantStock(product, size, col), 0);
      }

      // Helper: Parse any product video URL (YouTube, Shorts, Vimeo, TikTok, Google Drive, or direct MP4/WebM)
      function parseVideoEmbedInfo(rawUrl) {
        const url = String(rawUrl || '').trim();
        if (!url) return null;

        // 1. YouTube (watch?v=, youtu.be/, shorts/, live/, embed/)
        const ytMatch = url.match(/(?:youtube\.com\/(?:watch\?.*v=|embed\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/i);
        if (ytMatch && ytMatch[1]) {
          return {
            type: 'iframe',
            provider: 'YouTube',
            embedUrl: `https://www.youtube.com/embed/${ytMatch[1]}?rel=0&modestbranding=1`,
            originalUrl: url
          };
        }

        // 2. Vimeo
        const vimeoMatch = url.match(/vimeo\.com\/(?:video\/)?(\d+)/i);
        if (vimeoMatch && vimeoMatch[1]) {
          return {
            type: 'iframe',
            provider: 'Vimeo',
            embedUrl: `https://player.vimeo.com/video/${vimeoMatch[1]}`,
            originalUrl: url
          };
        }

        // 3. TikTok
        const tiktokMatch = url.match(/tiktok\.com\/.*\/video\/(\d+)/i);
        if (tiktokMatch && tiktokMatch[1]) {
          return {
            type: 'iframe',
            provider: 'TikTok',
            embedUrl: `https://www.tiktok.com/embed/v2/${tiktokMatch[1]}`,
            originalUrl: url
          };
        }

        // 4. Direct video file (.mp4, .webm, .ogg, .mov, or data:video / /uploads/)
        if (/\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(url) || url.startsWith('data:video/')) {
          return {
            type: 'video',
            provider: 'Vidéo HD',
            embedUrl: url,
            originalUrl: url
          };
        }

        // 5. Google Drive video link (/file/d/ID/view -> /file/d/ID/preview)
        const driveMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/i);
        if (driveMatch && driveMatch[1]) {
          return {
            type: 'iframe',
            provider: 'Google Drive',
            embedUrl: `https://drive.google.com/file/d/${driveMatch[1]}/preview`,
            originalUrl: url
          };
        }

        // 6. Generic embed or external link (Instagram Reel, Facebook Watch, etc.)
        if (url.includes('/embed') || url.includes('player.')) {
          return {
            type: 'iframe',
            provider: 'Vidéo',
            embedUrl: url,
            originalUrl: url
          };
        }

        return {
          type: 'external',
          provider: 'Vidéo',
          embedUrl: url,
          originalUrl: url
        };
      }

          const diff = Math.max(0, cutoff - now);
          const hours = Math.floor(diff / (1000 * 60 * 60));
          const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          return { hours, mins };
        });

        const getProductIdentifierFromURL = () => {
          try {
            // 1. Path match: /produit/:slug or /product/:slug
            const pathMatch = window.location.pathname.match(/\/(?:produit|product)\/([^/?#]+)/i);
            if (pathMatch && pathMatch[1]) {
              const slugStr = decodeURIComponent(pathMatch[1]);
              const idMatch = slugStr.match(/-(\d+)$/);
              if (idMatch) return parseInt(idMatch[1], 10);
              if (/^\d+$/.test(slugStr)) return parseInt(slugStr, 10);
              return slugStr;
            }
            // 2. Query param ?produit=slug or ?product=id
            const params = new URLSearchParams(window.location.search);
            const p = params.get('produit') || params.get('product');
            if (p) {
              const idMatch = p.match(/-(\d+)$/);
              if (idMatch) return parseInt(idMatch[1], 10);
              if (/^\d+$/.test(p)) return parseInt(p, 10);
              return p;
            }
            // 3. Hash fallback
            const hashMatch = window.location.hash.match(/(?:produit|product)[-=/]([^/?#]+)/i);
            if (hashMatch && hashMatch[1]) {
              const idMatch = hashMatch[1].match(/-(\d+)$/);
              if (idMatch) return parseInt(idMatch[1], 10);

        // --- Load Products from API or Seed (Admin token receives costPrice; public shoppers never do) ---
        const fetchProducts = useCallback(async () => {

        // --- Keyboard Shortcuts: Ctrl+Shift+A & Escape ---
        useEffect(() => {
          const handleKeyDown = (e) => {
            if (e.key === 'Escape') {

              setCurrentInvoiceOrder(null);

        const computeCouponDiscount = useCallback((couponObj, subtotalVal) => {
          if (!couponObj || subtotalVal <= 0) return 0;
          const minOrder = Number(couponObj.minOrder || 0);
          if (minOrder > 0 && subtotalVal < minOrder) return 0;
          const val = Math.max(0, Number(couponObj.value || 0));
          if (couponObj.type === 'fixed') {
            return Math.min(subtotalVal, Math.round(val));
          }
          return Math.min(subtotalVal, Math.round(subtotalVal * (Math.min(100, val) / 100)));
        }, []);

        const handleApplyPromoCode = useCallback(async (rawCode, customSubtotal = null, silent = false) => {
          const clean = String(rawCode || '').trim().toUpperCase();
          if (!clean) {
            if (!silent) showToast(lang === 'ar' ? 'يرجى إدخال كود الخصم' : 'Veuillez saisir un code promo', 'error');
            return false;
          }
          const sub = customSubtotal !== null ? Number(customSubtotal) : cart.reduce((s, it) => s + Number(it.price) * Number(it.quantity), 0);
          setPromoValidating(true);
          try {
            const res = await fetch('/api/coupons/validate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ code: clean, subtotal: sub })
            });
            const data = await res.json();
            if (res.ok && data.valid) {
              setAppliedPromo(data.code);
              setPromoInput(data.code);
              setAppliedCouponData(data);
              if (!silent) {
                showToast(lang === 'ar' ? data.labelAr : data.labelFr, 'success');
              }
              return true;
            } else {
              if (!silent) {
                showToast((lang === 'ar' ? data.errorAr : data.errorFr) || 'Code promo invalide', 'error');
              } else {
                setAppliedPromo('');
                setAppliedCouponData(null);
              }
              return false;
            }
          } catch {
            if (!silent) showToast('Erreur lors de la vérification du code promo', 'error');
            return false;
          } finally {
            setPromoValidating(false);
          }
        }, [cart, lang]);

        const handleClearPromoCode = useCallback(() => {
          setAppliedPromo('');
          setPromoInput('');
          setAppliedCouponData(null);
        }, []);

        // --- Cart Calculations ---
        const cartTotals = useMemo(() => {
          let subtotal = 0;
          cart.forEach(item => {
            subtotal += Number(item.price) * Number(item.quantity);
          });
          let discount = 0;
          if (appliedCouponData && appliedPromo && appliedCouponData.code === appliedPromo.toUpperCase()) {
            discount = computeCouponDiscount(appliedCouponData, subtotal);
          } else if (appliedPromo.toUpperCase() === 'RAWCRAFT10') {
            discount = Math.round(subtotal * 0.10);
          }
          const shipping = 0;
          const total = Math.max(0, subtotal - discount + shipping);
          const itemCount = cart.reduce((sum, item) => sum + item.quantity, 0);
          return { subtotal, discount, shipping, total, itemCount };
        }, [cart, appliedPromo, appliedCouponData, computeCouponDiscount]);

        // Re-validate saved promo code automatically if present on load without coupon metadata
        useEffect(() => {
          if (appliedPromo && !appliedCouponData && cartTotals.subtotal > 0) {
            handleApplyPromoCode(appliedPromo, cartTotals.subtotal, true);
          }
        }, [appliedPromo, appliedCouponData, cartTotals.subtotal, handleApplyPromoCode]);

        // Pulse cart badge whenever item count changes
        useEffect(() => {
          if (cartTotals.itemCount > 0) {

            return () => clearTimeout(timer);
          }
        }, [cartTotals.itemCount]);

        // --- Cart Actions (Strict Per-Size & Per-Color Stock Validation) ---
        const addToCart = (product, sizeChoice, colorChoice, qty = 1) => {
          const size = sizeChoice || (product.sizes && product.sizes[0]) || 'Unique';
          const color = colorChoice || (product.colors && product.colors[0]) || 'Default';
          const colorLabel = getColorLabel(color, lang);
          const variantStock = getProductVariantStock(product, size, color);

          if (!product.inStock || product.stock <= 0 || variantStock <= 0) {
            showToast(
              lang === 'ar'
                ? `عذراً، المقاس "${size}" باللون "${colorLabel}" غير متوفر في المخزون حالياً.`
                : `Désolé, la taille "${size}" en couleur "${colorLabel}" n'est pas en stock (épuisée).`,
              'error'
            );
            return;
          }

          const lineKey = `${product.id}_${size}_${color}`;
          const existingInCart = cart.find(item => item.lineKey === lineKey);
          const currentInCartQty = existingInCart ? Number(existingInCart.quantity || 0) : 0;

          if (currentInCartQty >= variantStock) {
            showToast(
              lang === 'ar'
                ? `لقد وصلت إلى الحد الأقصى المتوفر (${variantStock}) للمقاس "${size}" باللون "${colorLabel}".`
                : `Quantité maximale atteinte : il n'y a que ${variantStock} exemplaire(s) en stock pour la taille "${size}" en couleur "${colorLabel}".`,
              'warning'
            );
            setCartOpen(true);
            return;
          }

          const allowedNewQty = Math.min(variantStock, currentInCartQty + qty);
          if (currentInCartQty + qty > variantStock) {
            showToast(
              lang === 'ar'
                ? `تمت إضافة الكمية المتوفرة فقط (${variantStock}) للمقاس "${size}" باللون "${colorLabel}".`
                : `Stock limité : quantité ajustée à ${variantStock} (maximum disponible pour la taille "${size}" en couleur "${colorLabel}").`,
              'warning'
            );
          } else {
            showToast(t.toast_added, 'success');
          }

          // Trigger pulse and bounce tracking
          setLastAddedLineKey(lineKey);
          setBadgePulsing(true);
          setTimeout(() => setBadgePulsing(false), 700);

          setCart(prev => {
            const existing = prev.find(item => item.lineKey === lineKey);
            if (existing) {
              return prev.map(item =>
                item.lineKey === lineKey
                  ? { ...item, quantity: allowedNewQty, stock: variantStock }
                  : item
              );
            } else {
              return [
                ...prev,
                {
                  lineKey,
                  productId: product.id,
                  nameFr: product.nameFr,
                  nameAr: product.nameAr,
                  price: product.price,
                  stock: variantStock,
                  size,
                  color,
                  quantity: allowedNewQty,
                  image: (product.images && product.images[0]) || ''
                }
              ];
            }
          });

          setCartOpen(true);
        };

        const updateCartQty = (lineKey, newQty) => {
          setCart(prev => {
            return prev.map(item => {
              if (item.lineKey === lineKey) {
                const liveProd = products.find(p => Number(p.id) === Number(item.productId));
                const maxAvail = liveProd
                  ? getProductVariantStock(liveProd, item.size, item.color)

                if (newQty > maxAvail) {
                  showToast(
                    lang === 'ar'

                      : `Seulement ${maxAvail} disponible(s) en stock pour la taille "${item.size}" en couleur "${getColorLabel(item.color, lang)}".`,
                    'warning'
                  );
                }
                const clamped = Math.max(1, Math.min(Math.max(1, maxAvail), newQty));
                return { ...item, quantity: clamped, stock: maxAvail };
              }
              return item;

          });
        };

        const removeFromCart = (lineKey) => {

        // --- Wishlist Toggle ---

        // Available Sizes & Colors across all products for the Dedicated Products Filter Page
        const availableFilterSizes = useMemo(() => {

        const availableFilterColors = useMemo(() => {

        const resetAllCatalogFilters = useCallback(() => {

        }, []);

        // --- Filtered and Sorted Products (Home Page shows only showOnHome !== false; /produits page shows all with filters) ---
        const filteredProducts = useMemo(() => {
          const list = products.filter(p => {
            if (!p) return false;
            // On the Home Page (Index), only show products selected by Admin for the Home Page
            if (!isProductsPage && p.showOnHome === false) return false;
            // Category
            if (selectedCategory !== 'all' && String(p.category || '').trim().toLowerCase() !== String(selectedCategory).trim().toLowerCase()) return false;
            // Size / Pointure filter
            if (selectedSizeFilter !== 'all') {
              const pSizes = Array.isArray(p.sizes) ? p.sizes.map(s => String(s || '').trim().toLowerCase()) : [];
              if (!pSizes.includes(String(selectedSizeFilter).trim().toLowerCase())) return false;
              if (onlyInStock && !isSizeAvailableInAnyColor(p, selectedSizeFilter)) return false;
            }
            // Color filter
            if (selectedColorFilter !== 'all') {
              const pColors = Array.isArray(p.colors) ? p.colors.map(c => getColorLabel(c, 'fr').toLowerCase()) : [];
              if (!pColors.includes(String(selectedColorFilter).trim().toLowerCase())) return false;
            }
            // Price range filter
            const priceNum = Number(p.price || 0);
            if (priceRangeFilter === 'under300' && priceNum >= 300) return false;
            if (priceRangeFilter === '300to500' && (priceNum < 300 || priceNum > 500)) return false;
            if (priceRangeFilter === 'over500' && priceNum <= 500) return false;
            // Stock only
            if (onlyInStock && (!p.inStock || p.stock <= 0)) return false;
            // Video only
            if (onlyWithVideo && !String(p.videoUrl || '').trim()) return false;
            // Search Query
            if (searchQuery.trim()) {
              const q = searchQuery.toLowerCase().trim();
              const matchFr = (p.nameFr || '').toLowerCase().includes(q) || (p.descFr || '').toLowerCase().includes(q) || (p.category || '').toLowerCase().includes(q);
              const matchAr = (p.nameAr || '').toLowerCase().includes(q) || (p.descAr || '').toLowerCase().includes(q);
              if (!matchFr && !matchAr) return false;
            }
            return true;
          });
          if (sortOrder === 'asc') return [...list].sort((a, b) => Number(a.price || 0) - Number(b.price || 0));
          if (sortOrder === 'desc') return [...list].sort((a, b) => Number(b.price || 0) - Number(a.price || 0));
          return list;
        }, [products, isProductsPage, selectedCategory, selectedSizeFilter, selectedColorFilter, priceRangeFilter, onlyInStock, onlyWithVideo, searchQuery, sortOrder]);

        const totalCatalogPages = Math.max(1, Math.ceil(filteredProducts.length / CATALOG_PER_PAGE));
        const safeCatalogPage = Math.min(Math.max(1, catalogPage), totalCatalogPages);
        const startCatalogIdx = (safeCatalogPage - 1) * CATALOG_PER_PAGE;
        const paginatedCatalogProducts = filteredProducts.slice(startCatalogIdx, startCatalogIdx + CATALOG_PER_PAGE);

        // --- Admin KPI Stats & Profitability Calculator ---
        const adminKPIs = useMemo(() => {
          const safeOrders = Array.isArray(orders) ? orders : [];
          const safeProducts = Array.isArray(products) ? products : [];
          const validOrders = safeOrders.filter(o => o && o.status !== 'Annulée');
          const revenue = validOrders.reduce((sum, o) => sum + Number(o?.total || 0), 0);
          const totalOrders = safeOrders.length;
          const avgOrderValue = validOrders.length > 0 ? Math.round(revenue / validOrders.length) : 0;
          const activeProducts = safeProducts.filter(p => p && (p.stock || 0) > 0).length;
          const outOfStockCount = safeProducts.filter(p => !p || !p.inStock || p.stock === 0).length;

          const productCostMap = new Map();
          const productStatsMap = new Map();
          safeProducts.forEach(p => {
            if (!p) return;
            const unitCost = Math.max(0, Number(p.costPrice || 0));
            productCostMap.set(Number(p.id), unitCost);
            productStatsMap.set(Number(p.id), {
              id: p.id,
              nameFr: p.nameFr,
              price: Number(p.price || 0),
              costPrice: unitCost,
              qtySold: 0,
              revenue: 0,
              totalCost: 0,
              grossProfit: 0
            });
          });

          const normCityKey = (c) => String(c || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
          const normalizedCityMap = new Map();
          Object.entries(profitabilitySettings?.cityShippingCosts || {}).forEach(([k, v]) => {
            normalizedCityMap.set(normCityKey(k), Math.max(0, Number(v) || 0));
          });
          const fallbackShipCost = Math.max(0, Number(profitabilitySettings?.defaultShippingCost ?? 35) || 35);

          const lookupCityCost = (city) => {
            const nk = normCityKey(city);
            if (nk && normalizedCityMap.has(nk)) return normalizedCityMap.get(nk);
            return fallbackShipCost;
          };

          let totalProductCost = 0;
          let totalShippingCost = 0;
          const orderProfitMap = {};

          safeOrders.forEach(o => {
            if (!o) return;
            const isCancelled = o.status === 'Annulée';
            const ordRev = Number(o.total || 0);
            let ordProdCost = 0;
            (Array.isArray(o.items) ? o.items : []).forEach(it => {
              const pid = Number(it.productId || it.id || 0);
              const qty = Math.max(1, Number(it.quantity || it.qty || 1));
              const unitCost = productCostMap.has(pid) ? productCostMap.get(pid) : 0;
              ordProdCost += unitCost * qty;
              if (!isCancelled && productStatsMap.has(pid)) {
                const stat = productStatsMap.get(pid);
                const lineRev = Number(it.price || stat.price || 0) * qty;
                stat.qtySold += qty;
                stat.revenue += lineRev;
                stat.totalCost += unitCost * qty;
                stat.grossProfit = stat.revenue - stat.totalCost;
              }
            });
            const ordShipCost = o.realShippingCost !== undefined && o.realShippingCost !== null
              ? Math.max(0, Number(o.realShippingCost) || 0)
              : lookupCityCost(o.city);
            const ordNet = isCancelled ? 0 : (ordRev - ordProdCost - ordShipCost);
            const ordMargin = ordRev > 0 && !isCancelled ? Math.round((ordNet / ordRev) * 1000) / 10 : 0;
            orderProfitMap[o.id] = {
              revenue: ordRev,
              productCost: ordProdCost,
              shippingCost: isCancelled ? 0 : ordShipCost,
              netProfit: ordNet,
              marginPct: ordMargin
            };
            if (!isCancelled) {
              totalProductCost += ordProdCost;
              totalShippingCost += ordShipCost;
            }
          });

          const netProfit = revenue - totalProductCost - totalShippingCost;
          const marginPercent = revenue > 0 ? Math.round((netProfit / revenue) * 1000) / 10 : 0;

          return {
            revenue,
            totalSales: revenue,
            totalOrders,
            orderCount: totalOrders,
            validOrderCount: validOrders.length,
            avgOrderValue,
            avgBasket: avgOrderValue,
            activeProducts,
            outOfStockCount,
            totalProductCost,
            totalShippingCost,
            netProfit,
            marginPercent,
            orderProfitMap,
            productProfitList: Array.from(productStatsMap.values())
          };
        }, [orders, products, profitabilitySettings]);

        // --- Admin Login Action ---
        const handleAdminLogin = async (e) => {
          e.preventDefault();
          setAdminLoginError('');
          try {
            const res = await fetch('/api/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ user: adminUser, pass: adminPass })
            });
            const data = await res.json();
            if (res.ok && data.token) {
              setAdminToken(data.token);
              sessionStorage.setItem('modanova_admin_token', data.token);
              showToast('Connexion réussie', 'success');
              fetchAdminOrders();
            } else {
              setAdminLoginError(data.error || 'Identifiants invalides');
            }
          } catch {
            setAdminLoginError('Erreur de connexion au serveur');
          }
        };

        const handleAdminLogout = () => {
          setAdminToken('');
          sessionStorage.removeItem('modanova_admin_token');
          sessionStorage.removeItem('ettore_admin_token');
          setAdminUser('');
          setAdminPass('');
          showToast('Déconnexion effectuée', 'info');
        };

        return (
          <div className="min-h-screen flex flex-col bg-canvas text-noir w-full max-w-full overflow-x-hidden relative">
            {/* Top Luxury Announcement Ticker */}
            <div className="bg-[#141210] text-[#EFECE6] py-1.5 border-b border-caramel/30 overflow-hidden text-[11px] tracking-wider font-medium select-none shadow-xs">
              <div className="animate-marquee whitespace-nowrap flex items-center gap-8">
                <span className="flex items-center gap-2"><span className="text-caramel">✦</span> <span>LIVRAISON GRATUITE SUR TOUT LE MAROC</span></span>
                <span className="text-caramel/60">•</span>
                <span className="flex items-center gap-2"><span className="text-caramel">✦</span> <span>PAIEMENT À LA LIVRAISON (COD)</span></span>
                <span className="text-caramel/60">•</span>
                <span className="flex items-center gap-2"><span className="text-caramel">✦</span> <span>ESSAYEZ AVANT D'ACHETER</span></span>
                <span className="text-caramel/60">•</span>
                <span className="flex items-center gap-2"><WhatsAppIcon className="w-3.5 h-3.5 fill-[#25D366] shrink-0" /> <span className="text-white font-semibold">SUPPORT WHATSAPP : {storeConfig.storePhoneDisplay}</span></span>
                <span className="text-caramel/60">•</span>
                <span className="flex items-center gap-2"><span className="text-caramel">✦</span> <span>NOUVELLE COLLECTION HOMME 2026</span></span>

                    {/* Filter by Price Range */}

                      <select

                      const stepCardImage = (e, dir) => {
                        if (e && e.stopPropagation) e.stopPropagation();
                        if (imagesArr.length <= 1) return;
                        setCardImageIdxMap(prev => {
                          const cur = prev[product.id] || 0;
                          const next = (cur + dir + imagesArr.length) % imagesArr.length;
                          return { ...prev, [product.id]: next };
                        });

                          <div
                            onClick={() => navigateToProduct(product.id)}
                            onTouchStart={(e) => {
                              if (e.touches && e.touches[0]) {
                                cardTouchStartX.current[product.id] = e.touches[0].clientX;
                              }
                            }}
                            onTouchEnd={(e) => {
                              const startX = cardTouchStartX.current[product.id];
                              if (startX == null || !e.changedTouches || !e.changedTouches[0]) return;
                              const deltaX = e.changedTouches[0].clientX - startX;
                              cardTouchStartX.current[product.id] = null;
                              if (Math.abs(deltaX) > 35 && imagesArr.length > 1) {
                                e.stopPropagation();
                                stepCardImage(null, deltaX > 0 ? -1 : 1);
                              }
                            }}

                              alt={title}
                              referrerPolicy="no-referrer"
                              className="w-full h-full object-contain transition-transform duration-500 group-hover:scale-105"
                            />

                            {/* Left & Right Slider Arrows on Product Card when multiple photos */}
                            {imagesArr.length > 1 && (
                              <>
                                <button
                                  type="button"
                                  onClick={(e) => stepCardImage(e, -1)}

                                  title="Photo précédente"
                                  aria-label="Photo précédente"
                                >
                                  <svg className="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M15 19l-7-7 7-7" />
                                  </svg>
                                </button>
                                <button
                                  type="button"
                                  onClick={(e) => stepCardImage(e, 1)}
                                  className="absolute end-1 sm:end-2 top-1/2 -translate-y-1/2 z-20 w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-white/90 hover:bg-noir text-noir hover:text-white border border-taupe/30 shadow-sm flex items-center justify-center transition-all duration-200 hover:scale-110 active:scale-95"
                                  title="Photo suivante"
                                  aria-label="Photo suivante"
                                >
                                  <svg className="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M9 5l7 7-7 7" />
                                  </svg>
                                </button>
                              </>
                            )}

                            {/* Top Badges */}
                            <div className="absolute top-1.5 start-1.5 sm:top-3 sm:start-3 flex flex-col gap-1 z-10 pointer-events-none">
                              {isOut ? (
                                <span className="bg-noir/90 text-white text-[9px] sm:text-[10px] font-bold px-1.5 sm:px-2 py-0.5 uppercase tracking-wider">
                                  {t.badge_out}
                                </span>
                              ) : product.badge === 'exclusive' ? (
                                <span className="bg-caramel text-white text-[9px] sm:text-[10px] font-bold px-1.5 sm:px-2 py-0.5 uppercase tracking-wider">
                                  {t.badge_exclusive}
                                </span>
                              ) : product.badge === 'luxury' ? (
                                <span className="bg-[#4A3525] text-white text-[9px] sm:text-[10px] font-bold px-1.5 sm:px-2 py-0.5 uppercase tracking-wider">
                                  {t.badge_luxury}
                                </span>
                              ) : product.isNew ? (
                                <span className="bg-noir text-white text-[9px] sm:text-[10px] font-bold px-1.5 sm:px-2 py-0.5 uppercase tracking-wider">
                                  {t.badge_new}
                                </span>
                              ) : null}
                              {hasVideo && (
                                <span className="bg-noir/85 text-[#E6C687] text-[9px] sm:text-[10px] font-bold px-1.5 sm:px-2 py-0.5 uppercase tracking-wider flex items-center gap-1">
                                  <span>▶</span>
                                  <span>{lang === 'ar' ? 'فيديو' : 'Vidéo'}</span>
                                </span>
                              )}
                            </div>

                            {/* Interactive Dots & Photos Counter Indicator */}
                            {imagesArr.length > 1 && (
                              <div
                                onClick={(e) => e.stopPropagation()}
                                className="absolute bottom-1.5 inset-x-1.5 sm:bottom-3 sm:inset-x-3 flex items-center justify-between z-10 pointer-events-auto"
                              >
                                <div className="flex items-center gap-1 bg-black/55 px-1.5 py-0.5 sm:px-2 sm:py-1 rounded-xs backdrop-blur-xs">
                                  {imagesArr.map((_, dIdx) => (
                                    <button
                                      key={dIdx}
                                      type="button"
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        setCardImageIdxMap(prev => ({ ...prev, [product.id]: dIdx }));
                                      }}
                                      className={`h-1 sm:h-1.5 rounded-full transition-all ${
                                        activeCardImgIdx === dIdx ? 'w-2.5 sm:w-3.5 bg-caramel' : 'w-1 sm:w-1.5 bg-white/60 hover:bg-white'
                                      }`}
                                      aria-label={`Photo ${dIdx + 1}`}
                                    />
                                  ))}
                                </div>
                                <span className="bg-black/65 text-white text-[9px] sm:text-[10px] px-1.5 py-0.5 backdrop-blur-xs font-mono tabular-nums rounded-xs">
                                  {activeCardImgIdx + 1}/{imagesArr.length}
                                </span>
                              </div>

                            <div className="absolute top-1.5 end-1.5 sm:top-3 sm:end-3 flex items-center gap-1 sm:gap-1.5 z-10">

                                type="button"
                                onClick={(e) => {
                                  e.stopPropagation();
                                  const url = `${window.location.origin}/produit/${getProductSlug(product)}`;

                                    navigator.clipboard.writeText(url);
                                    showToast(t.product_link_copied, 'success');
                                  } catch {
                                    showToast(url, 'info');
                                  }

                                className="w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-white/85 hover:bg-white flex items-center justify-center transition-all duration-200 shadow-xs hover:scale-110 active:scale-90 text-noir/70 hover:text-caramel"
                                title="Copier le lien direct client"
                                aria-label="Copier le lien client"
                              >
                                <svg className="w-3 h-3 sm:w-3.5 sm:h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />

                                <svg
                                  className={`w-3.5 h-3.5 sm:w-4 sm:h-4 transition-colors ${isWish ? 'fill-caramel text-caramel animate-heart-pop' : 'text-noir/60 hover:text-noir'}`}
                                  viewBox="0 0 24 24"
                                  stroke="currentColor"
                                  strokeWidth="1.75"
                                >
                                  <path strokeLinecap="round" strokeLinejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                                </svg>
                              </button>
                            </div>
                          </div>

                          {/* Product Info — Responsive for 2-Column Mobile Grid */}
                          <div className="p-2.5 sm:p-6 flex flex-col flex-1">

                              <span className="truncate">{product.category}</span>
                              <span className="text-caramel font-semibold shrink-0">★ {product.rating || 5}.0</span>
                            </div>

                            {/* Title */}
                            <h3
                              onClick={() => navigateToProduct(product.id)}
                              className="font-serif text-sm sm:text-xl font-semibold text-noir mb-1 sm:mb-2 group-hover:text-caramel transition-colors cursor-pointer line-clamp-1 sm:line-clamp-2 leading-snug"
                            >
                              {title}
                            </h3>

                            {/* Description (Strictly capped at 25 characters max on Home & All-Products pages) */}
                            {desc && (
                              <p className="text-[11px] sm:text-xs text-taupe-dark leading-snug mb-2 sm:mb-4 truncate" title={rawDesc}>
                                {desc}
                              </p>
                            )}

                            {/* Stock Warning if low */}
                            {isLow && (
                              <p className="text-[9px] sm:text-[11px] font-semibold text-[#B91C1C] mb-1.5 sm:mb-3 flex items-center">
                                <span className="animate-flame me-1 inline-block">🔥</span>
                                <span className="truncate">{t.low_stock_alert.replace('🔥 ', '').replace('{n}', product.stock)}</span>
                              </p>
                            )}

                            {/* Price & Old Price */}
                            <div className="flex flex-wrap items-baseline gap-1.5 sm:gap-2.5 mb-2.5 sm:mb-5 pt-1.5 sm:pt-2 border-t border-taupe/15 mt-auto">
                              <span className="font-semibold text-xs sm:text-lg text-noir tabular-nums">
                                {Number(product.price).toLocaleString()} MAD
                              </span>
                              {product.oldPrice && (
                                <span className="text-[10px] sm:text-xs text-taupe line-through tabular-nums">
                                  {Number(product.oldPrice).toLocaleString()} MAD
                                </span>
                              )}
                            </div>

                            {/* Action Buttons: View Product Page & Add to Cart */}
                            <div className="grid grid-cols-2 gap-1.5 sm:gap-2">
                              <button
                                type="button"
                                onClick={() => navigateToProduct(product.id)}
                                className="px-1.5 py-2 sm:px-3 sm:py-2.5 border border-taupe/30 text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-noir hover:border-noir hover:bg-noir hover:text-white transition-all flex items-center justify-center gap-1 whitespace-nowrap"
                                title="Ouvrir la page dédiée avec lien direct"
                              >
                                <span>{t.admin_view_product || "Voir"}</span>
                                <span className="hidden sm:inline text-[10px]">→</span>
                              </button>
                              <button
                                type="button"
                                disabled={isOut}
                                onClick={() => addToCart(product)}
                                className={`px-1.5 py-2 sm:px-3 sm:py-2.5 text-[10px] sm:text-xs font-semibold uppercase tracking-wider transition-all duration-150 truncate ${
                                  isOut
                                    ? 'bg-taupe/20 text-taupe-dark cursor-not-allowed'
                                    : 'bg-noir text-white hover:bg-caramel active:scale-95 shadow-xs'
                                }`}
                              >
                                {isOut ? t.out_of_stock : t.add_to_cart}
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* Storefront Catalog Pagination Bar (10 products per page: 1-10, 11-20, etc.) */}
                  {filteredProducts.length > 0 && (
                    <div className="mt-10 pt-6 border-t border-taupe/20 flex flex-col sm:flex-row items-center justify-between gap-4">
                      <div className="text-xs text-taupe-dark">
                        Affichage des produits <span className="font-bold text-noir">{startCatalogIdx + 1}</span> à{' '}
                        <span className="font-bold text-noir">{Math.min(startCatalogIdx + CATALOG_PER_PAGE, filteredProducts.length)}</span> sur{' '}
                        <span className="font-bold text-noir">{filteredProducts.length}</span> (Page {safeCatalogPage} sur {totalCatalogPages})
                      </div>
                      <div className="flex items-center gap-1.5 flex-wrap justify-center">
                        <button
                          type="button"
                          onClick={() => {
                            setCatalogPage(Math.max(1, safeCatalogPage - 1));
                            const el = document.getElementById('collection');
                            if (el) el.scrollIntoView({ behavior: 'smooth' });
                          }}
                          disabled={safeCatalogPage <= 1}
                          className={`px-3.5 py-2 text-xs font-semibold rounded-xs border transition-colors ${
                            safeCatalogPage <= 1
                              ? 'bg-canvas text-taupe border-taupe/20 cursor-not-allowed opacity-60'
                              : 'bg-card text-noir border-taupe/30 hover:border-noir'
                          }`}
                        >
                          ← Précédent
                        </button>

                        {Array.from({ length: totalCatalogPages }, (_, i) => i + 1).map(pNum => (
                          <button
                            key={pNum}
                            type="button"
                            onClick={() => {
                              setCatalogPage(pNum);
                              const el = document.getElementById('collection');
                              if (el) el.scrollIntoView({ behavior: 'smooth' });
                            }}
                            className={`w-9 h-9 text-xs font-bold rounded-xs border transition-colors tabular-nums ${

                                        : 'border-2 border-caramel bg-white text-noir shadow-xs'
                                      : isOutVar
                                      ? 'border-taupe/25 text-taupe opacity-70 line-through'
                                      : 'border-taupe/30 bg-white text-noir hover:border-noir'
                                  }`}
                                  title={`${cLabel} : ${st} en stock`}
                                >
                                  <span
                                    className="w-3.5 h-3.5 rounded-full border border-black/25 shrink-0"

                                  <span>{cLabel}</span>
                                </button>
                              );
                            })}
                          </div>
                        </div>

                              ⚠️ {lang === 'ar'
                                ? `المقاس "${quickViewSize}" باللون "${qvColorName}" غير متوفر في المخزون.`
                                : `La taille "${quickViewSize}" en couleur "${qvColorName}" n'est pas en stock (épuisée).`}
                            </div>
                          );

                        if (qvStock <= 5) {
                          return (
                            <div className="text-xs font-semibold text-[#B91C1C] mb-4">
                              🔥 {lang === 'ar'
                                ? `بقي فقط ${qvStock} في المخزون للمقاس ${quickViewSize} (${qvColorName})!`

                            addToCart(quickViewProduct, quickViewSize, quickViewColor);
                            setQuickViewProduct(null);

                          className={`w-full py-3.5 text-xs font-semibold uppercase tracking-wider transition-all duration-150 ${
                            isQvOut
                              ? 'bg-red-100 text-[#991B1B] border border-red-300 cursor-not-allowed'
                              : 'bg-noir text-white hover:bg-caramel active:scale-95 shadow-xs'
                          }`}
                        >
                          {isQvOut
                            ? (lang === 'ar'
                                ? `غير متوفر (${quickViewSize} - ${qvColorName})`
                                : `Cette taille (${quickViewSize}) en ${qvColorName} n'est pas en stock`)
                            : t.add_to_cart}
                        </button>
                      );
                    })()}

                    <button
                      type="button"
                      onClick={() => {
                        const pid = quickViewProduct.id;
                        setQuickViewProduct(null);

                      className="w-full mt-2.5 py-2 text-center text-xs text-caramel hover:text-noir font-semibold uppercase tracking-wider transition-colors flex items-center justify-center gap-1.5"
                    >
                      <span>🔗 {lang === 'ar' ? 'فتح صفحة المنتج المخصصة ورابط المشاركة ↗' : 'Ouvrir la page dédiée & lien direct ↗'}</span>
                    </button>
                  </div>
                </div>
              </div>

              const directSub = directCheckoutItem ? Number(directCheckoutItem.price) * Number(directCheckoutItem.quantity) : 0;
              const directDisc = directCheckoutItem
                ? (appliedCouponData && appliedPromo && appliedCouponData.code === appliedPromo.toUpperCase()
                    ? computeCouponDiscount(appliedCouponData, directSub)
                    : (appliedPromo.toUpperCase() === 'RAWCRAFT10' ? Math.round(directSub * 0.10) : 0))
                : 0;
              return (
              <CheckoutModal
                cart={directCheckoutItem ? [directCheckoutItem] : cart}
                totals={
                  directCheckoutItem
                    ? {
                        subtotal: directSub,
                        discount: directDisc,
                        shipping: 0,
                        total: Math.max(0, directSub - directDisc),
                        itemCount: directCheckoutItem.quantity
                      }
                    : cartTotals
                }
                promoCode={appliedPromo}
                appliedCouponData={appliedCouponData}
                onApplyPromo={handleApplyPromoCode}
                onClearPromo={handleClearPromoCode}
                promoValidating={promoValidating}
                lang={lang}
                t={t}
                onClose={() => {
                  setCheckoutOpen(false);
                  setDirectCheckoutItem(null);

                onSuccess={(createdOrder) => {

                    setDirectCheckoutItem(null);

                    setCart([]);

                  setCheckoutOpen(false);
                  setCurrentInvoiceOrder(createdOrder);

                onError={(msg) => showToast(msg || t.toast_order_error, 'error')}
              />

              <TrackingModal
                lang={lang}
                t={t}
                onClose={() => setTrackingOpen(false)}
                onViewInvoice={(order) => {
                  setTrackingOpen(false);
                  setCurrentInvoiceOrder(order);
                }}
              />

            {/* ================================================================ */}

              <AdminModal
                token={adminToken}
                adminUser={adminUser}
                setAdminUser={setAdminUser}
                adminPass={adminPass}
                setAdminPass={setAdminPass}
                loginError={adminLoginError}
                onLogin={handleAdminLogin}
                onLogout={handleAdminLogout}
                onUpdateAdminAuth={(newToken, newUser) => {
                  if (newToken) {
                    setAdminToken(newToken);
                    sessionStorage.setItem('modanova_admin_token', newToken);
                  }
                  if (newUser) {
                    setAdminUser(newUser);
                  }
                }}
                kpis={adminKPIs}
                activeTab={adminActiveTab}
                setActiveTab={setAdminActiveTab}
                products={products}
                orders={orders}
                lang={lang}
                t={t}
                onClose={handleCloseAdmin}
                onRefreshOrders={fetchAdminOrders}

                  const cleanId = String(deletedId || '').trim().toUpperCase();
                  setOrders(prev => (prev || []).filter(o => String(o?.id || '').trim().toUpperCase() !== cleanId));

                onRefreshProducts={fetchProducts}

                  if (Array.isArray(reorderedList)) {
                    setProducts(reorderedList);

                  const numId = Number(deletedId);
                  setProducts(prev => (prev || []).filter(p => Number(p?.id) !== numId));

                onCopyProductLink={(prodId) => {
                  const prod = products.find(p => p.id === prodId);
                  const slug = prod ? getProductSlug(prod) : `produit-${prodId}`;
                  const url = `${window.location.origin}/produit/${slug}`;
                  try {
                    navigator.clipboard.writeText(url);
                    showToast(t.product_link_copied, 'success');
                  } catch {
                    showToast(url, 'info');
                  }
                }}
                cms={cms}
                onSaveCms={(updatedCms) => {
                  setCms(updatedCms);
                  if (updatedCms && (updatedCms.whatsappNumber || updatedCms.supportPhone)) {
                    applyStorePhoneLocal(updatedCms.whatsappNumber || updatedCms.supportPhone);
                  }
                }}
                testimonials={testimonials}
                onRefreshTestimonials={fetchTestimonials}
                storePhone={storeConfig.storePhone}
                storePhoneDisplay={storeConfig.storePhoneDisplay}
                onUpdateStorePhone={applyStorePhoneLocal}
                profitabilitySettings={profitabilitySettings}
                onUpdateProfitabilitySettings={setProfitabilitySettings}
                onOrderUpdated={(updatedOrd) => {
                  if (updatedOrd && updatedOrd.id) {
                    setOrders(prev => (prev || []).map(o =>
                      String(o?.id || '').trim().toUpperCase() === String(updatedOrd.id).trim().toUpperCase() ? updatedOrd : o
                    ));
                  }
                }}
              />
            )}

            {/* ================================================================ */}
            {/* 16. ADMIN PRODUCT FORM MODAL (Add/Edit) */}
            {/* ================================================================ */}
            {productFormModal && (
              <ProductFormModal
                initialData={productFormModal}
                token={adminToken}
                lang={lang}
                t={t}
                onClose={() => setProductFormModal(null)}
                onSaved={(savedProduct) => {
                  const wasNew = !productFormModal.id;
                  setProductFormModal(null);
                  if (savedProduct && savedProduct.id) {
                    setProducts(prev => {
                      const existingIdx = (prev || []).findIndex(p => Number(p.id) === Number(savedProduct.id));
                      if (existingIdx >= 0 && !wasNew) {
                        const copy = [...prev];
                        copy[existingIdx] = savedProduct;
                        return copy;
                      }
                      // New product goes directly to 1st position (#1)
                      return [savedProduct, ...(prev || []).filter(p => Number(p.id) !== Number(savedProduct.id))];
                    });
                  }
                  setCatalogPage(1);
                  fetchProducts();
                  showToast(t.toast_product_saved, 'success');
                }}
                onError={(err) => showToast(err || 'Erreur enregistrement', 'error')}
              />
            )}

            {/* ================================================================ */}
            {/* 17. INVOICE MODAL (Rendered Above All Modals including Admin)    */}
            {/* ================================================================ */}
            {currentInvoiceOrder && (
              <div className="fixed inset-0 z-[120] flex items-center justify-center p-3 sm:p-4">
                <div
                  className="fixed inset-0 bg-black/75 backdrop-blur-xs"
                  onClick={() => setCurrentInvoiceOrder(null)}
                />
                <div className="relative bg-white w-full max-w-3xl max-h-[92vh] overflow-hidden z-10 shadow-2xl flex flex-col border border-taupe/30 animate-modal-pop">
                  {/* Modal Action Bar */}
                  <div className="p-3 sm:p-4 bg-noir text-white flex flex-wrap items-center justify-between gap-2">
                    <span className="font-serif text-base sm:text-lg font-bold">
                      {t.invoice_modal_title} — <span className="text-[#E6C687]">{currentInvoiceOrder.id}</span>
                    </span>
                    <div className="flex flex-wrap items-center gap-2">
                      <button
                        type="button"
                        onClick={() => printInvoice(currentInvoiceOrder, lang)}
                        className="px-3 py-1.5 bg-caramel text-white text-xs font-semibold rounded-xs hover:bg-caramel/90 transition-colors flex items-center gap-1"
                      >
                        <span>🖨️</span>
                        <span>{t.print_invoice_btn || 'Imprimer'}</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => downloadInvoice(currentInvoiceOrder, lang)}
                        className="px-3 py-1.5 bg-white/15 hover:bg-white/25 text-white text-xs font-semibold rounded-xs transition-colors flex items-center gap-1"
                        title="Télécharger la facture"
                      >
                        <span>⬇️</span>
                        <span>Télécharger</span>
                      </button>
                      <a
                        href={adminOpen ? buildAdminCustomerWhatsAppLink(currentInvoiceOrder, lang) : (currentInvoiceOrder._adminWhatsappUrl || buildWhatsAppLink(currentInvoiceOrder, lang))}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="px-3 py-1.5 bg-[#25D366] hover:bg-[#20ba5a] text-white text-xs font-semibold rounded-xs transition-colors flex items-center gap-1.5 shadow-2xs"
                      >
                        <WhatsAppIcon className="w-3.5 h-3.5 fill-white shrink-0" />
                        <span>{adminOpen ? 'WhatsApp Client' : t.whatsapp_confirm_btn}</span>
                      </a>
                      <button
                        type="button"
                        onClick={() => setCurrentInvoiceOrder(null)}
                        className="text-white/70 hover:text-white text-lg px-2 py-0.5"
                        aria-label="Fermer"
                      >
                        ✕
                      </button>
                    </div>
                  </div>

                  {/* Automatic WhatsApp Notification Status Banner for Customer / Admin */}
                  {!adminOpen && (
                    <div className="bg-[#ECFDF5] border-b border-[#A7F3D0] px-4 py-2.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs text-[#065F46]">
                      <div className="flex items-center gap-2">

                      <a
