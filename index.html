      function CheckoutModal({ cart, totals, promoCode, appliedCouponData, onApplyPromo, onClearPromo, promoValidating, lang, t, onClose, onSuccess, onError }) {
        const [customerName, setCustomerName] = useState('');
        const [customerPhone, setCustomerPhone] = useState('');
        const [city, setCity] = useState(MOROCCAN_CITIES[0].id);
        const [address, setAddress] = useState('');
        const [notes, setNotes] = useState('');
        const [checkoutPromoInput, setCheckoutPromoInput] = useState(promoCode || '');
        const [submitting, setSubmitting] = useState(false);

        // Phone Validation (/^(06|07)\d{8}$/)
        const phoneClean = customerPhone.trim().replace(/\s+/g, '');
        const isPhoneValid = /^(06|07)\d{8}$/.test(phoneClean);
        const isFormValid = customerName.trim().length >= 3 && isPhoneValid && address.trim().length >= 5;

        const selectedCityObj = MOROCCAN_CITIES.find(c => c.id === city) || MOROCCAN_CITIES[0];

        const handleSubmit = async (e) => {
          e.preventDefault();
          if (!isFormValid || submitting) return;

          setSubmitting(true);
          try {
            const payload = {
              customerName: customerName.trim(),
              customerPhone: phoneClean,
              city: selectedCityObj.nameFr,
              address: address.trim(),
              notes: notes.trim(),
              promoCode: promoCode || null,
              items: cart.map(item => ({
                productId: item.productId,
                quantity: item.quantity,
                size: item.size,
                color: item.color
              }))
            };

            const res = await fetch('/api/orders', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (res.ok && data.order) {
              const enrichedOrder = {
                ...data.order,
                _adminWhatsappUrl: data.adminWhatsappUrl || buildWhatsAppLink(data.order, lang),
                _sentViaApi: Boolean(data.sentViaApi),
                _autoRedirectCustomerToWhatsapp: data.autoRedirectCustomerToWhatsapp !== false
              };
              // If autoRedirectCustomerToWhatsapp is active and background API wasn't configured yet,
              // automatically trigger the WhatsApp notification link so the admin receives it immediately
              if (enrichedOrder._autoRedirectCustomerToWhatsapp && !enrichedOrder._sentViaApi && enrichedOrder._adminWhatsappUrl) {
                try {
                  const waAnchor = document.createElement('a');
                  waAnchor.href = enrichedOrder._adminWhatsappUrl;
                  waAnchor.target = '_blank';
                  waAnchor.rel = 'noopener noreferrer';
                  document.body.appendChild(waAnchor);
                  waAnchor.click();
                  document.body.removeChild(waAnchor);
                } catch {}
              }
              onSuccess(enrichedOrder);
            } else {
              onError(data.error || 'Erreur lors de la commande');
            }
          } catch (err) {
            onError('Impossible de contacter le serveur.');
          } finally {
            setSubmitting(false);
          }
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto overflow-x-hidden">
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs" onClick={onClose} />
            <div className="relative bg-canvas w-full max-w-xl max-h-[90vh] overflow-y-auto overflow-x-hidden z-10 shadow-2xl border border-taupe/30 p-5 sm:p-8 animate-modal-pop box-border my-auto">
              <button
                onClick={onClose}
                className="absolute top-4 end-4 text-taupe-dark hover:text-noir text-lg"
                aria-label="Fermer"
              >
                ✕
              </button>

              <h2 className="font-serif text-2xl sm:text-3xl font-semibold text-noir mb-1">
                {t.checkout_title}
              </h2>
              <p className="text-xs text-taupe-dark mb-6">
                {t.checkout_subtitle}
              </p>

              <form onSubmit={handleSubmit} className="space-y-4">
                {/* Nom */}
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-noir mb-1">
                    {t.name_label}
                  </label>
                  <input
                    type="text"
                    required
                    value={customerName}
                    onChange={(e) => setCustomerName(e.target.value)}
                    placeholder={t.name_placeholder}
                    className="w-full bg-card border border-taupe/30 px-3.5 py-2.5 text-xs text-noir focus:border-caramel"
                  />
                </div>

                {/* Téléphone avec validation live */}
                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="block text-xs font-bold uppercase tracking-wider text-noir">
                      {t.phone_label}
                    </label>
                    {customerPhone && (
                      <span className={`text-[11px] font-semibold ${isPhoneValid ? 'text-[#10B981]' : 'text-[#B91C1C]'}`}>
                        {isPhoneValid ? t.phone_valid : t.phone_invalid}
                      </span>
                    )}
                  </div>
                  <div className="relative">
                    <input
                      type="tel"
                      required
                      value={customerPhone}
                      onChange={(e) => setCustomerPhone(e.target.value)}
                      placeholder={t.phone_placeholder}
                      className={`w-full bg-card border px-3.5 py-2.5 text-xs text-noir focus:border-caramel ${
                        customerPhone && !isPhoneValid ? 'border-[#B91C1C]' : 'border-taupe/30'
                      }`}
                    />
                    {isPhoneValid && (
                      <span className="absolute end-3 top-2.5 text-[#10B981] font-bold">✓</span>
                    )}
                  </div>
                </div>

                {/* Ville avec SLA */}
                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="block text-xs font-bold uppercase tracking-wider text-noir">
                      {t.city_label}
                    </label>
                    <span className="text-[11px] text-caramel font-semibold">
                      Délai estimé : {selectedCityObj.delay}
                    </span>
                  </div>
                  <select
                    value={city}
                    onChange={(e) => setCity(e.target.value)}
                    className="w-full bg-card border border-taupe/30 px-3.5 py-2.5 text-xs text-noir focus:border-caramel font-medium"
                  >
                    <optgroup label={lang === 'ar' ? "⭐ المدن الكبرى (توصيل سريع)" : "⭐ Grandes Villes (Livraison Express 24-48h)"}>
                      {MOROCCAN_CITIES.filter(c => c.isMajor).map(c => (
                        <option key={c.id} value={c.id}>
                          {lang === 'ar' ? c.nameAr : c.nameFr} (Livraison {c.delay})
                        </option>
                      ))}
                    </optgroup>
                    <optgroup label={lang === 'ar' ? "📦 باقي مدن المملكة (ترتيب أبجدي)" : "📦 Toutes les Villes du Maroc (Ordre Alphabétique)"}>
                      {MOROCCAN_CITIES.filter(c => !c.isMajor).map(c => (
                        <option key={c.id} value={c.id}>
                          {lang === 'ar' ? c.nameAr : c.nameFr} (Livraison {c.delay})
                        </option>
                      ))}
                    </optgroup>
                  </select>
                </div>

                {/* Adresse */}
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-noir mb-1">
                    {t.address_label}
                  </label>
                  <textarea
                    required
                    rows="2"
                    value={address}
                    onChange={(e) => setAddress(e.target.value)}
                    placeholder={t.address_placeholder}
                    className="w-full bg-card border border-taupe/30 px-3.5 py-2.5 text-xs text-noir focus:border-caramel"
                  />
                </div>

                {/* Notes optionnelles */}
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-taupe-dark mb-1">
                    {t.notes_label}
                  </label>
                  <input
                    type="text"
                    value={notes}
                    onChange={(e) => setNotes(e.target.value)}
                    placeholder={t.notes_placeholder}
                    className="w-full bg-card border border-taupe/30 px-3.5 py-2 text-xs text-noir focus:border-caramel"
                  />
                </div>

                {/* Code Promo / Coupon Discount */}
                <div className="bg-card/70 border border-taupe/25 p-3 rounded-xs space-y-1.5">
                  <label className="block text-[11px] font-bold uppercase tracking-wider text-noir">
                    🎟️ {t.promo_label} ({lang === 'ar' ? 'اختياري' : 'Optionnel'})
                  </label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={checkoutPromoInput}
                      onChange={(e) => setCheckoutPromoInput(e.target.value.toUpperCase())}
                      placeholder={t.promo_placeholder}
                      className="flex-1 bg-white border border-taupe/30 px-3 py-2 text-xs uppercase font-mono text-noir focus:border-caramel"
                    />
                    <button
                      type="button"
                      disabled={promoValidating}
                      onClick={() => onApplyPromo && onApplyPromo(checkoutPromoInput, totals.subtotal)}
                      className="px-3.5 py-2 bg-noir hover:bg-caramel text-white text-xs font-semibold uppercase tracking-wider transition-colors"
                    >
                      {promoValidating ? '...' : t.promo_apply}
                    </button>
                  </div>
                  {promoCode && totals.discount > 0 && (
                    <div className="flex items-center justify-between text-[11px] text-[#10B981] font-semibold pt-1">
                      <span>
                        ✓ {appliedCouponData
                          ? (lang === 'ar' ? appliedCouponData.labelAr : appliedCouponData.labelFr)
                          : `${t.promo_applied} (${promoCode})`}
                      </span>
                      <button
                        type="button"
                        onClick={() => {
                          setCheckoutPromoInput('');
                          if (onClearPromo) onClearPromo();
                        }}
                        className="text-taupe-dark hover:text-red-600 font-bold"
                      >
                        ✕
                      </button>
                    </div>
                  )}
                </div>

                {/* COD Recap Box */}
                <div className="bg-[#F8F5EE] border border-taupe/20 p-4 text-xs space-y-2 mt-4">
                  <div className="flex justify-between text-taupe-dark">
                    <span>Articles ({totals.itemCount})</span>
                    <span>{totals.subtotal.toLocaleString()} MAD</span>
                  </div>
                  {totals.discount > 0 && (
                    <div className="flex justify-between text-[#10B981] font-semibold">
                      <span>Remise ({promoCode || 'Coupon'})</span>
                      <span>-{totals.discount.toLocaleString()} MAD</span>
                    </div>
                  )}
                  <div className="flex justify-between text-taupe-dark">
                    <span>Livraison express à domicile</span>
                    <span className="text-[#10B981] font-semibold">0 MAD (Gratuite)</span>
                  </div>
                  <div className="flex justify-between text-sm font-bold text-noir pt-2 border-t border-taupe/20">
                    <span>Total à payer à la livraison</span>
                    <span className="text-caramel">{totals.total.toLocaleString()} MAD</span>
                  </div>
                </div>

                {/* Submit button */}
                <button
                  type="submit"
                  disabled={!isFormValid || submitting}
                  className={`w-full py-3.5 px-3 text-xs font-semibold uppercase tracking-wider transition-colors shadow-sm whitespace-normal text-center leading-snug box-border ${
                    !isFormValid || submitting
                      ? 'bg-taupe/30 text-taupe-dark cursor-not-allowed'
                      : 'bg-noir text-white hover:bg-caramel active:scale-98'
                  }`}
                >
                  {submitting ? 'Validation en cours...' : t.order_confirm_btn}
                </button>
              </form>
            </div>
          </div>
        );
      }

      // ========================================================================
      // SUB-COMPONENT: ORDER TRACKING MODAL
      // ========================================================================
      function TrackingModal({ lang, t, onClose, onViewInvoice }) {
        const [searchId, setSearchId] = useState('');
        const [loading, setLoading] = useState(false);
        const [orderResult, setOrderResult] = useState(null);
        const [notFound, setNotFound] = useState(false);

        const handleTrack = async (e) => {
          e.preventDefault();
          if (!searchId.trim()) return;

          setLoading(true);
          setNotFound(false);
          setOrderResult(null);

          try {
            const clean = searchId.trim().toUpperCase();
            const res = await fetch(`/api/orders/${clean}`);
            if (res.ok) {
              const data = await res.json();
              setOrderResult(data);
            } else {
              setNotFound(true);
            }
          } catch {
            setNotFound(true);
          } finally {
            setLoading(false);
          }
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto overflow-x-hidden">
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs" onClick={onClose} />
            <div className="relative bg-canvas w-full max-w-lg p-5 sm:p-8 z-10 shadow-2xl border border-taupe/30 animate-modal-pop box-border my-auto overflow-x-hidden">
              <button
                onClick={onClose}
                className="absolute top-4 end-4 text-taupe-dark hover:text-noir text-lg"
              >
                ✕
              </button>

              <h2 className="font-serif text-2xl sm:text-3xl font-semibold text-noir mb-2">
                {t.tracking_title}
              </h2>
              <p className="text-xs text-taupe-dark mb-6">
                Entrez votre identifiant de commande (ex: CMD-XXXXXX) pour voir l'état d'avancement.
              </p>

              <form onSubmit={handleTrack} className="flex gap-2 mb-6">
                <input
                  type="text"
                  required
                  value={searchId}
                  onChange={(e) => setSearchId(e.target.value)}
                  placeholder={t.tracking_input_placeholder}
                  className="flex-1 bg-card border border-taupe/30 px-3.5 py-2.5 text-xs text-noir uppercase focus:border-caramel"
                />
                <button
                  type="submit"
                  disabled={loading}
                  className="px-5 py-2.5 bg-noir text-white text-xs font-semibold uppercase tracking-wider hover:bg-caramel transition-colors"
                >
                  {loading ? '...' : t.tracking_btn}
                </button>
              </form>

              {notFound && (
                <div className="p-4 bg-[#FEE2E2] text-[#991B1B] text-xs border border-[#FCA5A5] mb-4">
                  Aucune commande trouvée pour la référence "{searchId}". Vérifiez le code.
                </div>
              )}

              {orderResult && (
                <div className="bg-card border border-taupe/20 p-5 space-y-4">
                  <div className="flex items-center justify-between pb-3 border-b border-taupe/15">
                    <div>
                      <div className="text-xs text-taupe-dark">{t.tracking_input_label}</div>
                      <div className="text-sm font-bold text-noir">{orderResult.id}</div>
                    </div>
                    <span className="px-3 py-1 bg-noir text-white text-xs font-semibold rounded-xs">
                      {orderResult.status}
                    </span>
                  </div>

                  <div className="grid grid-cols-2 gap-3 text-xs">
                    <div>
                      <span className="text-taupe-dark block">{t.tracking_client} :</span>
                      <span className="font-medium text-noir">{orderResult.customerName}</span>
                    </div>
                    <div>
                      <span className="text-taupe-dark block">{t.tracking_city} :</span>
                      <span className="font-medium text-noir">{orderResult.city}</span>
                    </div>
                    <div>
                      <span className="text-taupe-dark block">{t.tracking_date} :</span>
                      <span className="font-medium text-noir">{new Date(orderResult.date).toLocaleDateString()}</span>
                    </div>
                    <div>
                      <span className="text-taupe-dark block">{t.total} :</span>
                      <span className="font-bold text-caramel">{Number(orderResult.total).toLocaleString()} MAD</span>
                    </div>
                  </div>

                  <button
                    onClick={() => onViewInvoice(orderResult)}
                    className="w-full mt-2 py-2.5 border border-noir text-xs font-semibold uppercase tracking-wider hover:bg-noir hover:text-white transition-colors"
                  >
                    {t.tracking_view_invoice}
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      }

            showToast('Aucune commande à exporter pour cette sélection.', 'warning');

          }
          const profitMap = kpis?.orderProfitMap || {};
          const escCsv = (val) => {
            const s = String(val ?? '').replace(/\r?\n/g, ' ').replace(/"/g, '""');
            return `"${s}"`;
          };
          const headers = [
            'N° Commande',
            'Date',
            'Client',
            'Téléphone',
            'Ville',
            'Adresse',
            'Statut',
            'Transporteur',
            'N° Suivi',
            'Articles',
            'Sous-total (MAD)',
            'Remise (MAD)',
            'Total Facturé COD (MAD)',
            'Coût Achat Produits (MAD)',
            'Coût Livraison Réel (MAD)',
            'Bénéfice Net Réel (MAD)',
            'Marge (%)'
          ];
          const rows = sourceList.map(o => {
            const pStats = profitMap[o.id] || {
              productCost: 0,
              shippingCost: Number(o.realShippingCost || 0),
              netProfit: Number(o.total || 0),
              marginPct: 0
            };
            const dateStr = o.date ? new Date(o.date).toLocaleDateString('fr-FR') : '';
            const itemsSummary = (Array.isArray(o.items) ? o.items : [])
              .map(it => `${it.quantity || 1}x ${it.nameFr} (${it.size || 'Std'}${it.colorLabel ? '/' + it.colorLabel : ''})`)
              .join(' | ');
            return [
              escCsv(o.id),
              escCsv(dateStr),
              escCsv(o.customerName),
              escCsv(o.customerPhone),
              escCsv(o.city),
              escCsv(o.address),
              escCsv(o.status),
              escCsv(o.shipment?.carrierLabel || '—'),
              escCsv(o.shipment?.trackingNumber || '—'),
              escCsv(itemsSummary),
              Number(o.subtotal ?? o.total ?? 0),
              Number(o.discount ?? 0),
              Number(o.total ?? 0),
              Number(pStats.productCost || 0),
              Number(pStats.shippingCost || 0),
              Number(pStats.netProfit || 0),
              `${pStats.marginPct || 0}%`
            ].join(';');
          });
          const csvContent = '\uFEFF' + [headers.map(escCsv).join(';'), ...rows].join('\r\n');
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const suffix = Array.isArray(customOrders) ? 'Selection' : (exportMonth || 'Toutes');

          a.download = `MODANOVA-Comptabilite-${suffix}.csv`;

            const res = await fetch(`/api/products/${encodeURIComponent(numId)}`, {
              method: 'DELETE',
              headers: { Authorization: `Bearer ${token}` }

            if (res.ok) {

              showToast(t.toast_product_deleted, 'info');

              await onRefreshProducts();
              showToast('Erreur suppression produit', 'error');

            showToast('Erreur suppression', 'error');

            setDeletingProdId(null);

            ...item,
            position: idx + 1
          }));
          if (onReorderProductsLocal) {
            onReorderProductsLocal(normalized);
          }
          if (targetPageAfterMove != null) {
            setProdPage(targetPageAfterMove);

          setReorderingProds(true);
          try {
            const orderedIds = normalized.map(item => Number(item.id));
            const res = await fetch('/api/products/reorder', {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`

              body: JSON.stringify({ orderedIds })

            if (res.ok) {
              const data = await res.json().catch(() => ({}));
              if (Array.isArray(data.products) && onReorderProductsLocal) {
                onReorderProductsLocal(data.products);
              } else {
                await onRefreshProducts();
              }
              showToast('Ordre des produits mis à jour et sauvegardé sur Firebase !', 'success');
            } else {
              await onRefreshProducts();
              showToast("Erreur lors de l'enregistrement de l'ordre", 'error');

            showToast('Erreur de connexion', 'error');

            setReorderingProds(false);

        const handleMoveProductToRank = async (productId, targetRank1Based) => {
          const list = [...(products || [])];
          const fromIdx = list.findIndex(item => Number(item.id) === Number(productId));
          if (fromIdx < 0) return;
          const toIdx = Math.max(0, Math.min(list.length - 1, Number(targetRank1Based) - 1));
          if (fromIdx === toIdx) return;

          const [movedItem] = list.splice(fromIdx, 1);
          list.splice(toIdx, 0, movedItem);

          const targetPage = Math.max(1, Math.ceil((toIdx + 1) / PRODUCTS_PER_PAGE));
          await persistProductsOrder(list, targetPage);

        const handleStepProductRank = async (productId, delta) => {
          const list = [...(products || [])];
          const fromIdx = list.findIndex(item => Number(item.id) === Number(productId));
          if (fromIdx < 0) return;
          const targetRank = fromIdx + 1 + delta;
          if (targetRank < 1 || targetRank > list.length) return;
          await handleMoveProductToRank(productId, targetRank);

                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`

                              )}
                              <span>Livraison : <strong className="text-noir">{editShipping > 0 ? `${editShipping} MAD` : 'Gratuite'}</strong></span>

                        <div className="pt-2 flex justify-end gap-2">

      }

      // ========================================================================
      // SUB-COMPONENT: PRODUCT FORM MODAL (Add / Edit + Firebase Image Upload)
      // ========================================================================
      function ProductFormModal({ initialData, token, lang, t, onClose, onSaved, onError }) {
        const [nameFr, setNameFr] = useState(initialData.nameFr || '');
        const [nameAr, setNameAr] = useState(initialData.nameAr || '');
        const [price, setPrice] = useState(initialData.price || '');
        const [oldPrice, setOldPrice] = useState(initialData.oldPrice || '');
        const [costPrice, setCostPrice] = useState(
          initialData.costPrice !== undefined && initialData.costPrice !== null ? initialData.costPrice : ''
        );
        const [stock, setStock] = useState(initialData.stock ?? 10);
        const [category, setCategory] = useState(initialData.category || PRODUCT_CATEGORIES[0]);
        const [badge, setBadge] = useState(initialData.badge || 'new');
        const [showOnHome, setShowOnHome] = useState(initialData.showOnHome !== false);
        const [videoUrl, setVideoUrl] = useState(initialData.videoUrl || '');
        const [imagesList, setImagesList] = useState(Array.isArray(initialData.images) ? [...initialData.images] : []);
        const [newImageUrl, setNewImageUrl] = useState('');
        const [draggedImgIdx, setDraggedImgIdx] = useState(null);
        const [dragOverImgIdx, setDragOverImgIdx] = useState(null);
        const [descFr, setDescFr] = useState(initialData.descFr || '');
        const [descAr, setDescAr] = useState(initialData.descAr || '');
        const [sizesStr, setSizesStr] = useState(
          Array.isArray(initialData.sizes) && initialData.sizes.length > 0
            ? initialData.sizes.join(', ')
            : 'Unique'
        );
        const [colorsStr, setColorsStr] = useState(
          Array.isArray(initialData.colors) && initialData.colors.length > 0
            ? initialData.colors.join(', ')
            : 'Noir:#171717'
        );
        const [variantStockMap, setVariantStockMap] = useState(() => {
          if (initialData.variantStock && typeof initialData.variantStock === 'object' && Object.keys(initialData.variantStock).length > 0) {
            return { ...initialData.variantStock };
          }
          // Pre-populate evenly or with initial stock for existing sizes × colors
          const initSizes = Array.isArray(initialData.sizes) && initialData.sizes.length > 0 ? initialData.sizes : ['Unique'];
          const initColors = Array.isArray(initialData.colors) && initialData.colors.length > 0 ? initialData.colors : ['#171717'];
          const map = {};
          const combosCount = Math.max(1, initSizes.length * initColors.length);
          const defaultPerCombo = initialData.id
            ? Math.max(1, Math.floor((Number(initialData.stock) || 5) / combosCount))
            : 5;
          initSizes.forEach(s => {
            initColors.forEach(c => {
              map[makeVariantKey(s, c)] = defaultPerCombo;
            });
          });
          return map;
        });
        const [bulkFillValue, setBulkFillValue] = useState(5);
        const [uploading, setUploading] = useState(false);
        const [uploadError, setUploadError] = useState('');

        const parsedSizes = useMemo(() => {
          const arr = sizesStr.split(',').map(s => s.trim()).filter(Boolean);
          return arr.length > 0 ? arr : ['Unique'];
        }, [sizesStr]);

        const parsedColors = useMemo(() => {
          const arr = colorsStr.split(',').map(s => s.trim()).filter(Boolean);
          return arr.length > 0 ? arr : ['Noir:#171717'];
        }, [colorsStr]);

        // Helper to read quantity for (size, color) in the form
        const getCellQty = (size, color) => {
          const exactKey = makeVariantKey(size, color);
          if (variantStockMap[exactKey] !== undefined) {
            return Math.max(0, Number(variantStockMap[exactKey]) || 0);
          }
          const cLabel = getColorLabel(color, 'fr').toLowerCase();
          for (const [k, v] of Object.entries(variantStockMap)) {
            const [ks, kc] = String(k).split('__');
            if (ks && kc && ks.trim().toLowerCase() === size.toLowerCase() && (kc.trim().toLowerCase() === color.toLowerCase() || getColorLabel(kc, 'fr').toLowerCase() === cLabel)) {
              return Math.max(0, Number(v) || 0);
            }
          }
          return 0;
        };

        const setCellQty = (size, color, val) => {
          const cleanQty = Math.max(0, Math.floor(Number(val) || 0));
          const key = makeVariantKey(size, color);
          setVariantStockMap(prev => ({
            ...prev,
            [key]: cleanQty
          }));
        };

        // Keep total stock synchronized with the sum of all active (size × color) cells
        const totalCalculatedStock = useMemo(() => {
          let sum = 0;
          parsedSizes.forEach(sz => {
            parsedColors.forEach(col => {
              sum += getCellQty(sz, col);
            });
          });
          return sum;
        }, [parsedSizes, parsedColors, variantStockMap]);

        useEffect(() => {
          setStock(totalCalculatedStock);
        }, [totalCalculatedStock]);

        const handleApplyBulkQty = () => {
          const q = Math.max(0, Math.floor(Number(bulkFillValue) || 0));
          const next = { ...variantStockMap };
          parsedSizes.forEach(sz => {
            parsedColors.forEach(col => {
              next[makeVariantKey(sz, col)] = q;
            });
          });
          setVariantStockMap(next);
        };

        const handleAddPresetColor = (preset) => {
          const tokenStr = `${preset.labelFr}:${preset.hex}`;
          const currentList = colorsStr.split(',').map(s => s.trim()).filter(Boolean);
          const alreadyExists = currentList.some(
            c => getColorLabel(c, 'fr').toLowerCase() === preset.labelFr.toLowerCase() || c.toUpperCase() === preset.hex.toUpperCase()
          );
          if (!alreadyExists) {
            const updated = [...currentList, tokenStr];
            setColorsStr(updated.join(', '));
            setVariantStockMap(prev => {
              const copy = { ...prev };
              parsedSizes.forEach(sz => {
                copy[makeVariantKey(sz, tokenStr)] = 5;
              });
              return copy;
            });
          }
        };

        const handleApplySizePreset = (presetSizesArr) => {
          setSizesStr(presetSizesArr.join(', '));
          setVariantStockMap(prev => {
            const copy = { ...prev };
            presetSizesArr.forEach(sz => {
              parsedColors.forEach(col => {
                const k = makeVariantKey(sz, col);
                if (copy[k] === undefined) copy[k] = 5;
              });
            });
            return copy;
          });
        };

        const handleFileUpload = async (e) => {
          const files = Array.from(e.target.files || []);
          if (files.length === 0) return;
          setUploading(true);
          setUploadError('');

          try {
            for (const file of files) {
              const base64Data = await compressImageFile(file, 1100, 0.82);

              const res = await fetch('/api/upload', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  Authorization: `Bearer ${token}`
                },
                body: JSON.stringify({
                  file: base64Data,
                  filename: file.name,
                  folder: 'products'
                })
              });

              const data = await res.json();
              if (res.ok && data.url) {
                setImagesList(prev => [...prev, data.url]);
              } else {
                setUploadError(data.error || "Erreur lors de l'upload de l'image");
              }
            }
          } catch (err) {
            setUploadError("Erreur lors de l'envoi vers Firebase Storage");
          } finally {
            setUploading(false);
            e.target.value = '';
          }
        };

        const handleRemoveImage = (indexToRemove) => {
          setImagesList(prev => prev.filter((_, idx) => idx !== indexToRemove));
        };

        // Move a photo from `fromIndex` to `toIndex` (0-based) to choose 1st, 2nd, 3rd, etc.
        const handleMoveImage = (fromIndex, toIndex) => {
          setImagesList(prev => {
            if (fromIndex < 0 || fromIndex >= prev.length) return prev;
            const boundedTo = Math.max(0, Math.min(prev.length - 1, toIndex));
            if (fromIndex === boundedTo) return prev;
            const next = [...prev];
            const [moved] = next.splice(fromIndex, 1);
            next.splice(boundedTo, 0, moved);
            return next;
          });
        };

        const handleAddManualImageUrl = () => {
          const trimmed = (newImageUrl || '').trim();
          if (!trimmed) return;
          setImagesList(prev => [...prev, trimmed]);
          setNewImageUrl('');
        };

        const handleSubmit = async (e) => {
          e.preventDefault();
          try {
            const pendingUrl = (newImageUrl || '').trim();
            const finalImages = pendingUrl ? [...imagesList, pendingUrl] : [...imagesList];
            const sizes = parsedSizes;
            const colors = parsedColors;

            // Build clean variantStock dictionary for all active sizes × colors
            const cleanVariantStock = {};
            let sumStock = 0;
            sizes.forEach(sz => {
              colors.forEach(col => {
                const q = getCellQty(sz, col);
                cleanVariantStock[makeVariantKey(sz, col)] = q;
                sumStock += q;
              });
            });

            const payload = {
              id: initialData.id,
              position: initialData.position,
              nameFr,
              nameAr,
              price: Number(price),
              oldPrice: oldPrice ? Number(oldPrice) : null,
              costPrice: costPrice !== '' ? Math.max(0, Number(costPrice) || 0) : 0,
              stock: sumStock,
              inStock: sumStock > 0,
              variantStock: cleanVariantStock,
              category,
              badge: sumStock <= 0 ? 'out' : (badge === 'out' ? 'new' : badge),
              isNew: badge === 'new',
              showOnHome: Boolean(showOnHome),
              videoUrl: (videoUrl || '').trim(),
              rating: initialData.rating || 5,
              images: finalImages.length > 0 ? finalImages : ['data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="%23f3f1ec"/><text x="200" y="200" fill="%23999" text-anchor="middle">MODANOVA</text></svg>'],
              descFr,
              descAr,
              sizes,
              colors
            };

            const res = await fetch('/api/products', {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`
              },
              body: JSON.stringify(payload)
            });

            if (res.ok) {
              const resData = await res.json().catch(() => ({}));
              onSaved(resData.product || payload);
            } else {
              const data = await res.json();
              onError(data.error || 'Erreur enregistrement');
            }
          } catch (err) {
            onError('Erreur de connexion');
          }
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs" onClick={onClose} />
            <div className="relative bg-canvas w-full max-w-3xl max-h-[92vh] overflow-y-auto z-10 shadow-2xl border border-taupe/30 p-6 sm:p-8">
              <button onClick={onClose} className="absolute top-4 end-4 text-taupe-dark hover:text-noir text-lg">✕</button>

              <h3 className="font-serif text-2xl font-bold text-noir mb-4">
                {initialData.id ? 'Modifier le Produit' : 'Ajouter un Produit'}
              </h3>

              <form onSubmit={handleSubmit} className="space-y-4 text-xs">
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block font-bold uppercase mb-1">Nom (FR) *</label>
                    <input
                      type="text"
                      required
                      value={nameFr}
                      onChange={(e) => setNameFr(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2"
                    />
                  </div>
                  <div>
                    <label className="block font-bold uppercase mb-1">Nom (AR)</label>
                    <input
                      type="text"
                      dir="rtl"
                      value={nameAr}
                      onChange={(e) => setNameAr(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <div>
                    <label className="block font-bold uppercase mb-1">Prix Vente (MAD) *</label>
                    <input
                      type="number"
                      required
                      value={price}
                      onChange={(e) => setPrice(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2 font-bold"
                    />
                  </div>
                  <div>
                    <label className="block font-bold uppercase mb-1">Ancien Prix</label>
                    <input
                      type="number"
                      value={oldPrice}
                      onChange={(e) => setOldPrice(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2"
                    />
                  </div>
                  <div>
                    <label className="block font-bold uppercase mb-1 text-emerald-800" title="Visible uniquement par vous dans le Panel Admin">
                      Prix d'achat / Coût (Admin seul)
                    </label>
                    <input
                      type="number"
                      min="0"
                      value={costPrice}
                      onChange={(e) => setCostPrice(e.target.value)}
                      placeholder="Coût import MAD"
                      className="w-full bg-emerald-50/70 border border-emerald-400/60 p-2 font-mono font-bold text-emerald-950"
                    />
                  </div>
                  <div>
                    <label className="block font-bold uppercase mb-1">Stock Total (Calculé auto)</label>
                    <input
                      type="number"
                      readOnly
                      value={stock}
                      className="w-full bg-[#EFECE6] border border-taupe/30 p-2 font-bold text-noir cursor-not-allowed"
                      title="Le stock total est calculé automatiquement à partir des quantités de chaque taille et couleur ci-dessous"
                    />
                  </div>
                </div>
                {Number(price) > 0 && costPrice !== '' && (
                  <div className="bg-emerald-50 border border-emerald-200 px-3 py-2 rounded-xs flex items-center justify-between text-[11px] text-emerald-900">
                    <span>
                      💰 <strong>Marge brute unitaire estimée (Admin seul) :</strong>{' '}
                      <strong>{(Number(price) - (Number(costPrice) || 0)).toLocaleString()} MAD</strong>{' '}
                      ({Math.round(((Number(price) - (Number(costPrice) || 0)) / Number(price)) * 100)}%)
                    </span>
                    <span className="text-[10px] text-emerald-700 font-semibold">Jamais visible aux clients</span>
                  </div>
                )}

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block font-bold uppercase mb-1">Catégorie *</label>
                    <select
                      value={category}
                      onChange={(e) => setCategory(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2 font-medium"
                    >
                      {PRODUCT_CATEGORIES.map(cat => (
                        <option key={cat} value={cat}>{cat}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block font-bold uppercase mb-1">Badge</label>
                    <select
                      value={badge}
                      onChange={(e) => setBadge(e.target.value)}
                      className="w-full bg-card border border-taupe/30 p-2"
                    >
                      <option value="new">Nouveau</option>
                      <option value="exclusive">Exclusif</option>
                      <option value="luxury">Édition Limitée</option>
                      <option value="out">Rupture</option>
                    </select>
                  </div>
                </div>

                {/* Visibilité sur la Page Principale (Index / Accueil) */}
                <div className={`p-3.5 rounded-xs border transition-colors flex items-start justify-between gap-3 ${showOnHome ? 'bg-emerald-50/70 border-emerald-400' : 'bg-card border-taupe/30'}`}>
                  <label className="flex items-start gap-3 cursor-pointer select-none flex-1">
                    <input
                      type="checkbox"
                      checked={showOnHome}
                      onChange={(e) => setShowOnHome(e.target.checked)}
                      className="mt-0.5 w-4 h-4 accent-noir cursor-pointer"
                    />
                    <div>
                      <span className="font-bold uppercase text-[11px] text-noir block">
                        🏠 Afficher ce produit sur la Page Principale (Index / Accueil)
                      </span>
                      <span className="text-[10px] text-taupe-dark block mt-0.5">
                        {showOnHome
                          ? "✅ Ce produit est visible sur la Page Principale (Accueil) ET sur la page « Tous les Produits & Filtres »."
                          : "📂 Ce produit est masqué de la Page Principale (Accueil) et s'affiche uniquement sur la page « Tous les Produits & Filtres » (/produits)."}
                      </span>
                    </div>
                  </label>
                  <span className={`px-2 py-0.5 text-[10px] font-bold uppercase rounded-2xs shrink-0 ${showOnHome ? 'bg-emerald-700 text-white' : 'bg-taupe/30 text-noir'}`}>
                    {showOnHome ? 'Sur Index' : 'Catalogue seul'}
                  </span>
                </div>

                {/* Section Lien Vidéo du Produit (YouTube, TikTok, Vimeo, Reel, MP4...) */}
                <div className="border border-taupe/35 bg-white p-4 rounded-xs space-y-3 shadow-2xs">
                  <div className="flex items-center justify-between gap-2">
                    <div>
                      <label className="font-bold uppercase text-[11px] text-noir block">
                        🎬 Lien Vidéo du Produit (Optionnel)
                      </label>
                      <span className="text-[10px] text-taupe-dark block mt-0.5">
                        Collez un lien vidéo <strong>YouTube</strong>, <strong>YouTube Shorts</strong>, <strong>TikTok</strong>, <strong>Vimeo</strong>, <strong>Google Drive</strong>, <strong>Instagram Reel</strong> ou un lien direct <strong>.mp4 / .webm</strong>.
                      </span>
                    </div>
                    {videoUrl && videoUrl.trim() && (
                      <button
                        type="button"
                        onClick={() => setVideoUrl('')}
                        className="px-2.5 py-1 bg-red-50 hover:bg-red-600 text-red-700 hover:text-white border border-red-200 text-[10px] font-bold rounded-2xs transition-colors shrink-0"
                      >
                        ✕ Supprimer vidéo
                      </button>
                    )}
                  </div>
                  <input
                    type="url"
                    value={videoUrl}
                    onChange={(e) => setVideoUrl(e.target.value)}
                    placeholder="Ex: https://www.youtube.com/watch?v=... ou https://youtu.be/... ou https://.../video.mp4"
                    className="w-full bg-card border border-taupe/30 px-3 py-2 font-mono text-xs text-noir focus:border-caramel"
                  />
                  {videoUrl && videoUrl.trim() && (
                    <div className="pt-2 border-t border-taupe/15">
                      <div className="text-[10px] font-bold uppercase tracking-wider text-caramel mb-1.5">
                        ▶ Aperçu en direct de la vidéo :
                      </div>
                      <div className="max-w-sm mx-auto">
                        <ProductVideoPlayer videoUrl={videoUrl} title={nameFr || 'Aperçu Vidéo'} lang={lang} />
                      </div>
                    </div>
                  )}
                </div>

                {/* Section Upload & Réorganisation des Photos du Produit */}
                <div className="border border-dashed border-caramel/50 bg-[#FAF7F2] p-4 rounded-xs space-y-3">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <span className="font-bold uppercase text-[11px] text-noir block">
                        📸 Photos du Produit & Ordre d'Affichage (1er, 2ème, 3ème...)
                      </span>
                      <span className="text-[10px] text-taupe-dark block mt-0.5">
                        Déplacez les photos (flèches <strong>← →</strong>, menu <strong>1er, 2e, 3e...</strong> ou glisser-déposer) pour choisir la 1ère photo principale, la 2ème, la 3ème, etc.
                      </span>
                    </div>
                    <label className={`px-3.5 py-2 bg-noir hover:bg-caramel text-white text-[11px] font-semibold cursor-pointer rounded-xs transition-colors flex items-center gap-1.5 shrink-0 shadow-xs ${uploading ? 'opacity-50 pointer-events-none' : ''}`}>
                      <span>{uploading ? '⏳ Upload Firebase...' : '📁 Ajouter photo(s)'}</span>
                      <input
                        type="file"
                        accept="image/*"
                        multiple
                        onChange={handleFileUpload}
                        className="hidden"
                        disabled={uploading}
                      />
                    </label>
                  </div>

                  {uploadError && (
                    <div className="p-2 bg-red-100 text-red-800 text-[11px] rounded-xs">
                      {uploadError}
                    </div>
                  )}

                  {/* Reorderable Photo Gallery (1st, 2nd, 3rd, etc.) */}
                  {imagesList.length > 0 ? (
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 pt-2 border-t border-taupe/20">
                      {imagesList.map((imgUrl, i) => {
                        const isFirst = i === 0;
                        const isBeingDragged = draggedImgIdx === i;
                        const isDragTarget = dragOverImgIdx === i && draggedImgIdx !== i;

                        return (
                          <div
                            key={`${i}-${imgUrl.slice(0, 24)}`}
                            draggable
                            onDragStart={(e) => {
                              setDraggedImgIdx(i);
                              try {
                                e.dataTransfer.effectAllowed = 'move';
                                e.dataTransfer.setData('text/plain', String(i));
                              } catch {}
                            }}
                            onDragOver={(e) => {
                              e.preventDefault();
                              if (dragOverImgIdx !== i) {
                                setDragOverImgIdx(i);
                              }
                            }}
                            onDragLeave={() => {
                              if (dragOverImgIdx === i) {
                                setDragOverImgIdx(null);
                              }
                            }}
                            onDrop={(e) => {
                              e.preventDefault();
                              const fromIdx = draggedImgIdx != null ? draggedImgIdx : Number(e.dataTransfer.getData('text/plain'));
                              setDraggedImgIdx(null);
                              setDragOverImgIdx(null);
                              if (!isNaN(fromIdx)) {
                                handleMoveImage(fromIdx, i);
                              }
                            }}
                            onDragEnd={() => {
                              setDraggedImgIdx(null);
                              setDragOverImgIdx(null);
                            }}
                            className={`relative bg-white border rounded-xs p-2 flex flex-col justify-between shadow-2xs transition-all cursor-grab active:cursor-grabbing ${
                              isBeingDragged
                                ? 'opacity-40 scale-95 border-caramel'
                                : isDragTarget
                                ? 'border-2 border-caramel ring-2 ring-caramel/30 bg-caramel/5'
                                : isFirst
                                ? 'border-2 border-caramel'
                                : 'border-taupe/30 hover:border-noir/50'
                            }`}
                          >
                            {/* Top Bar: Rank Badge + Position Dropdown + Delete Button */}
                            <div className="flex items-center justify-between gap-1 mb-1.5">
                              <div className="flex items-center gap-1">
                                <span
                                  className={`px-1.5 py-0.5 text-[10px] font-bold uppercase rounded-2xs ${
                                    isFirst
                                      ? 'bg-noir text-[#E6C687]'
                                      : 'bg-canvas text-noir border border-taupe/25'
                                  }`}
                                >
                                  {isFirst ? '★ 1ère (Principale)' : `${i + 1}ème`}
                                </span>
                              </div>

                              <div className="flex items-center gap-1">
                                {imagesList.length > 1 && (
                                  <select
                                    value={i + 1}
                                    onChange={(e) => handleMoveImage(i, Number(e.target.value) - 1)}
                                    className="bg-canvas border border-taupe/35 text-noir font-mono text-[10px] font-bold px-1 py-0.5 rounded-2xs cursor-pointer hover:border-caramel"
                                    title="Choisir la position de cette photo (1ère, 2ème, 3ème...)"
                                  >
                                    {imagesList.map((_, posIdx) => (
                                      <option key={posIdx} value={posIdx + 1}>
                                        {posIdx === 0 ? 'Pos: 1er' : `Pos: ${posIdx + 1}e`}
                                      </option>
                                    ))}
                                  </select>
                                )}
                                <button
                                  type="button"
                                  onClick={() => handleRemoveImage(i)}
                                  className="bg-red-600 hover:bg-red-700 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-2xs transition-colors"
                                  title="Supprimer cette photo"
                                >
                                  ✕
                                </button>
                              </div>
                            </div>

                            {/* Image Preview */}
                            <div className="w-full h-28 bg-[#F7F5F0] border border-taupe/15 rounded-2xs overflow-hidden flex items-center justify-center p-1 mb-2">
                              <img src={imgUrl} alt={`Photo ${i + 1}`} className="w-full h-full object-contain pointer-events-none" />
                            </div>

                            {/* Bottom Reorder Controls: Left (←), Make 1st (★ 1er), Right (→) */}
                            {imagesList.length > 1 && (
                              <div className="flex items-center justify-between gap-1 pt-1 border-t border-taupe/15">
                                <button
                                  type="button"
                                  disabled={i === 0}
                                  onClick={() => handleMoveImage(i, i - 1)}
                                  className={`px-2 py-1 text-[10px] font-bold rounded-2xs border transition-colors ${
                                    i === 0
                                      ? 'border-taupe/15 text-taupe/40 cursor-not-allowed'
                                      : 'border-taupe/30 bg-canvas hover:bg-noir hover:text-white text-noir'
                                  }`}
                                  title="Déplacer vers la gauche (position précédente)"
                                >
                                  ← Gauche
                                </button>

                                {!isFirst && (
                                  <button
                                    type="button"
                                    onClick={() => handleMoveImage(i, 0)}
                                    className="px-1.5 py-1 text-[10px] font-bold rounded-2xs bg-caramel/15 hover:bg-caramel text-caramel hover:text-white border border-caramel/30 transition-colors"
                                    title="Définir comme 1ère photo principale"
                                  >
                                    ★ 1er
                                  </button>
                                )}

                                <button
                                  type="button"
                                  disabled={i === imagesList.length - 1}
                                  onClick={() => handleMoveImage(i, i + 1)}
                                  className={`px-2 py-1 text-[10px] font-bold rounded-2xs border transition-colors ${
                                    i === imagesList.length - 1
                                      ? 'border-taupe/15 text-taupe/40 cursor-not-allowed'
                                      : 'border-taupe/30 bg-canvas hover:bg-noir hover:text-white text-noir'
                                  }`}
                                  title="Déplacer vers la droite (position suivante)"
                                >
                                  Droite →
                                </button>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  ) : (
                    <div className="text-center py-4 text-taupe-dark text-[11px] border-t border-taupe/15">
                      Aucune photo ajoutée pour le moment. Cliquez sur « 📁 Ajouter photo(s) » ci-dessus.
                    </div>
                  )}

                  {/* Add Image by URL Option */}
                  <div className="pt-2 border-t border-taupe/20">
                    <label className="block font-bold uppercase text-[10px] text-taupe-dark mb-1">
                      Ajouter une photo via lien URL (optionnel)
                    </label>
                    <div className="flex items-center gap-2">
                      <input
                        type="text"
                        value={newImageUrl}
                        onChange={(e) => setNewImageUrl(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            e.preventDefault();
                            handleAddManualImageUrl();
                          }
                        }}
                        placeholder="https://... ou /uploads/..."
                        className="flex-1 bg-white border border-taupe/30 px-2.5 py-1.5 font-mono text-[11px]"
                      />
                      <button
                        type="button"
                        onClick={handleAddManualImageUrl}
                        className="px-3 py-1.5 bg-noir hover:bg-caramel text-white text-[11px] font-semibold rounded-xs transition-colors shrink-0"
                      >
                        + Ajouter URL
                      </button>
                    </div>
                  </div>
                </div>

                {/* ========================================================= */}
                {/* TAILLES / POINTURES / FORMATS & COULEURS + MATRICE STOCK  */}
                {/* ========================================================= */}
                <div className="border border-taupe/30 bg-white p-4 rounded-xs space-y-4 shadow-2xs">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-taupe/15 pb-3">
                    <div>
                      <span className="font-bold uppercase text-xs text-noir block">
                        📦 Gestion des Quantités par Taille / Pointure & par Couleur
                      </span>
                      <span className="text-[11px] text-taupe-dark">
                        Définissez le stock exact pour chaque combinaison (Vêtements, Chaussures et Accessoires). Dès qu'une taille d'une couleur tombe à 0, le client est informé qu'elle est épuisée.
                      </span>
                    </div>
                    <span className="px-2.5 py-1 bg-noir text-[#E6C687] font-mono text-[11px] font-bold rounded-xs shrink-0">
                      Total : {totalCalculatedStock} en stock
                    </span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {/* Sizes Input + Quick Presets */}
                    <div>
                      <label className="block font-bold uppercase mb-1 text-noir">
                        Tailles / Pointures / Formats (séparés par virgule) *
                      </label>
                      <input
                        type="text"
                        value={sizesStr}
                        onChange={(e) => setSizesStr(e.target.value)}
                        placeholder="Ex: S, M, L, XL ou 40, 41, 42, 43 ou Unique"
                        className="w-full bg-card border border-taupe/30 p-2 font-mono text-xs"
                      />
                      <div className="flex flex-wrap gap-1.5 mt-1.5">
                        <button
                          type="button"
                          onClick={() => handleApplySizePreset(['S', 'M', 'L', 'XL', 'XXL'])}
                          className="px-2 py-0.5 bg-canvas hover:bg-noir hover:text-white border border-taupe/30 text-[10px] font-semibold rounded-2xs transition-colors"
                        >
                          👕 Vêtements (S, M, L, XL, XXL)
                        </button>
                        <button
                          type="button"
                          onClick={() => handleApplySizePreset(['40', '41', '42', '43', '44', '45'])}
                          className="px-2 py-0.5 bg-canvas hover:bg-noir hover:text-white border border-taupe/30 text-[10px] font-semibold rounded-2xs transition-colors"
                        >
                          👞 Chaussures (40 à 45)
                        </button>
                        <button
                          type="button"
                          onClick={() => handleApplySizePreset(['Unique'])}
                          className="px-2 py-0.5 bg-canvas hover:bg-noir hover:text-white border border-taupe/30 text-[10px] font-semibold rounded-2xs transition-colors"
                        >
                          👜 Accessoires (Taille Unique)
                        </button>
                      </div>
                    </div>

                    {/* Colors Input + Quick Presets */}
                    <div>
                      <label className="block font-bold uppercase mb-1 text-noir">
                        Couleurs (séparées par virgule) *
                      </label>
                      <input
                        type="text"
                        value={colorsStr}
                        onChange={(e) => setColorsStr(e.target.value)}
                        placeholder="Ex: Noir:#171717, Marron:#3D2B1F, Blanc:#FFFFFF"
                        className="w-full bg-card border border-taupe/30 p-2 font-mono text-xs"
                      />
                      <div className="flex flex-wrap gap-1 mt-1.5">
                        {PRESET_COLOR_PALETTE.map(p => (
                          <button
                            key={p.labelFr}
                            type="button"
                            onClick={() => handleAddPresetColor(p)}
                            className="px-1.5 py-0.5 bg-canvas hover:bg-noir hover:text-white border border-taupe/30 text-[10px] font-medium rounded-2xs flex items-center gap-1 transition-colors"
                            title={`Ajouter la couleur ${p.labelFr}`}
                          >
                            <span
                              className="w-2.5 h-2.5 rounded-full border border-black/30 inline-block"
                              style={{ backgroundColor: p.hex }}
                            />
                            <span>+{p.labelFr}</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Quick Bulk Fill Bar */}
                  <div className="flex flex-wrap items-center justify-between gap-2 bg-[#FAF7F2] border border-taupe/20 px-3 py-2 rounded-xs">
                    <span className="text-[11px] font-semibold text-noir">
                      ⚡ Remplissage rapide : appliquer une même quantité à toutes les tailles & couleurs :
                    </span>
                    <div className="flex items-center gap-2">
                      <input
                        type="number"
                        min="0"
                        value={bulkFillValue}
                        onChange={(e) => setBulkFillValue(e.target.value)}
                        className="w-16 bg-white border border-taupe/30 px-2 py-1 text-center font-mono font-bold text-xs"
                      />
                      <button
                        type="button"
                        onClick={handleApplyBulkQty}
                        className="px-3 py-1 bg-noir hover:bg-caramel text-white text-[11px] font-semibold rounded-2xs transition-colors"
                      >
                        Appliquer partout
                      </button>
                    </div>
                  </div>

                  {/* Interactive Size × Color Quantity Matrix Table */}
                  <div className="overflow-x-auto border border-taupe/25 rounded-xs">
                    <table className="w-full text-left border-collapse text-xs">
                      <thead>
                        <tr className="bg-canvas border-b border-taupe/25 text-noir font-bold">
                          <th className="p-2.5 border-r border-taupe/20 min-w-[130px]">
                            Couleur \ Taille
                          </th>
                          {parsedSizes.map(sz => (
                            <th key={sz} className="p-2.5 text-center border-r border-taupe/15 font-mono min-w-[76px]">
                              {sz}
                            </th>
                          ))}
                          <th className="p-2.5 text-center bg-[#EFECE6] font-mono min-w-[80px]">
                            Sous-total
                          </th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-taupe/15">
                        {parsedColors.map(col => {
                          const cName = getColorLabel(col, 'fr');
                          const cHex = getColorCss(col);
                          const rowSum = parsedSizes.reduce((acc, sz) => acc + getCellQty(sz, col), 0);
                          return (
                            <tr key={col} className="hover:bg-canvas/50">
                              <td className="p-2.5 border-r border-taupe/20 font-semibold text-noir">
                                <div className="flex items-center gap-2">
                                  <span
                                    className="w-4 h-4 rounded-full border border-black/25 shrink-0"
                                    style={{ backgroundColor: cHex }}
                                  />
                                  <span>{cName}</span>
                                </div>
                              </td>
                              {parsedSizes.map(sz => {
                                const cellVal = getCellQty(sz, col);
                                const isZero = cellVal <= 0;
                                return (
                                  <td key={sz} className="p-2 text-center border-r border-taupe/15">
                                    <input
                                      type="number"
                                      min="0"
                                      value={cellVal}
                                      onChange={(e) => setCellQty(sz, col, e.target.value)}
                                      className={`w-16 text-center font-mono font-bold px-1.5 py-1 border rounded-2xs focus:outline-none ${
                                        isZero
                                          ? 'bg-red-50 border-red-300 text-red-700'
                                          : 'bg-white border-emerald-400 text-noir focus:border-caramel'
                                      }`}
                                    />
                                    <div className={`text-[9px] mt-0.5 font-semibold ${isZero ? 'text-red-600' : 'text-emerald-700'}`}>
                                      {isZero ? 'Épuisé (0)' : `${cellVal} en stock`}
                                    </div>
                                  </td>
                                );
                              })}
                              <td className="p-2.5 text-center font-mono font-bold bg-[#FAF9F6] text-noir">
                                {rowSum} ex.
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div>
                  <label className="block font-bold uppercase mb-1">Description (FR)</label>
                  <textarea
                    rows="2"
                    value={descFr}
                    onChange={(e) => setDescFr(e.target.value)}
                    className="w-full bg-card border border-taupe/30 p-2"
                  />
                </div>

                <div>
                  <label className="block font-bold uppercase mb-1">Description (AR)</label>
                  <textarea
                    rows="2"
                    dir="rtl"
                    value={descAr}
                    onChange={(e) => setDescAr(e.target.value)}
                    className="w-full bg-card border border-taupe/30 p-2"
                  />
                </div>

                <div className="pt-2 flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-4 py-2 border border-taupe/30 hover:border-noir text-noir"
                  >
                    Annuler
                  </button>
                  <button
                    type="submit"
                    className="px-6 py-2 bg-noir text-white font-semibold uppercase tracking-wider hover:bg-caramel transition-colors"
                  >
                    Enregistrer sur Firebase
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      // ========================================================================
      // MOUNT APPLICATION
      // ========================================================================
      const rootEl = document.getElementById('root');
      if (rootEl) {
        ReactDOM.createRoot(rootEl).render(<App />);
      }
    </script>
  </body>
</html>
